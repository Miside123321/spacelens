/* ================= 动量惯性滚动 + 橡皮筋回弹 =================
   给一个滚动容器挂上：滚轮有惯性，滑到边界有阻尼回弹。
   注意 transform 必须打在内层 .sc-in 上 —— scrollTop 会被浏览器钳在
   [0,max]，越界写不进去，橡皮筋那点位移根本渲染不出来。 */
const SCROLLERS = new WeakMap();

function inertia(el){
  if(!el || SCROLLERS.has(el)) return SCROLLERS.get(el);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return null;

  const inner = document.createElement('div');
  inner.className = 'sc-in';
  while(el.firstChild) inner.appendChild(el.firstChild);
  el.appendChild(inner);
  const bar = document.createElement('i');
  bar.className = 'sc-bar';
  el.appendChild(bar);
  el.classList.add('sc', 'fadebox');

  /* ---------------- 手感参数（想调就改这一块） ----------------
     SMOOTH   渲染位置追赶滚轮的速度。越大越跟手，越小越飘。
              0.40 ≈ 一格滚轮约 100ms 滑到位（0.22 时是 200ms，"顺滑过头"）
     FRICTION 惯性每帧保留多少速度。越大甩得越远。
     FLICK    滚动速度换算成惯性的倍率。越大甩得越远。
     SPRING   橡皮筋弹簧刚度；DAMP 是阻尼，越大回弹越"闷"。
     MAXR     橡皮筋最多拉出多少 px（还要再乘视口比例的系数）。 */
  const SMOOTH = 0.40;
  const FRICTION = 0.88;
  const FLICK = 0.62;
  const SPRING = 0.22;
  const DAMP = 0.44;
  const VMAX = 38;                  // 单帧最大速度(px)。110 时甩一下能飞两千像素，太飘
  let MAXR = 120;                   // 橡皮筋上限，实际值在 measure() 里按视口高度算
  const S = {raw: 0, goal: 0, vel: 0, max: 0, wheel: false, raf: 0, t: 0,
             wt: 0, samples: [], drag: 0, barY: 0, barH: 0,
             spring: 0, bound: 0};
  SCROLLERS.set(el, S);
  el.__sc = S;                      // 方便调试 / 自动化测试读状态
  /* 直接跳到某个位置（返回上一层恢复滚动位置用）。
     ★ 必须走这里：滚动是靠 transform 做的，外层 scrollTop 恒为 0，
       直接写 scrollTop 什么也不会发生。 */
  S.to = v => {
    S.raw = Math.max(0, Math.min(S.max, v));
    S.goal = S.raw; S.vel = 0; S.spring = 0;
    apply();
  };

  // 给元素挂个 innerHTML 的 shadow：所有 listEl.innerHTML = ... 照旧写，
  // 实际落到内层，外层容器和自绘滚动条不会被冲掉。
  Object.defineProperty(el, 'innerHTML', {
    configurable: true,
    get: () => inner.innerHTML,
    set: v => {
      inner.innerHTML = v; S.raw = 0; S.goal = 0; S.vel = 0; S.spring = 0;
      // ★ 内存页有自己的高度规则（见 .list.mem-mode）。在这里统一判断，
      //   省得每个 loadXxx 都去挂/摘 —— 只要新内容是 .memgrid 就进"内存模式"。
      el.classList.toggle('mem-mode', !!inner.querySelector('.memgrid'));
      // 重放淡入动画：先把 animation 关掉强制回流，再打开
      inner.style.animation = 'none'; void inner.offsetWidth; inner.style.animation = '';
      measure(); apply();
    },
  });

  /* 越界时按比例压缩：拉得越远越硬，永远拉不出 MAXR */
  const soft = v => {
    if(v < 0) return -MAXR * (-v) / (-v + MAXR);
    if(v > S.max){ const o = v - S.max; return S.max + MAXR * o / (o + MAXR); }
    return v;
  };
  /* ★ 这两个高度是**布局读数**。以前每帧都在 frame() 里量一次，而 apply() 里
     先写 transform、紧接着又读 inner.offsetHeight —— 写完再读会强制同步布局，
     2000 行的列表等于每帧重排一次，这是滚动卡的主因。现在只在"尺寸真的变了"
     （ResizeObserver / 换内容后 S.dirty）时量，apply() 里一个布局读都没有。 */
  const measure = () => {
    S.innerH = inner.offsetHeight;
    S.viewH = el.clientHeight;
    S.max = Math.max(0, S.innerH - S.viewH);
    // 橡皮筋幅度跟视口走；行少的列表滚动范围小，拉出 130px 太夸张了
    MAXR = Math.min(120, Math.max(48, S.viewH * 0.16));
    el.classList.toggle('sc-none', S.max < 2);
  };

  let liveT = 0;
  const apply = () => {
    if(S.dirty || S.viewH === undefined){ S.dirty = 0; measure(); }
    // 先算后写：全程用缓存值，中途不读任何布局
    if(S.max > 0){
      const vh = S.viewH || 0;
      const track = vh - 4;
      const bh = Math.max(30, Math.round(track * vh / Math.max(S.innerH || 1, 1)));
      S.barH = Math.min(bh, track);
      const y = 2 + (track - S.barH) * Math.min(1, Math.max(0, S.raw / S.max));
      // 越界时滚动条顶住边界（跟着内容跑反而更乱）
      S.barY = Math.max(2, Math.min(2 + track - S.barH, y));
      if(bar._h !== S.barH){ bar._h = S.barH; bar.style.height = S.barH + 'px'; }
      if(bar._y !== S.barY){ bar._y = S.barY; bar.style.top = S.barY + 'px'; }
    }
    // 上下渐隐：只在真的还有内容可滚的那一侧才淡出。
    // 每帧都写 classList 会平白触发样式失效，所以先比一下再写。
    const atTop = S.max < 2 || S.raw <= 2;
    const atBot = S.max < 2 || S.raw >= S.max - 2;
    if(atTop !== S._atTop){ S._atTop = atTop; el.classList.toggle('at-top', atTop); }
    if(atBot !== S._atBot){ S._atBot = atBot; el.classList.toggle('at-bot', atBot); }
    el.classList.toggle('sc-live', S.wheel || !!S.vel || !!S.drag);
    clearTimeout(liveT);
    liveT = setTimeout(() => el.classList.remove('sc-live'), 700);
    // transform 放到最后：本帧唯一必须落地的写，前面没有布局读，
    // 浏览器就能把它并到下一帧统一算。
    inner.style.transform = 'translate3d(0,' + (-S.raw).toFixed(2) + 'px,0)';
    // overflow:hidden 的元素**仍然**可以被程序滚动（比如焦点跳转），
    // 那会跟我们的 transform 叠成"滚两次"，所以把原生位移钉回 0。
    if(el.scrollTop) el.scrollTop = 0;
    if(el.scrollLeft) el.scrollLeft = 0;
  };

  const step = h => {
    if(S.drag) return;
    /* ---- 先推进"目标位置" goal：惯性 / 橡皮筋都作用在它上面 ---- */
    if(!S.wheel){
      // 越界了就记住顶到的是哪条边，弹簧从此独立跑
      if(S.goal < 0){ S.spring = 1; S.bound = 0; }
      else if(S.goal > S.max){ S.spring = 1; S.bound = S.max; }
      // ★ 回到合法范围内就把弹簧放开。少了这一句：滑到底触发橡皮筋之后
      //   再往回滑，spring 和过期的 bound(=max) 会一直留着，松手瞬间
      //   弹簧把人拽回最底下 —— 就是"往上滑却自己弹回去"那个 bug。
      // ★ 这里原来少一个回到范围内就放开的分支，但光加它还不够：
      //   真正的病根是**回弹还没结束的时候用户往回滚**，spring 一直挂着
      //   （bound 还是那个边界），等滚轮停下弹簧继续把人拽回去 ——
      //   表现就是往上滑却自己弹回最底下。修法见 wheel 里那句 S.spring = 0。
      else if(S.spring && S.vel === 0){ S.spring = 0; }
    }
    if(!S.wheel && S.spring){
      /* 橡皮筋回弹：弹簧 + 阻尼，允许轻微过冲；★ 用 S.spring 记住"正在回弹"，
         不能只看"当前越界" —— 过冲穿过边界那一刻会掉进惯性分支，
         速度被带出去，列表就自己加速滑走了。 */
      const x = S.goal - S.bound;
      S.vel += (-x * SPRING - S.vel * DAMP) * h;
      S.goal = soft(S.goal + S.vel * h);
      if(Math.abs(S.goal - S.bound) < 0.4 && Math.abs(S.vel) < 0.8){
        S.goal = S.bound; S.vel = 0; S.spring = 0;
      }
    }else if(!S.wheel && Math.abs(S.vel) > 0.15){
      // 惯性滑行
      S.goal = soft(S.goal + S.vel * h);
      S.vel *= Math.pow(FRICTION, h);
    }else if(!S.wheel){
      S.vel = 0;
    }
    /* ---- 再让 raw 平滑追赶 goal ★
       滚轮一格是 120px 的硬位移，直接写进 raw 就是"一格一格跳"。
       这里按帧率无关的指数平滑去追（约 200ms 收完 95%），
       慢滚变成顺滑的一小段滑行，快滑只是稍微跟手一点。 */
    const gap = S.goal - S.raw;
    if(gap){
      S.raw += gap * (1 - Math.pow(1 - SMOOTH, h));
      if(Math.abs(S.goal - S.raw) < 0.05) S.raw = S.goal;
    }
  };

  function frame(now){
    S.raf = 0;
    const dt = Math.min(50, S.t ? now - S.t : 16.7);
    S.t = now;
    const st = dt / 16.7;                       // 归一化到 60fps 的步数
    // 这里**不量高度**：每帧量 = 每帧强制布局。尺寸变了由 ResizeObserver
    // 和 S.dirty（换内容后）触发，apply() 里会自己补量。
    // ★ 定步长子步积分：浏览器卡一下 dt 会很大，弹簧按大步长积分会直接发散
    //   （实测无头浏览器 50ms 一帧时，橡皮筋越弹越大 147 → 更远，回不到边界）。
    const n = Math.max(1, Math.min(6, Math.ceil(st)));
    const h = st / n;                      // h≈1 就是 16.7ms
    for(let i = 0; i < n; i++) step(h);
    apply();
    if(S.wheel || S.drag || S.vel || S.spring ||
       Math.abs(S.goal - S.raw) > 0.1 || S.raw < 0 || S.raw > S.max)
      S.raf = requestAnimationFrame(frame);
    else S.t = 0;
  }
  const kick = () => { if(!S.raf) S.raf = requestAnimationFrame(frame); };
  S.kick = kick;              // 键盘选行时要能在外面把循环踢起来

  el.addEventListener('wheel', e => {
    if(S.max <= 0) return;                      // 内容没超出，交回浏览器
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 18 : (e.deltaMode === 2 ? el.clientHeight : 1);
    const d = e.deltaY * unit;
    // 滚轮里做布局读会拖慢每一次滚动；高度用缓存值就够了
    if(S.dirty){ S.dirty = 0; measure(); }
    S.goal = soft(S.goal + d);
    S.wheel = true;
    // ★ 用户一开始滚，就把还没跑完的回弹交还给他。
    //   少了这句：在到底回弹的过程中往回滚，松手后弹簧会把人拽回最底下。
    S.spring = 0;
    const now = performance.now();
    S.samples.push([now, d]);
    while(S.samples.length && now - S.samples[0][0] > 120) S.samples.shift();
    clearTimeout(S.wt);
    S.wt = setTimeout(() => {
      S.wheel = false;
      const q = S.samples; S.samples = [];
      if(q.length >= 2){
        const span = Math.max(8, q[q.length - 1][0] - q[0][0]);
        const dist = q.reduce((a, x) => a + x[1], 0);
        S.vel = Math.max(-VMAX, Math.min(VMAX, dist / span * 16.7 * FLICK));
      }
      kick();
    }, 55);
    apply();
    kick();
  }, {passive: false});

  // ---- 拖滚动条 ----
  bar.addEventListener('pointerdown', e => {
    if(S.max <= 0) return;
    e.preventDefault(); e.stopPropagation();
    bar.setPointerCapture(e.pointerId);
    S.drag = 1; S.vel = 0; S.wheel = false; S.spring = 0;
    el.classList.add('sc-drag');
    const track = el.clientHeight - 4;
    const from = e.clientY, base = S.goal;
    const move = ev => {
      const span = Math.max(1, track - S.barH);
      S.goal = Math.max(0, Math.min(S.max, base + (ev.clientY - from) * S.max / span));
      S.raw = S.goal;                    // 拖滚动条要 1:1 跟手，不做平滑
      apply();
    };
    const up = () => {
      S.drag = 0;
      el.classList.remove('sc-drag');
      bar.removeEventListener('pointermove', move);
      bar.removeEventListener('pointerup', up);
      bar.removeEventListener('pointercancel', up);
      kick();
    };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
    bar.addEventListener('pointercancel', up);
  });

  // 内容/窗口尺寸变了就重新量一次
  if(window.ResizeObserver){
    const ro = new ResizeObserver(() => { measure(); kick(); });
    // 内容一换（innerHTML）就打个脏标记：scroll 范围由下一次 apply 重量。
    // 以前是每帧都量，所以任何渲染路径都不用管；现在得有人通知一下，
    // 用 MutationObserver 兜住所有渲染路径，省得漏掉哪个视图。
    try{
      new MutationObserver(() => { S.dirty = 1; }).observe(inner, {childList: true});
    }catch(e){}
    ro.observe(inner); ro.observe(el);
  }
  measure(); apply();
  return S;
}

/* ================= 鼠标跟随聚光灯（逐行） =================
   行是每次渲染都重建的，所以用事件委托，一次绑定永久有效。
   挂在 document 上是为了同时覆盖：排行榜/清理/软件的行、类型分布的图例、
   关于面板的更新日志条目 —— 它们分属不同的容器，但用的是同一套效果。
   mousemove 用 rAF 合并：一帧只写一次 CSS 变量。 */
(function rowSpotlight(){
  let px = 0, py = 0, cur = null, queued = false;
  document.addEventListener('mousemove', ev => {
    const row = ev.target && ev.target.closest
      ? ev.target.closest('.row,.lg,.clog') : null;
    if(!row) return;
    const r = row.getBoundingClientRect();
    cur = row;
    px = ev.clientX - r.left;
    py = ev.clientY - r.top;
    if(queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      if(!cur) return;
      cur.style.setProperty('--mx', px.toFixed(1) + 'px');
      cur.style.setProperty('--my', py.toFixed(1) + 'px');
    });
  });
})();

function tableHead(html){ listHeadEl.innerHTML = html || ''; }
let SPIN_T0 = 0;
function spinner(text, sub){
  // ★ 必须复用同一个 DOM 节点：
  //   搜索 / 清理 / 软件 这几页每 450ms 轮询一次，如果每次都重写 innerHTML，
  //   转圈动画就会被反复重置回 0°（周期 0.8s > 间隔 0.45s，永远转不完一圈），
  //   看起来就是一跳一跳、不连贯。这里只在文字变了的时候改 textContent。
  let box = listEl.querySelector('#spinBox');
  if(!box){
    listEl.innerHTML = '<div class="empty" id="spinBox">' +
      '<div class="spin"></div><div class="spin-t"></div>' +
      '<div class="pbar"><i></i></div><div class="sub2"></div></div>';
    box = listEl.querySelector('#spinBox');
  }
  const t = box.querySelector('.spin-t');
  const tv = text || '';
  // 后端把百分比并进进度文字里（"… · 23%"，没有分母时就没有这一段）
  const pm = /(\d{1,3})%/.exec(tv);
  const bar = box.querySelector('.pbar');
  if(bar){
    if(pm){
      bar.style.display = '';
      const fill = bar.querySelector('i');
      const w = Math.min(100, Number(pm[1])) + '%';
      if(fill._w !== w){ fill._w = w; fill.style.width = w; }
    } else if(bar.style.display !== 'none'){
      bar.style.display = 'none';
    }
  }
  if(t.textContent !== tv){ t.textContent = tv; SPIN_T0 = Date.now(); }
  const s = box.querySelector('.sub2');
  // ★ 扫描要好一会儿，光转圈看不出是"在干活"还是"卡死了"。
  //   这里把已经等了多少秒叠上去 —— 数字一直在涨就说明还活着。
  if(!SPIN_T0) SPIN_T0 = Date.now();
  const sec = Math.max(0, Math.round((Date.now() - SPIN_T0) / 1000));
  const sv = (sub || '') + (sec >= 2 ? ((sub ? ' · ' : '') + '已等待 ' + sec + ' 秒') : '');
  if(s.textContent !== sv) s.textContent = sv;
  s.style.display = sv ? '' : 'none';
}

  const r = document.documentElement;
  r.classList.toggle('no-press', !ANIM_PRESS);
  r.classList.toggle('no-ripple', !ANIM_RIPPLE);
  r.classList.toggle('no-sweep', !LOAD_SWEEP);
  r.classList.toggle('no-stagger', !TILE_ANIM);
  r.classList.toggle('no-bg', !BGANIM);
}
let BGANIM = true;         // 背景滚动光斑（关掉能省一大截 GPU/CPU）
let DUPANIM = true;        // 查重展开动画（关掉 = 瞬间展开/收起，最省）
let DUPPIC = true;         // 查重页要不要显示缩略图（组封面 + 每份副本）
let FILEPIC = true;        // 文件本身是图片/视频时，要不要生成缩略图（独立于文件夹门面）
let FOLDERPIC = true;      // 文件夹要不要拿内容图当门面（设置里的胶囊开关）
let HIDETOP = true;        // 最外层文件夹不给缩略图（隐私）
let ONECLICK = true;       // 单击直接打开；关掉 = 先选中、双击才打开
let SEARCHFOLD = true;     // 搜索时把"命中文件夹的内容"折叠进文件夹（设置里可关）
function applyView(m){ VIEW = (m === 'grid') ? 'grid' : 'list'; }

/* 放在卡头右上角和"重新扫描"一排，而不是藏进设置里 */

function bindViewSeg(){
  const el = document.getElementById('viewSeg');
  const pe = document.getElementById('picSeg');
  const de = document.getElementById('dupSeg');
  if(de) de.querySelector('b').onclick = () => showDup(path || '');
  if(pe){
    const pb = pe.querySelector('b');
    /* ★ 这是**总开关**：一次关掉所有缩略图（图片/视频 + 文件夹门面）。
       任何一个还开着 -> 全关；全关了 -> 全开。
       设置里那两个细分开关（文件夹缩略图 / 图片视频缩略图）保留，用来单独控制。 */
    pb.onclick = async () => {
      const anyOn = FOLDERPIC || FILEPIC;
      FOLDERPIC = !anyOn;
      FILEPIC = !anyOn;
      pb.classList.toggle('on', !anyOn);
      pb.classList.remove('pop'); void pb.offsetWidth; pb.classList.add('pop');
      setTimeout(() => pb.classList.remove('pop'), 400);
      const sw = document.getElementById('swFold');
      if(sw) sw.classList.toggle('on', FOLDERPIC);
      const sf = document.getElementById('swFile');
      if(sf) sf.classList.toggle('on', FILEPIC);
      if(TAB === 0 || TAB === -1) refreshRank();          // 原地重画，别跳回顶部
      await act('setpref', 'folderPic=' + (FOLDERPIC ? '1' : '0'));
      await act('setpref', 'filePic=' + (FILEPIC ? '1' : '0'));
    };
  }
  if(!el) return;
  el.querySelectorAll('b').forEach(b => {
    b.onclick = async () => {
      if(b.dataset.v === VIEW) return;
      applyView(b.dataset.v);
      b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
      setTimeout(() => b.classList.remove('pop'), 400);
      el.querySelectorAll('b').forEach(x => x.classList.toggle('on', x === b));
      if(TAB === 0 || TAB === -1) refreshRank();           // 原地重画，别跳回顶部
      await act('setpref', 'viewMode=' + VIEW);
    };
  });
}
/* 能出缩略图的后缀：图片 + 视频（视频走 Windows 缩略图接口，给一帧画面） */
const isImg = p => /\.(jpe?g|png|gif|bmp|tiff?|webp|heic|avif|jxr|hdp|mp4|mkv|avi|mov|wmv|webm|m4v|mpg|mpeg|flv)$/i.test(p || '');

/* 方块平铺。缩略图分两步：先渲染占位图标，再一批生成，成功的才换上去 ——
   否则几十张图同时 404，会闪一片破图。 */
/* 每个目录记住自己的滚动位置：从子目录返回时直接回到原处，
   不用再滑一遍。只在"进入/返回"这种换目录的场景记，同目录重扫不覆盖。 */
const SCROLLMEM = {};
function saveScroll(){
  if(!listEl) return;
  const sc = listEl.__sc;
  // ★ 位置在 __sc.raw 里，不在 scrollTop（滚动是 transform 做的，scrollTop 一直是 0）
  SCROLLMEM[path || ''] = Math.round(sc ? sc.raw : (listEl.scrollTop || 0));
}
function restoreScroll(){
  const v = SCROLLMEM[path || ''] || 0;
  if(!v) return;
  const sc = listEl.__sc;
  if(sc && sc.to) sc.to(v);
  else listEl.scrollTop = v;
}

/* 只是"换个显示方式/开关缩略图"时的重画：先把此刻的滚动位置记下来再重画，
   否则重画会把位置清零、回到最上面。开关不改 path，所以存的就是当前位置。 */
function refreshRank(){
  saveScroll();
  // ★ 搜索页（TAB = -1）切视图要重画搜索结果，不能跳回文件夹排行
  if(TAB === -1 && QUERY){ loadSearch(); return; }
  loadRank();
}

let VWIN = 10000;   // 一次渲染多少项（v1.0.4：用户要求去掉"显示更多"，直接全显示）

function renderRankGrid(rows, rerender){
  const tot = rows.reduce((a, r) => a + r.size, 0) || 1;
  const mx = Math.max.apply(null, rows.map(r => r.size)) || 1;
  const shown = rows.slice(0, VWIN);
  listEl.innerHTML = '<div class="grid">' + shown.map((r, i) => `
    <div class="tile${r.isDir ? ' dir' : ''}${i < 64 ? '' : ' noin'}" data-p="${esc(r.path)}" data-d="${r.isDir ? 1 : 0}"
         title="${esc(r.name)}\n${esc(r.path)}\n${r.sizeText} · 占这一层 ${(r.size / tot * 100).toFixed(1)}%">
      <div class="tcell">${
        (!r.isDir && isImg(r.path) && FILEPIC) ||
        (r.isDir && r.pick && FOLDERPIC && !(HIDETOP && r.top))
          ? '<i class="tph"></i>'
          : typeIcon(r.g, r.isDir ? pal().dir : r.color, !!r.isDir)}</div>
      <div class="tname">${r.nameHTML != null ? r.nameHTML : esc(r.name)}</div>
      <div class="tmeta">${r.metaHTML != null ? r.metaHTML
                          : (r.metaText != null ? esc(r.metaText)
                             : (r.isDir ? ((r.files || 0) + ' 个文件')
                                        : esc(r.mtimeText || '')))}</div>
      <div class="tsize">${r.sizeText}</div>
      <div class="tbar"><i style="width:${barW(r.size / mx).toFixed(1)}%"></i></div>
    </div>`).join('') +
    (rows.length > shown.length
      ? '<div class="morebox"><button class="mini" id="moreBtn">显示更多（还有 ' +
        (rows.length - shown.length).toLocaleString() + ' 项）</button>' +
        '<span class="moresub">已显示 ' + shown.length + ' / ' + rows.length +
        ' 项</span></div>'
      : '') + '</div>';
  requestAnimationFrame(() => {
    // 条形宽度已经在模板里内联好了（不然首屏会同时跑上千个 width 过渡）
    if(listEl.__sc) listEl.__sc.dirty = 1;      // 内容换了，滚动高度要重量
    restoreScroll();
  });

  const _mb = listEl.querySelector('#moreBtn');
  if(_mb) _mb.onclick = () => {
    saveScroll(); VWIN += 240; (rerender || loadRank)();     // 搜索页要重画搜索
  };
  const tiles = [...listEl.querySelectorAll('.tile')];
  // ★ 屏外的格子是按 contain-intrinsic-size 的**估算高度**占位的。估错了，
  //   还没渲染到的格子就会和已经渲染的不一样高 —— 就是截图里"分格大小不一样"。
  //   所以量一次真实高度写回变量，估算立刻变准。
  /* ★ 卡片入场：从屏幕中心逐层飞出来。
     起始位置朝网格中心收（--fx/--fy），起始 scale 略大（更靠近观者），
     延迟按"离中心的距离"排 —— 中心那张先落地，然后一圈一圈往外。
     这些必须在这里算：模板里拿不到布局几何。 */
  requestAnimationFrame(() => {
   try{
    const grid = listEl.querySelector('.grid');
    if(!grid){ tiles.forEach(t => t.classList.add('in-anim')); return; }
    const gr = grid.getBoundingClientRect();
    const cx = gr.left + gr.width / 2;
    const cy = gr.top + gr.height / 2;
    const live = tiles.slice(0, 64);
    let maxD = 1;
    const geo = live.map((t, i) => {
      const r = t.getBoundingClientRect();
      const dx = cx - (r.left + r.width / 2);
      const dy = cy - (r.top + r.height / 2);
      const d = Math.sqrt(dx * dx + dy * dy);
      if(d > maxD) maxD = d;
      return [t, dx, dy, d, i];
    });
    // 进入下一级从左边滑进来，返回上一级从右边展开（比路径深浅判断）
    const cur = String(path || "").toLowerCase();
    const prev = String(PREVPATH || "").toLowerCase();
    const deeper = !prev || (cur !== prev && cur.indexOf(prev) === 0);
    geo.forEach(([t, dx, dy, d, i]) => {
      // ★ 位移必须很小：卡片只能在自己的格子里抖一下。上一版按 0.8×距离朝中心收，
      //   等于每张卡横穿半个网格，飞行途中必然互相穿插、叠在一起（iOS 那个动画
      //   其实没有横向位移 —— 它是从观者方向压进来 + 淡入 + 按圈错开）。
      //   所以这里把位移夹到 8px 以内，深度交给 scale 表达。
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const k = Math.min(8, len) / len;
      t.style.setProperty('--fx', ((deeper ? -1 : 1) * 38) + 'px');
      t.style.setProperty('--fy', '0px');
      const ms = TILE_ANIM ? Math.min(i * 18, 540) : Math.min(i * 14, 400);
      t.style.animationDelay = ms + 'ms';
      t.classList.add('in-anim');
    });
    PREVPATH = String(path || "");
   }catch(err){
    // ★ 保险：入场这步出任何错，也必须让卡片显示出来 ——
    //   否则整片网格停在 opacity:0，看起来就是一片空白。
    console.error('入场动画失败：', err);
    tiles.forEach(t => t.classList.add('in-anim'));
   }
  });
  const measureTile = () => {
    const t0 = tiles[0];
    if(t0 && t0.offsetHeight){
      document.documentElement.style.setProperty('--tile-h', t0.offsetHeight + 'px');
    }
  };
  // 量两次：第一帧有时还没算完（实测先量到 180、实际是 205），
  // 再等一拍写一次终值。
  requestAnimationFrame(measureTile);
  setTimeout(measureTile, 400);
  const activate = el => {
    const p = el.dataset.p;
    if(el.dataset.d === '1'){ saveScroll(); path = p; loadRank(); }
    else { act('open', p); }        // 文件：直接用系统默认程序打开
  };
  tiles.forEach((el, i) => {
    // ★ 打开只认真正的双击（或 Enter）。之前是"已经选中再点一次就打开"，
    //   那是伪双击 —— 连着点两下不该等于双击，用户明确说了不要这样。
    el.onclick = () => { setSel(i); if(ONECLICK) activate(el); };
    el.ondblclick = () => activate(el);
    el.oncontextmenu = ev => ctxMenu(ev, [
      {label: el.dataset.d === '1' ? '打开所在文件夹' : '在资源管理器中显示',
       fn: () => act('reveal', el.dataset.p)},
      {label: '复制路径', fn: () => copy(el.dataset.p)},
    ]);
  });
  // 图片文件用自己；文件夹只有在"以文件为主"时才用它的代表图（后端给 pick）
  // ★ 文件夹要**它自己**的缩略图（系统有专门的文件夹缩略图，还会缓存），
  //   而不是"挑里面最大的一张图去解" —— 那正是以前卡的原因。
  const want = [];
  /* ★ 超大视频（取一帧要几百毫秒到几秒）排到最后：页面上其它图都做完才轮到它。
     判据：视频扩展名 + 文件 > 300MB。 */
  const SLOWMEDIA = /[.](mp4|mkv|avi|mov|wmv|webm|m4v|ts|m2ts|mpg|mpeg|flv)$/i;
  const SLOW = {};
  const markSlow = (p, sz) => {
    if(sz > 300 * 1024 * 1024 && SLOWMEDIA.test(p)) SLOW[String(p).toLowerCase()] = 1;
  };
  rows.forEach((r, i) => {
    if(!r.isDir && isImg(r.path) && FILEPIC){
      want.push([i, r.path]);
      markSlow(r.path, r.size || 0);
    }
    // ★ 只给"里面有图/视频"的文件夹要缩略图（r.hasv）。目录里没有媒体时，
    //   系统只能给一张纯文件夹图标（黄色那张）——那正是要避免的东西。
    else if(r.isDir && r.pick && FOLDERPIC && !(HIDETOP && r.top)) want.push([i, r.path]);
  });
  if(!want.length) return;
  // ★ 分批发，别把几百条路径全塞进一个 URL：
  //   中文路径转义后一条 ~200 字符，几百条就顶到 http.server 的请求行上限（64KB），
  //   整个请求会失败 —— 表现就是"一张图都没有"或者只出来一部分。
  // ★ 批次要小。大图一张解码要好几秒，一批 120 个必须**全部**做完才返回，
  //   结果是第一批就等一分钟、中间什么都不显示。12 个一批，几个大图两秒出一波。
  const CHUNK = 12;
  const cells = listEl.querySelectorAll('.tile .tcell');
  // 把一张缩略图放上去：小图先铺、真图淡入
  const put = (i, p, o) => {
    // 队列可能来自上一次渲染（那时行序不一样），所以序号不能单独信 ——
    // 必须核对路径。实机上出现过：一个 0 文件的文件夹格子里冒出一张
    // 黄文件夹图标，就是上一批的图按老序号贴错了格子。
    let cell = (i >= 0 && cells[i] && cells[i].parentElement &&
                cells[i].parentElement.dataset.p === p) ? cells[i] : null;
    if(!cell){
      cell = [...cells].find(c => c.parentElement &&
                                  c.parentElement.dataset.p === p);
    }
    // ★ 幂等：格子里已经有真图就先移除，避免重复 appendChild 导致双画面重影
    //   （观察器触发、busy批次重试、快速滚动等边界时序下 put 可能被调多次）
    const oldFull = cell.querySelector('img.tfull');
    if(oldFull) oldFull.remove();

    const im = new Image();        // 真图在上面，加载完淡入
    im.className = 'tfull';
    im.alt = '';
    im.onload = () => {
      im.classList.add('in');
      // 骨架屏可以拿掉了：不拿走的话它会一直在清晰图后面扫光（白烧合成）
      const tp = cell.querySelector('.tph');
      if(tp) tp.remove();
      // 淡入完成后把模糊层摘掉。留着的话每个格子都挂着一个 blur(22px)
      // 滤镜，上千个格子滚动时每帧都要光栅化 —— 卡的主因之一。
      setTimeout(() => {
        if(im.classList.contains('in')) cell.classList.remove('blurup');
      }, 600);
    };
    im.onerror = () => { cell.classList.remove('blurup'); im.remove(); };
    im.src = o.u;
    cell.appendChild(im);
  };
  /* ★ 首屏秒开的关键一步：后端在 /api/rank 里已经把"缓存好的前几十张"
     一起带回来了（r.t）。直接塞进内存缓存，下面的 pending 就不会把它们
     当"要请求的"，第一帧就能贴上真图 —— 不用再等观察器、排队、往返。
     以前：375~640 ms 才出第一张；现在：约 180 ms，和列表本身同时到。
     没缓存到的（第一次看这个目录）t 不存在，行为跟以前完全一样。 */
  rows.forEach(r => {
    if(!r || !r.t) return;
    const k = String(r.path).toLowerCase();
    thumbRemember(r.path, Object.assign(THUMBCACHE.get(k) || {},
                                        {p: r.path, u: r.t}));
  });
  // 先用手上已经有的 —— 回到同一个目录时这条就够了，网络都不用走
  const pending = [];
  want.forEach(([i, p]) => {
    const hit = THUMBCACHE.get(String(p).toLowerCase());
    if(hit) put(i, p, hit);
    else pending.push([i, p]);
  });

  /* ★ 只给看得见的格子生成。
     以前是"打开目录就把 2000 张全生成"，所以慢；现在进视野才排队，
     滚到哪生成到哪 —— 首屏只要二三十张，几乎立刻满。 */
  const QUEUE = [];
  const byPath = {};
  pending.forEach(([i, p]) => { byPath[String(p).toLowerCase()] = p; });
  /* ★ "这个格子要不要缩略图"必须按**格子自己的路径**（data-p）判断。
     byPath 的键是"要请求的路径"—— 文件夹那里是里面那张图的路径，
     跟格子的 data-p（文件夹路径）对不上，于是文件夹永远排不进队列。
     所以另建一张按格子路径的表。 */
  const needPic = {};
  // ★ 用 pending（want 去掉已命中内存缓存的那部分）：用 want 的话，
  //   重进同一个目录/切视图时，已经贴着图的格子会被重新请求一遍。
  pending.forEach(([i]) => {
    const t = tiles[i];
    if(t && t.dataset.p) needPic[t.dataset.p.toLowerCase()] = 1;
  });
  let running = false, observed = 0;
  const myGen = ++THUMBGEN;         // 这一屏的代号
  const CHUNK2 = 16;                 // 一批小一点：批越小，第一张落地越快

  const cellOf = p => {
    const e = pending.find(x => String(x[1]).toLowerCase() === String(p).toLowerCase());
    return e ? cells[e[0]] : null;
  };

  /* 队列里的路径 -> 方块。★ 不能只按方块的 data-p 建表：
     文件夹排进队列的是"里面那张图"的路径，而方块的 data-p 是文件夹路径 ——
     只按 data-p 找就会找不到、把文件夹当成"这条作废"直接丢掉，
     结果就是文件夹的骨架屏一直转、一次请求都不发。 */
  const tileForPath = {};
  tiles.forEach(t => { if(t.dataset.p) tileForPath[t.dataset.p.toLowerCase()] = t; });
  pending.forEach(([i, p]) => {
    const t = tiles[i];
    if(t) tileForPath[String(p).toLowerCase()] = t;
  });

  /* ★ 每一批都重新挑"现在离视口中心最近的几个"，而不是先进先出。
     这样滑轮一划，优先级立刻跟着变：刚进屏幕的先做；滚出屏幕的
     （上下各让出 240px 余量之外的）直接跳过，不再白占解码时间。
     以前是一次性把整个队列取走、按入队顺序做，所以往下滑要等前面几十张做完。 */
  const nearest = (n, allowSlow) => {
    if(!QUEUE.length) return [];
    const vr = listEl.getBoundingClientRect();
    const mid = vr.top + vr.height / 2;
    const scored = [];
    // ★ 只扫队尾（最新的）这些条：队列可能上千，每批都读上千个 rect 反而卡滚动。
    //   排在前面的老条目自然会在后面的批次里被轮到。
    for(let i = QUEUE.length - 1; i >= Math.max(0, QUEUE.length - 40); i--){
      const _k = QUEUE[i].toLowerCase();
      if(!allowSlow && SLOW[_k]) continue;      // 慢条目：先跳过，等快的做完再说
      const el = tileForPath[_k];
      if(!el){ QUEUE.splice(i, 1); continue; }          // 已经换页了，这条作废
      const r = el.getBoundingClientRect();
      if(r.bottom < vr.top - 240 || r.top > vr.bottom + 240) continue;   // 屏外
      scored.push([Math.abs(r.top + r.height / 2 - mid), i]);
    }
    if(!scored.length) return QUEUE.splice(0, n);        // 屏内没有了就按原顺序
    const take = scored.sort((a, b) => a[0] - b[0]).slice(0, n)
                       .map(x => [x[1], QUEUE[x[1]]]);
    take.sort((a, b) => b[0] - a[0]).forEach(x => QUEUE.splice(x[0], 1));
    return take.map(x => x[1]);
  };

  /* 一次只跑一个请求（服务端那边是单任务锁），但每跑完一批立刻重新挑下一批 ——
     所以中途滑动能插队。队列长的时候一批 8 张（吃满服务端的线程），
     刚开始队列短就 4 张，先让第一张快点出来。 */
  // 拿不到图时把骨架屏收掉 —— 否则不支持的格式会永远转下去
  const giveUp = list => {
    list.forEach(p => {
      const t = tileForPath[String(p).toLowerCase()];
      const c = t && t.querySelector('.tcell');
      const tp = c && c.querySelector('.tph');
      if(tp) tp.remove();
      // 解不出缩略图的（超大视频等）：别留一块空白，给个类型图标
      if(c && !c.querySelector('img.tfull') && !c.querySelector('.fico-i')){
        c.innerHTML = typeIcon(0, pal().accent, false);
      }
    });
  };
  const tried = {};                       // 每条路径失败过几次
  /* ★ 静默续传：屏幕内（含 240px 余量）的做完之后，别就停在那儿等着用户滑。
     用户打开一个目录、不动鼠标的时候，剩下的应该在后台慢慢补完 ——
     等他往下滑的时候图已经在那儿了。
     用一个游标按原始顺序走 pending，不重复、不回头。 */
  let idleAt = 0;
  const nextIdle = n => {
    const out = [];
    while(out.length < n && idleAt < pending.length){
      const idx = idleAt++;
      const p = pending[idx][1];
      const cell = cells[pending[idx][0]];
      if(cell && cell.querySelector('img.tfull')) continue;   // 已经有图了
      if(QUEUE.indexOf(p) >= 0 || tried[p]) continue;         // 排队中/已知失败
      out.push(p);
    }
    return out;
  };
  const pump = () => {
    if(myGen !== THUMBGEN) return;         // 已经换了一屏，这轮作废
    if(running) return;
    let part = nearest(16, false);   // 小文件一次要一整屏（之前 12/16 一批，
                                  // 而且前端是等上一批回来才发下一批，
                                  // 所以 285 张图要跑增量十几轮）
    // 快条目（图片 + 小视频）都做完了，才开始啃超大视频
    if(!part.length) part = nearest(CHUNK2, true);
    // 屏幕内没有待做的了 -> 静默续传后面的（屏幕内的一旦出现会立刻抢占）
    if(!part.length) part = nextIdle(4);
    if(!part.length) return;
    running = true;
    // ★ 必须带超时：一个请求不返回，这条管线就永远停在那儿（整屏只剩占位块）。
    //   12 秒足够正常批处理完（一批 4~8 张，单张最多几秒）。
    const ctl = new AbortController();
    const guard = setTimeout(() => ctl.abort(), 12000);
    fetch('/api/thumbs?mode=big&p=' + encodeURIComponent(part.join('|')),
          {signal: ctl.signal})
      .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(res => {
        // ★ 服务端是"上一批没做完就整批拒绝"（返回 {busy:true}）。
        //   以前这里直接把空数组当完成，这一批就永久消失了 —— 格子一直转骨架屏。
        //   现在放回队首，歇一下再来（服务端本来也是串行的，这就是天然退避）。
        if(res && res.busy){
          QUEUE.unshift.apply(QUEUE, part);
          return new Promise(r => setTimeout(r, 120));
        }
        if(myGen !== THUMBGEN) return;
        const got = {};
        (res.ok || []).forEach(o => {
          if(!o || !o.p || !o.u) return;
          got[String(o.p).toLowerCase()] = 1;
          thumbRemember(o.p, Object.assign(THUMBCACHE.get(String(o.p).toLowerCase()) || {}, o));
          put(-1, o.p, o);
        });
        giveUp(part.filter(p => !got[String(p).toLowerCase()]));
      })
      .catch(e => {
        console.warn('这一批没取到：', e);
        // ★ 一次失败不代表永远失败（服务端重启、请求被中断都算瞬时失败）。
        //   以前直接 giveUp，那 8 格就永久空着；现在最多重试两次再放弃。
        const retry = part.filter(p => (tried[p] = (tried[p] || 0) + 1) < 3);
        if(retry.length) QUEUE.unshift.apply(QUEUE, retry);
        else giveUp(part);
      })
      .finally(() => {
        clearTimeout(guard);
        running = false;
        if(myGen !== THUMBGEN) return;
        // 静默续传时每批之间留 100ms，别和滚动/交互抢主线程
        if(!QUEUE.length) setTimeout(pump, 100); else pump();
      });
  };
  const drain = pump;      // 下面那些调用点不用改

  let io = null;
  if(listEl._io) listEl._io.disconnect();     // 上一屏的观察器要断掉，不然整套节点都留着
  try{
    io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if(!e.isIntersecting) return;
        observed++;
        const p = e.target.dataset.p;
        // ★ 只给"真的要缩略图"的格子排队 —— byPath 就是 want 里还没有缓存的那批
        //   （图片/视频，以及开关打开时才有门面的文件夹）。以前这里拿到
        //   dataset.p 就无条件推，于是：
        //     · 文件夹门面开关关掉了，缩略图照样被要回来（开关形同虚设）
        //     · .exe / .txt 这种根本不该有缩略图的格子也全去生成一遍
        if(p && needPic[String(p).toLowerCase()]) QUEUE.push(byPath[String(p).toLowerCase()] || p);
        io.unobserve(e.target);
      });
      drain();
    }, // ★ 700px 太大了：1360x900 下可见约 40 张，它却排队 112 张（放大 2.8 倍）。
              //   大图目录单张要 200~600ms，多排的 70 多张就是几秒白等。
              {root: listEl, rootMargin: '250px 0px'});
    listEl._io = io;
    tiles.forEach(t => io.observe(t));
  }catch(e){
    console.warn('观察器不可用，只补首屏：', e);
    QUEUE.push(...pending.slice(0, 40).map(x => x[1]));
    drain();
  }
  // 兜底：观察器要是没触发（比如被 transform 影响判断），别让整页空着
  setTimeout(() => {
    if(observed === 0 && QUEUE.length === 0){
      // ★ 兜底只补首屏：以前是 pending 全量，一个 2000 张的目录会一口气排满队。
      console.warn('观察器没触发，只补首屏');
      QUEUE.push(...pending.slice(0, 40).map(x => x[1]));
      drain();
    }
  }, 2000);
}
async function loadRank(){
  killChart();
  TAB = 0; setTabs(); GROUP = null; stopPoll();
  // 方向感：比上次深就从右滑入，比上次浅就从左滑入，同级（切页签/重扫）照旧从上方落
  const depthOf = p => (p ? p.split(/[\\/]/).filter(Boolean).length : 0);
  DIR = PREV_RANK === undefined ? 0 : Math.sign(depthOf(path) - depthOf(PREV_RANK));
  PREV_RANK = path;
  const d = await api('/api/rank?path=' + encodeURIComponent(path || ''));
  // ★ 注意：JS 里 [] 是真值，不能写 !d.rows —— 必须只看 ready
  if(!d.ready){ spinner('正在读取磁盘数据…'); poll(loadRank); return; }
  const crumbs = (d.crumb || []).map(c =>
    `<span data-p="${esc(c.path)}">${esc(c.name)}</span>`).join('<b>›</b>');
  tableHead('');
  // ★ 返回按钮放左边（原来在右边，和"进入下一层"的方向感对不上）
  const goUp = () => {
    saveScroll();                          // 记住当前这层滑到哪了
    path = path ? path.replace(/[\\/][^\\/]+$/, '') : null;
    if(path && path.length <= 2) path = null;
    loadRank();
  };
  const nD = d.nDirs || 0, nF = d.nFiles || 0;
  head('文件夹排行',
       (nD + nF) ? (nD + ' 个文件夹 · ' + nF + ' 个文件' +
                    (d.truncated ? '（文件只列最大的 ' + nF + ' 个）' : '') +
                    (VIEW === 'grid' ? ' · 单击选中 · 再点一次或双击打开'
                                     : ' · ↑↓ 选行 · Enter 进入 · ← 返回')) : '',
       viewSegHTML(), crumbs, d.canUp ? goUp : null);
  bindViewSeg();
  if(!d.rows.length){ emptyBox('这个文件夹下面是空的'); return; }
  if(VIEW === 'grid'){ renderRankGrid(d.rows); return; }
  // 列表这条路的滚动恢复：排在下面那个 rAF 之后再执行（同一帧里按注册顺序）
  requestAnimationFrame(restoreScroll);
  // title 里给的是**真实**占比 —— 别看条长短猜，条是按 BAR_GAMMA 压缩过的
  const totRank = d.rows.reduce((a, r) => a + r.size, 0) || 1;
  listEl.innerHTML = d.rows.map((r, i) => `
    <div class="row ${r.isDir ? '' : 'file'}${DIR > 0 ? ' in-r' : (DIR < 0 ? ' in-l' : '')}" data-p="${esc(r.path)}"
         data-d="${r.isDir ? 1 : 0}" style="animation-delay:${Math.min(i * 40, 600)}ms">
      ${iconSlot(r.isDir ? r.i : null, r.g,
                  r.isDir ? pal().dir : r.color, !!r.isDir)}
      <div class="rmain">
        <div class="rname" title="${esc(r.name)}">${esc(r.name)}</div>
        <!-- 下面这行原来写「985.6 GB · 50,391 个文件」，可右边已经有大小了，
             等于把 GB 显示了两遍 —— 改成显示完整路径更有用 -->
        <div class="rmeta" data-fit title="${esc(r.path)}">${esc(r.path)}</div>
      </div>
      <div class="rbar" title="占这一层 ${(r.size / totRank * 100).toFixed(1)}% · 是最大一项的 ${(r.frac * 100).toFixed(1)}%（条形按开方压缩）"><i></i></div>
      <div class="rtime" title="最后修改时间">${esc(r.mtimeText || '—')}</div>
      <div class="rsize">${r.sizeText}</div>
    </div>`).join('');
  requestAnimationFrame(() => {
    const bars = listEl.querySelectorAll('.rbar i');
    d.rows.forEach((r, i) => { if(bars[i]) bars[i].style.width = barW(r.frac).toFixed(1) + '%'; });
    fitAll();
  });
  listEl.querySelectorAll('.row').forEach(el => {
    const isDir = el.dataset.d === '1';
    const go = () => {
      if(isDir){ path = el.dataset.p; loadRank(); }
      else { act('open', el.dataset.p); }        // 文件：直接打开
    };
    el.onclick = () => {
      const i = [...listEl.querySelectorAll('.row')].indexOf(el);
      setSel(i);
      if(ONECLICK){ if(isDir) saveScroll(); go(); }
    };
    el.ondblclick = () => { if(isDir) saveScroll(); go(); };
    el.oncontextmenu = (ev) => ctxMenu(ev, [
      {label: isDir ? '打开所在文件夹' : '在资源管理器中显示',
       fn:() => { act('reveal', el.dataset.p); }},
      {label:'复制路径', fn:() => { copy(el.dataset.p); }},
    ]);
  });
}

/* ================= ECharts 扇形图 =================
   兜底：万一 echarts.min.js 没加载上，自动退回下面手写 SVG 那版。
   想换手感只改这两个常量，别的都不用动 ——
     PIE_EASE    'backOut'     微微回弹一下（现在用的）
                 'elasticOut'  最 Q 弹，会来回弹好几下
                 'bounceOut'   像小球落地，弹几下
                 'cubicOut'    干脆利落，完全不弹
     PIE_STAGGER 每个扇区依次弹出的间隔(ms)，0 = 一起弹出
   ---------------------------------------------------------------- */
/* 条形宽度的压缩指数：width = (size/max)^BAR_GAMMA。
   1 = 真实比例（有一个大头之后小项就全挤成一条线）；
   0.45 是现在用的，小项之间也能看出区别。想改回真实比例就把 1 填进来。

   再加一条下限 BAR_MIN：这个列表的跨度有上百万倍（41.5 GB ~ 20 KB），
   任何固定幂次都顾不到两头，KB 级的项算出来仍然不到 0.1%。
   所以只要大小 > 0 就至少给 BAR_MIN% 宽，保证看得见；
   真正的 0 字节项仍然是 0（不能给下限，否则误导成"有点东西"）。 */
let BAR_GAMMA = 0.45;     // 由「设置」控制：0.45 = 压缩刻度，1 = 真实比例
let BAR_MIN = 1.2;
const barW = f => (f <= 0 ? 0
                  : Math.max(BAR_MIN, Math.pow(Math.min(1, f), BAR_GAMMA) * 100));

/* 切换刻度。真实比例那条路要把下限也去掉，否则小项仍有 1.2% 的假宽度。 */
function applyBarScale(mode){
  const linear = (mode === 'linear');
  BAR_GAMMA = linear ? 1 : 0.45;
  BAR_MIN = linear ? 0 : 1.2;
}

const PIE_EASE = 'backOut';
const PIE_STAGGER = 30;
var CHART = null;
var CHART_FIT = null;                 // resize 时按新尺寸重算环半径
function killChart(){
  if(CHART){ try{ CHART.dispose(); }catch(e){} }
  CHART = null; CHART_FIT = null;
  memDispose();          // 内存页那三张图一起收拾
  memStop();
}
window.addEventListener('resize', () => {
  if(!CHART) return;
  try{ CHART.resize(); if(CHART_FIT) CHART_FIT(); }catch(e){}
});

/* 图例那几行 —— ECharts 版和 SVG 兜底版共用同一段 HTML */
function legendRows(d){
  return d.items.map((it, i) => `
      <div class="lg" data-g="${it.idx}" style="animation-delay:${Math.min(i*45,500)}ms">
        <i class="sw" style="background:${it.color}"></i>
        <span class="nm" title="${esc(it.name)}">${esc(it.name)}</span>
        <span class="ct">${Number(it.count).toLocaleString()} 个</span>
        <span class="pc">${(it.frac*100).toFixed(1)}%</span>
        <span class="sz">${it.bytesText}</span>
      </div>`).join('');
}

function typeEcharts(d, drill){
  listEl.innerHTML = `
    <div class="typelay">
      <div class="donutwrap">
        <div class="chart" id="dchart"></div>
        <div class="ctr"><b>${d.totalText}</b><span>合计占用</span></div>
      </div>
      <div class="legend">${legendRows(d)}</div>
    </div>`;
  inertia(listEl.querySelector('.legend'));
  listEl.querySelectorAll('.lg').forEach(el => {
    el.onclick = () => drill(el.dataset.g);
    el.onmouseenter = () => hiE(Number(el.dataset.g), true);
    el.onmouseleave = () => hiE(-1, false);
  });
  const el = listEl.querySelector('#dchart');
  killChart();
  const boot = (n) => {
    if(!el.isConnected) return;                  // 已经切到别的页了，别画
    if(!el.clientWidth || !el.clientHeight){     // 布局还没算好，等一下再来
      if(n < 20) setTimeout(() => boot(n + 1), 60);
      return;
    }
    CHART = echarts.init(el, null, {renderer: 'canvas'});

    /* 环的半径按容器**实际像素**算，不用百分比 ——
       .donutwrap 又窄又高，用 % 环会顶满宽度，外侧标注就没地方放，
       会被 ECharts 截成 "1..."（窗口越小越明显）。
       标注的摆放交给 ECharts 自己（它会给小扇形画引线，能看清字属于谁）。 */
    const mkGeom = () => {
      const CW = el.clientWidth, CH = el.clientHeight;
      const CX = CW / 2, CY = CH / 2;
      const txt = f => (f * 100).toFixed(f >= 0.1 ? 0 : 1) + '%';
      const tw = t => t.length * 7.7 + 14;          // 14px 粗体 + 描边 + 余量
      let maxW = 0;
      d.items.forEach(it => { maxW = Math.max(maxW, tw(txt(it.frac))); });
      // 横向要给"引线（长 24）+ 标注"留出 maxW + 58，纵向留 30
      const ROUT = Math.max(30, Math.min(CX - maxW - 58, CY - 30, 190));
      return {RIN: Math.round(ROUT * 0.62), ROUT: Math.round(ROUT)};
    };
    const G0 = mkGeom();

    CHART.setOption({
      animation: true,
      animationDuration: 620,
      animationEasing: PIE_EASE,
      animationDelay: i => i * PIE_STAGGER,      // stagger：逐个扇区依次弹出
      tooltip: {
        backgroundColor: pal().tipBg, borderColor: pal().tipBd,
        textStyle: {color: pal().tipTx, fontSize: 12}, confine: true,
        formatter: p => {
          const it = d.items[p.dataIndex] || {};
          return p.marker + esc(p.name) + '<br><b>' + (it.bytesText || '') + '</b>'
               + ' · ' + p.percent.toFixed(1) + '% · '
               + Number(it.count || 0).toLocaleString() + ' 个';
        },
      },
      series: [
        { // 垫一圈灰环：canvas 抗锯齿偶尔会在扇区之间漏出头发丝细缝
          type: 'pie', radius: [G0.RIN, G0.ROUT], center: ['50%', '50%'], silent: true,
          animation: false, label: {show: false}, labelLine: {show: false},
          emphasis: {disabled: true}, blur: {itemStyle: {opacity: 1}},
          data: [{value: 1, itemStyle: {color: pal().grid}}],
        },
        {
          // minAngle 会偷偷把小扇形加宽 → 角度就跟真实占比对不上了，所以不要。
          // avoidLabelOverlap 用默认的 true：ECharts 自己排标注 + 画引线
          type: 'pie', radius: [G0.RIN, G0.ROUT], center: ['50%', '50%'],
          animationType: 'expansion',
          data: d.items.map(it => ({name: it.name, value: it.bytes,
                                    itemStyle: {color: it.color, opacity: .92},
                                    // 小于 1% 的不画引线：它的标注是空的，
                                    // 单独留一条线指向一根看不见的丝更莫名其妙
                                    labelLine: {show: it.frac >= 0.01,
                                                lineStyle: {color: it.color}},
                                    // 浅色主题下用压深一档的同色，否则浅色字压在浅底上几乎看不见
                                    label: {color: isLight() ? shade(it.color, .62) : it.color}})),
          // 小于 2% 的不标百分比（跟以前一样）；标注贴着环，但不画引线
          // ★ overflow:'none' 必须写：ECharts 对"外侧标注"默认是 truncate，
          //   会把 51% 这种截成 "..."（跟画布大小没关系，纯默认值问题）
          label: {show: true, position: 'outside', fontSize: 14, fontWeight: 'bold',
                  overflow: 'none',
                  textBorderColor: pal().halo, textBorderWidth: 3,
                  // 小于 1% 的不标。后端已经把 <1.2% 的并进「其他」了，
                  // 还能低于 1% 的基本只有「其他 N 项」自己，给它标个 0.0% 没意义。
                  formatter: p => p.percent >= 1
                    ? (p.percent >= 10 ? p.percent.toFixed(0)
                                       : p.percent.toFixed(1)) + '%' : ''},
          // 细引线。length 是"从环往外直着走多远"，拉长一点，
          // 一堆小扇形的线就会先散开再折弯，不至于在环边上绞成一团。
          labelLine: {show: true, smooth: 0.35, length: 24, length2: 16,
                      lineStyle: {width: 1.15, opacity: .5}},
          // ★ 不做放大！之前那个"选中弹出来"被嫌太强烈，这里只把其余的压暗
          emphasis: {scale: false, focus: 'self', itemStyle: {opacity: 1}},
          blur: {itemStyle: {opacity: .25}},
        },
      ],
    });
    CHART.on('click', p => { if(p.seriesIndex === 1) drill(p.dataIndex); });
    CHART.on('mouseover', p => { if(p.seriesIndex === 1) hiE(p.dataIndex, true); });
    CHART.on('mouseout', () => hiE(-1, false));
    CHART_FIT = () => {
      const g = mkGeom();
      CHART.setOption({series: [
        {radius: [g.RIN, g.ROUT]},
        {radius: [g.RIN, g.ROUT]},
      ]});
    };
  };
  boot(0);
}

/* 指针落到某个扇形/图例行上时：其余压暗，图例那行一起亮。不做任何放大。 */
function hiE(idx, on){
  listEl.querySelectorAll('.lg').forEach(el => {
    el.style.opacity = (on && Number(el.dataset.g) !== idx) ? '.45' : '1';
  });
  if(!CHART) return;
  try{
    if(on) CHART.dispatchAction({type: 'highlight', seriesIndex: 1, dataIndex: idx});
    else   CHART.dispatchAction({type: 'downplay', seriesIndex: 1});
  }catch(e){}
}

/* ================= 类型分布（三级下钻，每级都是一张扇形图） ================= */
async function loadType(){
  TAB = 1; setTabs(); path = null; stopPoll();
  const qs = (GROUP === null) ? ''
           : ('?group=' + GROUP + (EXT ? '&ext=' + encodeURIComponent(EXT) : ''));
  const d = await api('/api/type' + qs);
  // ★ api() 失败时返回的是 {error:...}，不是抛异常 —— 以前这里直接往下走，
  //   d.items 是 undefined 就抛在 async 里被静默吞掉：容器建了、图没画、行没渲染，
  //   控制台还一片安静。现在显式提示。
  if(!d || d.error){
    emptyBox('读取类型分布失败', String((d && (d.error || d.msg)) || '未知错误'));
    return;
  }
  if(!d.ready){ spinner('正在读取磁盘数据…'); poll(loadType); return; }
  tableHead('');
  // 面包屑：类型分布 › 视频 › .mp4
  const crumbs = (d.crumb || []).map((c, i) =>
    (i === d.crumb.length - 1)
      ? `<span style="cursor:default">${esc(c.name)}</span>`
      : `<span data-ci="${i}">${esc(c.name)}</span>`).join('<b>›</b>');
  const back = () => {
    if(EXT) EXT = null;
    else if(GROUP !== null) GROUP = null;
    loadType();
  };
  head(d.title, '合计 ' + d.totalText + ' · ' + (d.hint || ''),
       '', crumbs, d.level > 1 ? back : null);
  crumbEl.querySelectorAll('[data-ci]').forEach(sp => {
    sp.onclick = () => {
      const c = d.crumb[Number(sp.dataset.ci)];
      GROUP = c.group; EXT = c.ext; loadType();
    };
  });
  if(!d.items || !d.items.length){ emptyBox('这一层没有数据'); return; }

  // 点扇形 / 图例：一级 → 二级 → 三级，每级都还是扇形图
  const drill = (idx) => {
    const it = d.items[Number(idx)];
    if(!it || !it.drill) return;
    if(d.level === 1){ GROUP = it.key; EXT = null; loadType(); }
    else if(d.level === 2){ EXT = it.key; loadType(); }
    else { act('open', it.key); }               // 三级：打开这个文件夹
  };
  if(window.echarts){
    try{ typeEcharts(d, drill); return; }        // ★ 有 ECharts 就用它
    catch(e){
      // 画不出来别留白：退回下面手写 SVG 那条路
      console.warn('ECharts 画不出来，退回手写 SVG：', e);
      const box = listEl.querySelector('.typeChart');
      if(box) box.innerHTML = '';
    }
  }
  killChart();                                           // 没有就退回手写 SVG

  const R = 86, SW = 30, CX = 100, CY = 100, CIRC = 2 * Math.PI * R;
  let off = 0;
  const segs = d.items.map(it => {
    const len = it.frac * CIRC, s = {it, len, off};
    off += len;
    return s;
  });
  const slices = segs.map(s => `<circle class="slice" cx="${CX}" cy="${CY}" r="${R}"
      fill="none" stroke="${s.it.color}" stroke-width="${SW}" opacity=".92"
      stroke-dasharray="${s.len.toFixed(2)} ${(CIRC - s.len).toFixed(2)}"
      stroke-dashoffset="${(-s.off).toFixed(2)}" data-g="${s.it.idx}"></circle>`).join('');

  // 标签贴着环，放在各自扇形自己的角度上；挤在一起时**沿环滑动**避让 ——
  // x 按新的 y 重新算回圆上，所以永远贴着环，只是换到邻近角度，不画引线。
  const LR = R + SW / 2 + 10;
  const LBL = [];
  segs.forEach(s => {
    // 小于 2% 的不标百分比：扇形一个不少（数据不能少），但标签太挤就互相压住了
    if(s.it.frac < 0.02) return;
    const mid = (s.off + s.len / 2) / CIRC;
    const a = (-90 + mid * 360) * Math.PI / 180;
    LBL.push({it: s.it, dir: Math.cos(a) >= 0 ? 1 : -1,
              x: CX + LR * Math.cos(a), y: CY + LR * Math.sin(a)});
  });
  const LIM = LR - 4;
  [1, -1].forEach(dir => {
    const g = LBL.filter(l => l.dir === dir).sort((a, b) => a.y - b.y);
    const MIN = 15;
    for(let i = 1; i < g.length; i++)
      if(g[i].y - g[i-1].y < MIN) g[i].y = g[i-1].y + MIN;
    if(g.length){
      const over = g[g.length-1].y - (CY + LIM);
      if(over > 0) g.forEach(l => { l.y -= over; });
      const under = (CY - LIM) - g[0].y;
      if(under > 0) g.forEach(l => { l.y += under; });
    }
    g.forEach(l => {
      const dy = Math.max(-LIM, Math.min(LIM, l.y - CY));
      l.y = CY + dy;
      l.x = CX + dir * Math.sqrt(Math.max(LR * LR - dy * dy, 4));
    });
  });
  const labels = LBL.map(l => `
      <text class="slice-lb" x="${(l.x + l.dir * 3).toFixed(1)}"
        y="${l.y.toFixed(1)}" text-anchor="${l.dir > 0 ? 'start' : 'end'}"
        style="fill:${isLight() ? shade(l.it.color, .58) : l.it.color}" data-g="${l.it.idx}"
        >${(l.it.frac * 100).toFixed(l.it.frac >= 0.1 ? 0 : 1)}%</text>`).join('');

  listEl.innerHTML = `
    <div class="typelay">
      <div class="donutwrap">
        <svg viewBox="-44 -20 288 240">
          <circle cx="${CX}" cy="${CY}" r="${R}" fill="none"
                  stroke="${pal().ring}" stroke-width="${SW}"></circle>
          <g transform="rotate(-90 100 100)">${slices}</g>
          <g>${labels}</g>
        </svg>
        <div class="ctr"><b>${d.totalText}</b><span>合计占用</span></div>
      </div>
      <div class="legend">${legendRows(d)}</div>
    </div>`;
  inertia(listEl.querySelector('.legend'));
  listEl.querySelectorAll('.slice').forEach(c => {
    c.onclick = () => drill(c.dataset.g);
    c.onmouseenter = () => hi(c.dataset.g, true);
    c.onmouseleave = () => hi(c.dataset.g, false);
  });
  listEl.querySelectorAll('.lg').forEach(el => {
    el.onclick = () => drill(el.dataset.g);
    el.onmouseenter = () => hi(el.dataset.g, true);
    el.onmouseleave = () => hi(el.dataset.g, false);
  });





}

/* 指针落到某个扇形/图例行上时：那个扇形**弹出来 + 同色辉光**，
   其余压暗，图例那行也一起亮 —— 幅度照 Tk 版的比例。 */
function hi(g, on){
  // 扇形：只把其余的调暗，不做任何放大
  listEl.querySelectorAll('.slice').forEach(c => {
    c.style.opacity = (on && c.dataset.g !== g) ? '.25' : '.92';
  });
  // 图例行：同样只调暗
  listEl.querySelectorAll('.lg').forEach(el => {
    el.style.opacity = (on && el.dataset.g !== g) ? '.45' : '1';
  });
  // 百分比标注维持现状，不动
  listEl.querySelectorAll('.slice-lb').forEach(el => {
    el.style.opacity = !on ? '1' : (el.dataset.g === g ? '1' : '.42');
    el.style.fontWeight = (on && el.dataset.g === g) ? '700' : '';
  });
}

async function loadClean(force){
  killChart();
  TAB = 2; setTabs(); path = null; GROUP = null; stopPoll();
  if(force) await act('reclean');
  const d = await api('/api/clean');
  tableHead('');
  head('清理建议',
       d.state === 'done' ? ('放心清理约 ' + d.safeText + ' · 需你确认约 ' + d.cautText +
                             ' · 只分析不删除')
                          : '正在分析可清理的位置…',
       '<button class="mini" data-act="cleanall">一键清理</button>' +
       '<button class="mini" data-act="reclean">重新分析</button>' +
       '<button class="mini" data-act="drives">切换磁盘</button>', '');
  if(d.state === 'running'){ spinner('正在扫描各个缓存目录…', '这一步可能要几秒钟'); poll(() => loadClean(false)); return; }
  if(!d.rows.length){ emptyBox(d.msg || '没找到可清理的位置'); return; }
  listEl.innerHTML = d.rows.map((r, i) => `
    <div class="row clean" data-p="${esc(r.path)}" style="animation-delay:${Math.min(i*45,600)}ms">
      <div class="rk fico">${typeIcon(0, pal().dir, true)}</div>
      <div class="rmain" style="width:34%">
        <div class="rname">${esc(r.name)}</div>
        <div class="rpath" data-fit title="${esc(r.path)}">${esc(r.path)}</div>
      </div>
      <span class="tag ${esc(r.risk)}">${esc(r.riskText)}</span>
      <div class="rmeta" style="flex:1;min-width:0" title="${esc(r.advice)}">${esc(r.advice)}</div>
      <div class="rbar" style="flex:none;width:110px"
           title="是最大一项的 ${(r.frac * 100).toFixed(1)}%（条形按开方压缩）"><i></i></div>
      <div class="rsize">${r.sizeText}</div>
      <button class="del" data-del="${esc(r.path)}">删除</button>
    </div>`).join('');
  requestAnimationFrame(() => {
    const bars = listEl.querySelectorAll('.rbar i');
    d.rows.forEach((r, i) => { if(bars[i]) bars[i].style.width = barW(r.frac).toFixed(1) + '%'; });
    fitAll();
  });
  listEl.querySelectorAll('.row').forEach(el => {
    // ★ 只要点在行里的**任何按钮**上都不能去打开文件夹（以前只认 .del 这一个类，
    //   点到按钮内部的子节点就漏了，结果点“删除”反而把文件夹打开了）
    el.onclick = (ev) => { if(ev.target.closest && ev.target.closest('button, .del')) return;
                           act('open', el.dataset.p); };
    el.oncontextmenu = (ev) => ctxMenu(ev, [
      {label:'打开所在文件夹', fn:() => act('open', el.dataset.p)},
      {label:'删除这项内容…', danger:true, fn:() => act('del', el.dataset.p).then(() => loadClean(false))},
    ]);
  });
  listEl.querySelectorAll('.del').forEach(b => {
    b.onclick = (ev) => {
      ev.stopPropagation();
      ev.preventDefault();
      const p = b.dataset.del || '';
      // ★ 二次确认：以前这里点一下就发删除请求，没有任何确认。
      if(!window.confirm('确定删除这一项吗？\n\n' + p +
                         '\n\n里面的内容会被删掉，不能恢复。')) return;
      b.disabled = true;
      b.textContent = '删除中…';
      act('del', p).then(m => {
        // 以前失败是完全无声的（后端把异常包成 {error} 用 200 返回），
        // 现在至少把原因说出来。
        if(m && m.error) toast('删除失败：' + m.error);
        setTimeout(() => loadClean(false), 400);
      }).catch(e => {
        toast('删除失败：' + ((e && e.message) || e));
        b.disabled = false;
        b.textContent = '删除';
      });
    };
  });
}

      <button class="rowdel wide" data-un="${esc(r.name)}"
              title="调起这个软件自己的卸载程序（会弹出它自己的卸载界面）">

          <path d="M9 4.5h6M12 7.5v6M8.2 10.2a6 6 0 108.6 5.3"/>
        </svg><span>卸载</span>
      </button>` : `

              title="删除这个软件的目录内容（只删文件，保留目录结构）">

        </svg><span>清理</span>
      </button>`}
    </div>`).join('');
  const TRASH_SVG = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none"
        stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M4 6.5h16M9.5 6.5V4.6h5v1.9M6.5 6.5l1 13.4h9l1-13.4"/></svg>`;
  const CHECK_SVG = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none"
        stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round"><path d="M5 12.5l4.6 4.5L19 7.5"/></svg>`;
  const DEL_TIP = '删除这个软件的目录内容（只删文件，保留目录结构）';
  const UN_TIP = '调起这个软件自己的卸载程序（会弹出它自己的卸载界面）';
  const TRASH_LBL = TRASH_SVG + '<span>清理</span>';
  const UN_LBL = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none"
        stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M9 4.5h6M12 7.5v6M8.2 10.2a6 6 0 108.6 5.3"/></svg><span>卸载</span>`;
  const CHECK_LBL = CHECK_SVG + '<span>确认</span>';
  listEl.querySelectorAll('.rowdel').forEach(b => {
    const isUn = b.dataset.un !== undefined;      // 这一颗是"卸载"还是"清理"
    const name = isUn ? b.dataset.un : b.dataset.del;
    let tmr = 0;
    const disarm = () => {
      clearTimeout(tmr); tmr = 0;
      b.classList.remove('arm');
      b.innerHTML = b.classList.contains('wide')
        ? (isUn ? UN_LBL : TRASH_LBL) : TRASH_SVG;
      b.title = isUn ? UN_TIP : DEL_TIP;
    };
    b.onclick = async (ev) => {
      ev.stopPropagation();                   // 别把行本身的"打开目录"也触发了
      if(!tmr){                               // 第一下只上膛：手滑不会直接卸掉一个软件
        tmr = setTimeout(disarm, 3000);
        b.classList.add('arm');
        b.innerHTML = b.classList.contains('wide') ? CHECK_LBL : CHECK_SVG;

      disarm();
      if(isUn){
        await act('uninstall', name);         // 后端会 Popen 它自己的卸载程序

      await act('delsoft', name);
      setTimeout(() => loadSoft(false), 400);

  listEl.querySelectorAll('.row').forEach(el => {
    el.onclick = () => act('open', el.dataset.p);
    el.oncontextmenu = (ev) => {
      const row = d.rows.find(r => r.name === el.dataset.n);
      /* ★ 一个软件经常横跨好几个盘（比如 No Man's Sky：E: 31.2 GB + C: 3.0 GB）。
         以前这里只有一条「打开安装目录」，永远开 openPath 那一个 ——
         别的盘上的目录根本没法打开。现在按后端给的 dirList 每个目录各列一条，
         标签里带盘符，同一个盘上有两个目录时再补一个文件夹名区分。 */
      /* 后端给的 menuDirs 是"每个盘最大的那个目录"，通常 2~4 条。
         没有这个字段（老后端）就退回 dirList / 行上的路径。 */
      const md = (row && row.menuDirs) || [];
      const items = [];
      if(md.length > 1){
        md.forEach(m => items.push({
          // 数字是这个盘上的**合计**（和卡片一致），括号里是"一共几个目录"；
          // 点开进的是其中最大的那个目录。
          label: '打开安装目录（' + m.letter + ' · ' + m.sizeText +
                 (m.dirs > 1 ? ' · ' + m.dirs + ' 个目录' : '') + '）',
          fn: () => act('open', m.path)}));
      }else if(md.length === 1){
        items.push({label:'打开安装目录', fn:() => act('open', md[0].path)});
      }else{
        const one = (row && row.dirList && row.dirList[0]) || el.dataset.p;
        items.push({label:'打开安装目录', fn:() => act('open', one)});
      }
      // ★ 卸载优先：调起软件自己的卸载程序（清注册表、服务、菜单项）。
      if(row && row.uninst)
        items.push({label:'卸载这个软件…', danger:true,
                    fn:() => act('uninstall', el.dataset.n)});
      // ★ 删目录只是兜底：绿色版的、卸载程序坏了的、卸不掉的才走这条。
      items.push({label:'直接删除目录内容…', danger:true, fn: async () => {
        if(!confirm('直接删除「' + el.dataset.n + '」目录里的所有文件？\n' +
                    '（不调用卸载程序，注册表里的条目会留在"设置 → 应用"里）')) return;
        await act('delsoft', el.dataset.n);
        setTimeout(() => loadSoft(false), 400);
      }});
      items.push({label:'复制名称', fn:() => copy(el.dataset.n)});
      ctxMenu(ev, items);
    };

/* 把命中搜索词的片段标出来。先转义再替换，所以文件名里有 < & 也不会出问题；
   多个词按长度从长到短处理，并用占位符隔开，避免后一次替换命中前一次插入的标签。 */
function markHit(text, q){
  const out = esc(text == null ? '' : String(text));
  const raw = String(q || '').trim();
  if(!raw) return out;
  const toks = raw.split(/\s+/).filter(Boolean).map(esc)
                  .sort((a, b) => b.length - a.length);
  let buf = out;
  for(const t of toks){
    if(!t) continue;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    buf = buf.replace(re, m => '\u0001' + m + '\u0002');
  }
  return buf.replace(/\u0001/g, '<mark class="hl">').replace(/\u0002/g, '</mark>');
}

        <i style="width:${barW(r.size / mx).toFixed(1)}%"></i></div>
      <div class="rsize">${r.sizeText}</div>
    </div>`);
  listEl.innerHTML = htmls.slice(0, CH0).join('');
  const bindRows = () => {
    listEl.querySelectorAll('.row:not([data-b])').forEach(el => {
      el.dataset.b = '1';
      el.onclick = () => act('open', el.dataset.p);
      el.oncontextmenu = (ev) => ctxMenu(ev, [
        {label:'打开 / 定位', fn:() => act('open', el.dataset.p)},
        {label:'复制路径', fn:() => copy(el.dataset.p)},
      ]);
    });
    if(listEl.__sc) listEl.__sc.dirty = 1;       // 滚动高度变了要重量
  };
  bindRows();
  if(htmls.length > CH0){
    const inner = listEl.querySelector('.sc-in');
    let at = CH0;
    const step = () => {
      if(!inner || at >= htmls.length) return;
      const end = Math.min(at + CHN, htmls.length);
      inner.insertAdjacentHTML('beforeend', htmls.slice(at, end).join(''));
      at = end;
      bindRows();
      if(at < htmls.length) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
}

/* 迷你走势线：把一串采样点折成 SVG 折线。用 preserveAspectRatio="none"
   让它横向拉伸填满格子；面积填充让"在涨"这件事更直观。 */
function sparkSVG(hist){
  if(!hist || hist.length < 2) return '<svg viewBox="0 0 100 18"></svg>';
  const mn = Math.min.apply(null, hist), mx = Math.max.apply(null, hist);
  const span = (mx - mn) || 1;
  const n = hist.length;
  const pt = (v, i) => (i / (n - 1) * 100).toFixed(1) + ',' +
                       (16 - (v - mn) / span * 14).toFixed(1);
  const line = hist.map(pt).join(' ');
  const area = '0,18 ' + line + ' 100,18';
  const rising = hist[n - 1] > hist[0];
  const col = rising ? pal().warm : pal().accent;
  return '<svg viewBox="0 0 100 18" preserveAspectRatio="none">' +
         '<polygon points="' + area + '" fill="' + col + '" opacity=".14"/>' +
         '<polyline points="' + line + '" fill="none" stroke="' + col +
         '" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>';
}

function fmtMB(b){
  b = Number(b) || 0;
  return b >= 2 ** 30 ? (b / 2 ** 30).toFixed(1) + ' GB'
                      : (b / 2 ** 20).toFixed(0) + ' MB';
}
// 速率专用：fmtMB 会四舍五入到整 MB，写盘慢的进程会显示成 0，所以单独一套
function fmtRate(b){
  b = Number(b) || 0;
  if(b >= 2 ** 30) return (b / 2 ** 30).toFixed(1) + ' GB/s';
  if(b >= 10 * 2 ** 20) return (b / 2 ** 20).toFixed(0) + ' MB/s';
  if(b >= 2 ** 20) return (b / 2 ** 20).toFixed(1) + ' MB/s';
  if(b >= 1024) return (b / 1024).toFixed(0) + ' KB/s';
  return '';
}

/* ================= 磁盘 I/O 波形 =================
   prog: 0 → 一条都还没画出来，1 → 完整。入场时跑 0→1（从左往右扫出来），
   之后每秒只按 prog=1 重画。缓动用手算的 easeOutCubic，和卡片那条
   cubic-bezier(.22,.9,.24,1) 观感一致，所以"线和卡片同时停"。 */
let IO_RAF = 0;
function drawIo(prog){
  const cv = document.getElementById('ioCanvas');
  if(!cv || !cv.clientWidth) return;
  const ctx = cv.getContext('2d');
  const W = cv.width = cv.clientWidth * 2, H = cv.height = cv.clientHeight * 2;
  ctx.clearRect(0, 0, W, H);
  // 底网格先画满（它是背景，不该跟着扫）
  ctx.strokeStyle = 'rgba(0,229,255,.08)'; ctx.lineWidth = 1;
  for(let i = 1; i < 4; i++){ const y = H * i / 4;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const all = IOHIST.w.concat(IOHIST.r).concat([1024 * 1024]);
  const mx = Math.max.apply(null, all);
  const p = Math.max(0, Math.min(1, prog));
  const drawLine = (data, color) => {
    if(data.length < 2) return;
    // 只画前 k 个点：线就从左往右"长"出来，比例全程按最终刻度，不会变形
    const k = Math.max(2, Math.round(data.length * p));
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.shadowBlur = 8; ctx.shadowColor = color;
    ctx.beginPath();
    for(let i = 0; i < k; i++){
      const x = i / (data.length - 1) * W;
      const y = H - (data[i] / mx) * (H - 4) - 2;
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.shadowBlur = 0;
  };
  drawLine(IOHIST.r, '#00e5ff');
  drawLine(IOHIST.w, '#ffb347');
}
function ioReveal(){
  cancelAnimationFrame(IO_RAF);
  const t0 = performance.now(), DUR = 460;      // 和卡片的 --mem-in 一样长
  const tick = now => {
    const r = Math.min(1, (now - t0) / DUR);
    drawIo(1 - Math.pow(1 - r, 3));             // easeOutCubic
    if(r < 1) IO_RAF = requestAnimationFrame(tick);
  };
  IO_RAF = requestAnimationFrame(tick);
}

/* ================= 入场总入口 =================
   卡片、卡里的内容、两条波形、进程行 —— 同一条时间线，一起出现在位。
   ★ 只在这几个时刻调用：第一份数据画完 / 科幻启动遮罩抬起 / 遮罩不再播放。 */

    box.classList.add('anim');

  }
  ioReveal();
  // 内存活动那条折线：清空重画，让它从左往右跑一遍（和上面同一条时间线）
  if(MEMCHARTS.tre && MEMLAST){
    TRE_ANIM_T0 = performance.now();
    try{ MEMCHARTS.tre.clear(); }catch(e){}
    paintTre(MEMLAST, true);
