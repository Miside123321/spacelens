        type: 'text', left: 'center', top: '44%',
        style: {text: fmtMB(used), fill: '#00e5ff', fontSize: 17, fontWeight: 'bold',
                textAlign: 'center', fontFamily: 'Consolas, Monaco, monospace',
                textShadowColor: 'rgba(0,229,255,.6)', textShadowBlur: 10},
      }, {
        type: 'text', left: 'center', top: '58%',
        style: {text: '已用 ' + (sys.load || 0) + '%', fill: 'rgba(0,229,255,.6)', fontSize: 11,
                textAlign: 'center', fontFamily: 'Consolas, Monaco, monospace'},
      }],
    });
  }
  // ---- 分类横条 ----
  if(MEMCHARTS.cat){
    const cats = (d.cats || []).slice().reverse();
    MEMCHARTS.cat.setOption({
      animationDuration: 500,
      grid: {left: 58, right: 52, top: 6, bottom: 4, containLabel: false},
      xAxis: {type: 'value', show: false, max: 'dataMax'},
      yAxis: {type: 'category', data: cats.map(c => c.name),
              axisLine: {show: false}, axisTick: {show: false},
              axisLabel: {color: 'rgba(0,229,255,.6)', fontSize: 11,
                          fontFamily: 'Consolas, Monaco, monospace'}},
      series: [{
        type: 'bar', barWidth: 10,
        data: cats.map(c => ({value: c.ws, itemStyle:
          {color: {type:'linear', x:0,y:0,x2:1,y2:0,
            colorStops:[{offset:0,color:'#003d5c'},{offset:1,color:'#00e5ff'}]},
           shadowBlur: 6, shadowColor: 'rgba(0,229,255,.4)', borderRadius: 2}})),
        label: {show: true, position: 'right', color: 'rgba(0,229,255,.7)', fontSize: 11,
                fontFamily: 'Consolas, Monaco, monospace',
                formatter: p => fmtMB(p.value)},
      }],
    });
  }
  /* ★ 入场那一遍扫出还在跑（0.46s）就别用无动画再画一次，
     否则下一秒的采样会把线瞬间补成全条，扫出效果就没了。 */
  if(performance.now() - TRE_ANIM_T0 > 500) paintTre(d, false);
  // 卡头的整机写盘速率
  const ioEl = document.getElementById('memIo');
  if(ioEl){
    const w = d.ioW || 0;
    ioEl.textContent = w >= 1024 ? '整机写入 ' + fmtRate(w) : '';
    ioEl.className = 'memio' + (w >= 20 * 2 ** 20 ? ' hot' : '');
  }
  // ★ v1.1.0：磁盘 I/O 波形 + 数字
  const ioW = d.ioW || 0, ioR = d.ioR || 0;
  IOHIST.w.push(ioW); IOHIST.r.push(ioR);
  if(IOHIST.w.length > 120){ IOHIST.w.shift(); IOHIST.r.shift(); }
  const ioFacts = document.getElementById('ioFacts');
  if(ioFacts){
    ioFacts.innerHTML =
      '<div><span class="lbl">读取</span><span class="val">' + (fmtRate(ioR) || '0 KB/s') + '</span></div>' +
      '<div><span class="lbl">写入</span><span class="val write">' + (fmtRate(ioW) || '0 KB/s') + '</span></div>';
  }
  const ioStat = document.getElementById('ioStat');
  if(ioStat){
    const mx = Math.max(ioW, ioR, 1024);
    ioStat.textContent = '峰值 ' + fmtRate(mx) + '/s';
  }
  drawIo(1);
  // ★ v1.1.1：I/O 状态行实时跳动
  const st = document.getElementById('ioStatusText');
  if(st){
    const n = d.nProc || 0;
    const load = (d.sys && d.sys.load) || 0;
    const phrases = [
      'LIVE · ' + n + ' PROCS · ' + load + '% MEM',
      'I/O · R ' + (fmtRate(ioR) || '0') + ' · W ' + (fmtRate(ioW) || '0'),
      'BUFFER ' + (Math.random() * 30 + 10).toFixed(0) + '% · SYNCED',
      'PIDS ' + n + ' · ' + load + '% MEM',
    ];
    st.textContent = phrases[Math.floor(Date.now() / 1000) % phrases.length];
  }
  // ---- 进程列表：按名字合并 + 迷你走势线，按名字就地更新 ----
  const box = document.getElementById('memProcs');
  if(box){
    let all = d.groups || [];
    if(MEMSORT === 'grow') all = all.slice().sort((a, b) => (b.grow || 0) - (a.grow || 0));
    else if(MEMSORT === 'io') all = all.slice().sort((a, b) => (b.wps || 0) - (a.wps || 0));
    const rows = all.slice(0, 22);
    const mx = (d.groups && d.groups.length) ? d.groups[0].ws : 1;
    // ★ 只比较"名字都在不在"是不够的：按增长/按写入排序时名字集合几乎不变，
    //   那样就永远走就地更新，DOM 位置一直是老顺序 —— 点了排序像没反应。
    const key = rows.map(r => r.name).join('\u0001');
    const same = rows.length && key === MEMORDER && rows.every(r => MEMROWS[r.name]);
    if(!same && box.children.length === rows.length &&
       rows.every(r => MEMROWS[r.name])){
      // 名字集合没变、只是顺序变了：把现成的行按新顺序挪一下，不重建
      rows.forEach(r => box.appendChild(MEMROWS[r.name]));
      MEMORDER = key;
    }else if(!same){
      box.innerHTML = rows.map(r => `
        <div class="memproc" data-nm="${esc(r.name)}">
          <span class="nm" title="${esc(r.name)}">${esc(r.name)}</span>
          <span class="cnt">${r.n > 1 ? '×' + r.n : ''}</span>
          <span class="bar"><i></i></span>
          <span class="spk"></span>
          <span class="val"></span>
          <span class="wio"></span>
          <span class="gro"></span>
          <button class="kill" title="结束进程">×</button>
        </div>`).join('');
      MEMROWS = {};
      box.querySelectorAll('.memproc').forEach(el => { MEMROWS[el.dataset.nm] = el; });
      MEMORDER = key;
      // 走势线只在重建时画一次，之后每帧只改 polyline 的坐标（不重造 DOM）
      rows.forEach(r => {
        const el = MEMROWS[r.name];
        if(el) el.querySelector('.spk').innerHTML = sparkSVG(r.hist);
      });
      // ★ v1.1.0：结束进程按钮
      box.querySelectorAll('.kill').forEach(btn => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          const row = btn.closest('.memproc');
          const nm = row ? row.dataset.nm : '';
          if(!nm) return;
          if(!confirm('结束进程「' + nm + '」？所有同名进程都会被强制结束。')) return;
          btn.disabled = true;
          btn.style.opacity = '.4';
          try{
            const r = await act('killproc', nm);
            toast(r && r.ok ? '已结束 ' + nm : (r && r.out ? r.out : '结束失败'));
          }catch(err){ toast('结束失败：' + (err.message || err)); }
          btn.disabled = false;
          btn.style.opacity = '';
        };
      });
    }
    rows.forEach(r => {
      const el = MEMROWS[r.name];
      if(!el) return;
      el.querySelector('.bar i').style.width = (r.ws / mx * 100).toFixed(1) + '%';
      el.querySelector('.val').textContent = fmtMB(r.ws);
      // 写盘速率：低于 0.1 MB/s 当噪声不显示（不然满屏 0）
      const wp = r.wps || 0, wEl = el.querySelector('.wio');
      const wt = fmtRate(wp);              // 低于 1 KB/s 直接空着
      if(wt){
        wEl.textContent = wt;
        wEl.className = 'wio' + (wp >= 20 * 2 ** 20 ? ' act' : '');
      }else if(wEl.textContent){ wEl.textContent = ''; wEl.className = 'wio'; }
      const gr = r.grow || 0;
      const g = el.querySelector('.gro');
      g.textContent = Math.abs(gr) < 2 * 2 ** 20 ? '' :      // 2 MB 以下当噪声
        (gr > 0 ? '+' : '−') + fmtMB(Math.abs(gr));
      g.className = 'gro' + (gr > 200 * 2 ** 20 ? ' hot' : (gr > 40 * 2 ** 20 ? ' up' : ''));
      // 迷你线：只换坐标，不重建 SVG
      const svg = el.querySelector('.spk svg');
      const pl = svg && svg.querySelector('polyline');
      if(pl && r.hist && r.hist.length >= 2){
        const mn = Math.min.apply(null, r.hist), mxx = Math.max.apply(null, r.hist);
        const span = (mxx - mn) || 1, n = r.hist.length;
        pl.setAttribute('points', r.hist.map((v, i) =>
          (i / (n - 1) * 100).toFixed(1) + ',' +
          (16 - (v - mn) / span * 14).toFixed(1)).join(' '));
      }
    });
    MEMLAST = d;
    // ★ v1.1.0：重建后重新应用搜索过滤
    if(PROCFILTER){
      box.querySelectorAll('.memproc').forEach(el => {
        const nm = (el.dataset.nm || '').toLowerCase();
        el.style.display = nm.includes(PROCFILTER) ? '' : 'none';
      });
    }
  }
  /* ★ 入场动画等**第一份数据**画完再放：这时候标题、数字、图表、进程行都在了，
     下一次绘制里卡和内容一起淡入 —— 而不是先淡入五张空卡、内容随后蹦出来。
     启动遮罩还在的话交给 playBootSequence（遮罩抬起来的瞬间再放）。 */
  if(!MEMIN){
    MEMIN = true;
    requestAnimationFrame(() => {
      if(!document.getElementById('bootOverlay')) memEnter();
    });
  }
}

/* 画「内存活动」这一卡。animate=true 只在入场那一刻用 ——
   ECharts 折线在首次渲染时会把线从左往右画出来，所以入场时 clear()
   再重画一次就能重放这个效果；每秒的刷新一律 false。 */
function paintTre(d, animate){
  // ---- 内存活动：上面总用量（纵轴自适应），下面每秒变化量 ----
  if(MEMCHARTS.tre){
    const tr = d.trend || [], rt = d.rate || [];
    const used = tr.map(x => x[1]);
    // ★ 关键：纵轴贴住数据本身。原来固定 0~总量，几十 MB 的起伏就成了一条直线。
    let mn = Math.min.apply(null, used), mx = Math.max.apply(null, used);
    if(!isFinite(mn) || !isFinite(mx)){ mn = 0; mx = 1; }
    const pad = Math.max((mx - mn) * 0.25, 32 * 2 ** 20);   // 至少留 32MB 余量
    const rates = rt.map(x => x[1]);
    const rmax = Math.max(32 * 2 ** 20,
      Math.max.apply(null, rates.map(Math.abs).concat([0])));
    const stat = document.getElementById('memStat');
    if(stat){
      stat.textContent = '波动 ' + fmtMB(mx - mn) + ' · 峰值速率 ' +
        fmtMB(rmax) + '/s';
    }
    MEMCHARTS.tre.setOption({
      // ★ 入场时打开：ECharts 折线首次渲染会从左往右把线画出来；
      //   每秒的刷新必须关掉，否则每秒重画一次线，看着像心电图乱抖。
      animation: !!animate,
      animationDuration: 460,
      animationEasing: 'cubicOut',
      grid: [{left: 54, right: 12, top: 6, height: '56%'},
             {left: 54, right: 12, top: '74%', height: '22%'}],
      tooltip: {show: false},
      xAxis: [
        {gridIndex: 0, type: 'category', show: false, data: tr.map(x => x[0])},
        {gridIndex: 1, type: 'category', show: false, data: rt.map(x => x[0])},
      ],
      yAxis: [
        {gridIndex: 0, type: 'value', min: mn - pad, max: mx + pad,
         splitNumber: 3, axisLine: {show: false}, axisTick: {show: false},
         splitLine: {lineStyle: {color: 'rgba(0,229,255,.08)'}},
         axisLabel: {color: 'rgba(0,229,255,.5)', fontSize: 10,
                     fontFamily: 'Consolas, Monaco, monospace',
                     formatter: v => (v / 2 ** 30).toFixed(2) + 'G'}},
        {gridIndex: 1, type: 'value', min: -rmax, max: rmax, splitNumber: 2,
         axisLine: {show: false}, axisTick: {show: false},
         splitLine: {lineStyle: {color: 'rgba(0,229,255,.06)'}},
         axisLabel: {color: 'rgba(0,229,255,.45)', fontSize: 9,
                     fontFamily: 'Consolas, Monaco, monospace',
                     formatter: v => (v / 2 ** 20).toFixed(0)}},
      ],
      series: [
        {type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: used,
         smooth: 0.35, symbol: 'none',
         lineStyle: {color: '#00e5ff', width: 2,
                     shadowBlur: 10, shadowColor: 'rgba(0,229,255,.7)'},
         areaStyle: {color: {type:'linear', x:0,y:0,x2:0,y2:1,
           colorStops:[{offset:0,color:'rgba(0,229,255,.28)'},
                       {offset:1,color:'rgba(0,229,255,0)'}]}}},
        {type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: rates,
         barWidth: '62%',
         itemStyle: {borderRadius: 2,
           color: p => (p.value >= 0 ? '#00e5ff' : '#ff6b6b'),
           shadowBlur: 6, shadowColor: p => (p.value >= 0 ? 'rgba(0,229,255,.5)' : 'rgba(255,107,107,.5)')}},
      ],
    });
  }
}


/* ================= 变化页 =================
   数据来自后端的两份快照对比（见 disk_surface_scan.py 的快照历史）。
   五种视图切换，而不是堆五段列表 —— 和内存页的排序切换一个路数。 */
let DIFFSCOPE = '';            // 变化页当前下钻到的目录（'' = 整个盘）
let DIFFMODE = 'grown';        // grown 增长 / added 新增 / gone 删除 / newf 大文件 / delf 消失
let DIFFLAST = null;
const DIFF_TABS = [['grown', '变大'], ['added', '新增'], ['gone', '消失的目录'],
                   ['newf', '新增的大文件'], ['delf', '不见的大文件']];
const DIFF_UP = {grown: 1, added: 1, newf: 1};     // 这几类是"变多"，数值显示成正号

function bindDiffSort(){
  const el = document.getElementById('diffSort');
  if(!el) return;
  el.querySelectorAll('b').forEach(b => {
    b.onclick = () => {
      if(b.dataset.v === DIFFMODE) return;
      DIFFMODE = b.dataset.v;
      el.querySelectorAll('b').forEach(x => x.classList.toggle('on', x === b));
      paintDiff();
    };
  });
}

/* 取父目录。★ "C:\\pagefile.sys" 直接切会得到 "C:"（少了反斜杠），
   后端认不出这是 C 盘根，跳过去就是空的 —— 驱动器根要把反斜杠补回来。 */
function parentOf(p){
  const d = String(p || '').replace(/[\\/][^\\/]+$/, '');
  return /^[A-Za-z]:$/.test(d) ? d + '\\' : d;
}

/* 展开面板：把"这个目录涨了 X"落成具体的文件清单 */
function renderWhy(w){
  if(!w || !w.ok) return '<div class="whyempty">' + esc((w && w.msg) || '没有数据') + '</div>';
  const one = (it, sign, cls) => `<div class="wfile" data-p="${esc(it.path)}"
      title="${esc(it.path)}">
      <span class="wsz ${cls}">${sign}${esc(it.sizeText)}</span>
      <span class="wnm">${esc(it.name)}</span></div>`;
  const parts = [`<div class="wsum">新增 <b>${w.nNew}</b> 项 ${esc(w.newSize)} ·
      变大 <b>${w.nGrown}</b> 项 ${esc(w.grownSize)} ·
      消失 <b>${w.nGone}</b> 项 ${esc(w.goneSize)}${
      (w.ext && w.ext.length)
        ? '　·　' + w.ext.map(e => esc(e.ext) + ' ' + esc(e.sizeText)).join('，')
        : ''}</div>`];
  (w.new || []).slice(0, 8).forEach(it => parts.push(one(it, '+', 'up')));
  (w.grown || []).slice(0, 8).forEach(it => parts.push(one(it, '+', 'up')));
  (w.gone || []).slice(0, 6).forEach(it => parts.push(one(it, '−', 'down')));
  if(((w.new || []).length + (w.grown || []).length + (w.gone || []).length) === 0){
    parts.push('<div class="whyempty">这一层没有文件级变化，都发生在更深的子目录里' +
               '（可以再点进去一层，或者用右上角的分类切到「新增的大文件」）</div>');
  }
  return parts.join('');
}

function paintDiff(){
  const d = DIFFLAST;
  if(!d || !d.ready) return;
  const rows = d[DIFFMODE] || [];
  if(!rows.length){
    emptyBox('这一类没有变化',
             (DIFFSCOPE ? '当前只看「' + DIFFSCOPE + '」这一层；点左上角「‹ 返回上级」回上一层。' : '') +
             '换个分类看看。小于 ' + fmtMB(20 * 2 ** 20) + ' 的变动不会列出来，免得刷屏。');
    return;
  }
  const isFile = (DIFFMODE === 'newf' || DIFFMODE === 'delf');
  const key = r => (r.delta !== undefined ? r.delta : r.size);
  const mx = Math.max.apply(null, rows.map(key)) || 1;
  const totRank = mx;
  const sumCat = rows.reduce((a, r) => a + Math.abs(key(r)), 0) || 1;
  // 缓存/临时这类目录：涨了就是能直接清的，行尾给个按钮
  const CACHY = /^(temp|tmp|cache|caches|cachedata|crashdumps|logs?|thumbnails?|inetcache|webcache)$/i;
  listEl.innerHTML = rows.map((r, i) => {
    const nm = r.path.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || r.path;
    const parent = parentOf(r.path);
    const v = key(r);
    const sign = DIFF_UP[DIFFMODE] ? '+' : '−';
    const txt = sign + fmtMB(Math.abs(v));
    return `
    <div class="row ${isFile ? 'file' : ''}" data-p="${esc(r.path)}" data-d="${isFile ? 0 : 1}"
         style="animation-delay:${Math.min(i * 22, 480)}ms">
      ${iconSlot(isFile ? null : 0, 0, isFile ? pal().accent : pal().dir, !isFile)}
      <div class="rmain">
        <div class="rname" title="${esc(r.path)}">${esc(nm)}</div>
        <div class="rmeta" data-fit title="${esc(parent)}">${
          r.was !== undefined
            ? esc(parent) + '  ·  原来 ' + fmtMB(r.was) + ' → 现在 ' + fmtMB(r.size)
            : esc(parent)}  ·  占本类 ${(Math.abs(v) / sumCat * 100).toFixed(1)}%</div>
      </div>
      <div class="rbar" title="占本次最大变动的 ${(v / totRank * 100).toFixed(1)}%"><i></i></div>
      <div class="rtime"></div>
      <div class="rsize ${DIFF_UP[DIFFMODE] ? 'up' : 'down'}">${txt}</div>
      ${(!isFile && CACHY.test(nm)) ? '<button class="del" data-del="' + esc(r.path) +
        '" title="删掉这个目录里的内容（不可恢复）">清理</button>' : ''}
      ${isFile ? '' : '<button class="whyb" data-why="' + esc(r.path) +
        '" title="这一层到底是哪些文件变了">▸ 看文件</button>'}
    </div>`;
  }).join('');
  requestAnimationFrame(() => {
    const bars = listEl.querySelectorAll('.rbar i');
    rows.forEach((r, i) => { if(bars[i]) bars[i].style.width = barW(key(r) / mx).toFixed(1) + '%'; });
    fitAll();
  });
  // 「看文件」：展开这一层真正变了的文件（新增 / 变大 / 消失）
  listEl.querySelectorAll('.whyb').forEach(b => {
    b.onclick = async (ev) => {
      ev.stopPropagation();
      const row = b.closest('.row');
      const old = row && row.nextElementSibling;
      if(old && old.classList.contains('whybox')){
        old.remove(); b.textContent = '▸ 看文件'; return;
      }
      const p = b.dataset.why || '';
      b.textContent = '…';
      const w = await api('/api/diffwhy?path=' + encodeURIComponent(p));
      b.textContent = '▾ 收起';
      const box = document.createElement('div');
      box.className = 'whybox';
      box.innerHTML = renderWhy(w);
      row.after(box);
      box.querySelectorAll('.wfile[data-p]').forEach(f => {
        f.onclick = (e) => { e.stopPropagation(); act('open', f.dataset.p); };
      });
    };
  });
  /* ★ 行上的单击不再做任何事：行尾就是「看文件」按钮，两者挨着，容易误触。
     进入下一层改成双击（和资源管理器一致），光标也改回箭头。 */
  listEl.querySelectorAll('.row').forEach(el => {
    const isDir = el.dataset.d === '1';
    const p = el.dataset.p;
    el.classList.add('noclick');
    if(isDir) el.title = '双击进入这一层';
    el.ondblclick = (ev) => {
      if(!isDir) return;
      // ★ 行尾的按钮连点两下 = 一次 dblclick，会冒泡到行上。
      //   不挡住的话，点「看文件」开关两下就会莫名其妙钻进这一层。
      const src = ev.target;
      if(src && src.closest && src.closest('.whyb, .del')) return;
      ev.stopPropagation();
      if(p === DIFFSCOPE) return;
      DIFFSCOPE = p;
      loadDiff();
    };
    el.oncontextmenu = (ev) => ctxMenu(ev, [
      {label: isDir ? '打开所在文件夹' : '在资源管理器中显示',
       fn:() => { act('reveal', isDir ? (parentOf(p) || p) : p); }},
      {label: '复制路径', fn:() => { copy(p); }},
    ]);
  });
}

/* 变化页：点文件夹行 = 在这一页里往下钻（不跳排行）。
   用事件委托，只绑一次；TAB 不是 5 就不管。 */
/* ★ 变化页的行点击必须走**捕获阶段**并 stopPropagation：
   每一行自己还绑了一个 onclick（排行那套 go()），冒泡阶段的监听跑在它后面，
   所以以前点行总是先跳排行。 */
listEl.addEventListener('click', ev => {
  if(TAB !== 5) return;
  const tgt = ev.target;
  // ① 行尾「清理」按钮（只有缓存类目录才有）：先拦，别冒到行上（行会跳排行）
  const btn = tgt && tgt.closest && tgt.closest('.del[data-del]');
  if(btn){
    ev.stopPropagation();
    ev.preventDefault();
    const cp = btn.dataset.del || '';
    if(!window.confirm('确定清理这一项吗？\n\n' + cp +
                       '\n\n里面的内容会被删掉，不能恢复。')) return;
    btn.disabled = true;
    btn.textContent = '清理中…';
    act('del', cp).then(m => {
      if(m && m.error) toast('清理失败：' + m.error);
      setTimeout(() => loadDiff(), 400);
    });
    return;
  }
  // ★ 行内还有别的按钮（「看文件」）：它们有自己的 onclick，
  //   这里必须放行，否则会被当成"点了这一行"而吞掉。
  // 行本身不再响应单击（双击才进下一层，见 paintDiff 的 ondblclick）
  if(tgt && tgt.closest && tgt.closest('.whyb')) return;
}, true);

async function loadDiff(){
  killChart();
  TAB = 5; setTabs(); GROUP = null; stopPoll(); memStop();
  tableHead('');
  const d = await api('/api/diff' + (DIFFSCOPE ? '?scope=' + encodeURIComponent(DIFFSCOPE) : ''));
  DIFFLAST = d;
  /* ★ 兜一道：只留最后一级。同一个分支 Users › wan › AppData › Local › Temp 会一层层
     都出现（每层涨幅一样，因为全来自最深那个子目录），读的人不知道该看哪条。 */
  const onlyLeaves = arr => {
    if(!Array.isArray(arr) || arr.length < 2) return arr;
    const set = new Set(arr.map(r => r.path));
    const up = new Set();
    arr.forEach(r => {
      let q = String(r.path || "");
      for(;;){
        const i = Math.max(q.lastIndexOf(String.fromCharCode(92)), q.lastIndexOf("/"));
        if(i <= 2) break;
        q = q.slice(0, i);
        if(set.has(q)) up.add(q);
      }
    });
    return arr.filter(r => !up.has(r.path));
  };
  ["grown", "added", "gone"].forEach(k => { if(Array.isArray(d[k])) d[k] = onlyLeaves(d[k]); });
  const seg = '<span class="memsort" id="diffSort">' + DIFF_TABS.map(([v, t]) =>
    `<b data-v="${v}" class="${v === DIFFMODE ? 'on' : ''}">${t}</b>`).join('') + '</span>';
  if(!d.ready){
    // 只有一份快照时给个说法，别让用户对着空页面猜
    // （之前这里只写一行小字，看起来就跟"空白"一样）
    const drvR = String(d.root || '').replace(/[\\/]+$/, '') || '当前磁盘';
    const drv0 = /^[A-Za-z]:$/.test(drvR) ? drvR[0].toUpperCase() + ' 盘' : drvR;
    head('变化 · ' + drv0, '只统计这个盘（要换盘用右上角「切换磁盘」）', '', '', null);
    listEl.innerHTML = '';
    emptyBox('还没有能对比的历史',
             (d.firstText ? '已经记下 ' + d.firstText + ' 这一份快照。' : '本次已经记下第 1 份快照。') +
             '等你下次点右上角「重新扫描」（或者过几天再打开），这里就会列出' +
             '这段时间里哪些文件夹变大了、新增了什么、什么被删了。');
    return;
  }
  // 下钻之后，顶部的"现在 ← 原来"和净增都要按**当前这一层**算，
  // 否则点了 DxcCache 还显示整块盘的 +17.4 GB，对不上。
  const usedNow = (d.scope_cur != null ? d.scope_cur : d.cur_used);
  const usedWas = (d.scope_prev != null ? d.scope_prev : d.prev_used);
  const delta = usedNow - usedWas;
  // ★ 说清楚这是哪个盘的变化：之前只写"全盘"，看不出是 C 盘还是所有盘
  const drvRaw = String(d.root || '').replace(/[\\/]+$/, '') || '当前磁盘';
  const drv = /^[A-Za-z]:$/.test(drvRaw) ? drvRaw[0].toUpperCase() + ' 盘' : drvRaw;
  // ★ 汇总：把「变大 / 新增 / 新增大文件」和「消失 / 消失的大文件」各自加起来算总账
  // ★ "变大"那条行显示的是**涨了多少**（delta），汇总也必须是 delta ——
  //   以前拿的是 size（现在多大），所以 5.7+5.7+5.2… 能加出 196 GB 这种鬼数。
  //   新增/消失/新增大文件/消失的大文件 本身就是变化量，用 size。
  const sumOf = k => (d[k] || []).reduce((a, r) => {
    if(k === 'grown') return a + (r.delta != null ? r.delta : Math.max(0, (r.size || 0) - (r.was || 0)));
    return a + (r.size || r.sz || r.bytes || 0);
  }, 0);
  const grewUp = sumOf('grown') + sumOf('added') + sumOf('newf');
  const grewDown = sumOf('gone') + sumOf('delf');
  const net = grewUp - grewDown;
  /* ★ 顶部改成两层，别再塞成一整句：
       第一层（大字）：现在多大 ← 原来多大，以及净增多少
       第二层（小灰字）：跟哪天比、跨几天、这份榜单覆盖了多少
     原来那句里 "112.5 → 129.9（+17.4 GB）" 和 "全盘净增 +17.4 GB" 是同一件事，
     重复信息直接去掉；"↑↓ 选行 · Enter 进入" 这种说明也不放在这里。 */
  tableHead(`
    <div class="diffstat">
      <b class="now">${fmtMB(usedNow)}</b>
      <span class="was">← ${fmtMB(usedWas)}</span>
      <b class="dl ${delta >= 0 ? 'up' : 'down'}">${
        delta >= 0 ? '+' : '−'}${fmtMB(Math.abs(delta))}</b>
      <span class="when">跟 ${esc(d.prevText)} 比 · 跨 ${esc(d.spanText)}</span>
      <span class="cov">榜单覆盖 ↑${fmtMB(grewUp)} · ↓${fmtMB(grewDown)}${
        DIFFSCOPE ? '' : ' · 净 ' + (net >= 0 ? '+' : '−') + fmtMB(Math.abs(net))}</span>
    </div>`);

  // 面包屑：全盘 › Users › wan › …（点任意一级回到那一层）
  const rootP = String(d.root || '').replace(/[\\/]+$/, '');
  const crumbHTML = (() => {
    const parts = [{ name: '全盘', path: '' }];
    const rel = String(DIFFSCOPE || '').slice(rootP.length).replace(/^[\\/]+/, '');
    let acc = rootP;
    (rel ? rel.split(/[\\/]+/) : []).forEach(sg => {
      acc += '\\' + sg;
      parts.push({ name: sg, path: acc });
    });
    return parts.map(c =>
      '<span data-dp="' + esc(c.path) + '">' + esc(c.name) + '</span>')
      .join('<b>›</b>');
  })();
  head('变化 · ' + drv, '双击文件夹进入下一层 · 「看文件」看具体是哪个文件变了',
       seg, DIFFSCOPE ? crumbHTML : '',
       DIFFSCOPE ? () => { DIFFSCOPE = ''; loadDiff(); } : null);
  document.getElementById('crumbs').querySelectorAll('[data-dp]').forEach(el => {
    el.onclick = () => { DIFFSCOPE = el.dataset.dp || ''; loadDiff(); };
  });
  bindDiffSort();
  paintDiff();
}

/* ================= 重复文件页 ================= */
const DUP_TIP =

function dupRow(g, i){

  return `

        <div class="rmeta" data-fit title="${esc(first)}">${esc(first)}${

      </div>

/* 查重页的全局状态：规则、最近一次数据、已取到的分辨率 */
let DUP_RULE = 'first', DUPDATA = null, DUPINFO = {};

/* 按规则给一组重新打勾（保留的那份不勾） */
function applyKeep(bx, gg, inf, mode){
  const files = gg.files.slice();
  const px = f => (inf[f] ? inf[f].w * inf[f].h : 0);
  const mt = f => (inf[f] ? inf[f].mtimeText : '');
  let keep = files[0];
  if(mode === 'res') keep = files.reduce((a, b) => (px(b) > px(a) ? b : a), files[0]);
  else if(mode === 'new') keep = files.reduce((a, b) => (mt(b) > mt(a) ? b : a), files[0]);
  else if(mode === 'short') keep = files.reduce((a, b) => (b.length < a.length ? b : a), files[0]);
  bx.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = cb.dataset.f !== keep; });
  bx.querySelectorAll('.dupitem').forEach(it => {
    it.classList.toggle('keepme', it.querySelector('input').dataset.f === keep);
  });
}

/* 一键清除：所有勾上的组，每组按规则留一份，其余删掉 */
async function dupPurgeChecked(){
  const gs = (DUPDATA && DUPDATA.groups) || [];
  const rows = [...listEl.querySelectorAll('.row')];
  const pick = [];
  rows.forEach(el => {
    const cb = el.querySelector('.dupgpick');
    if(cb && cb.checked) pick.push(Number(el.dataset.g));
  });
  if(!pick.length){ toast('没有勾选任何组'); return; }
  const all = Array.isArray(null) ? [] : [];
  pick.forEach(i => { if(gs[i]) all.push.apply(all, gs[i].files); });
  toast('正在读取 ' + pick.length + ' 组的分辨率…');
  for(let k = 0; k < all.length; k += 30){
    try{
      const res = await api('/api/dupinfo?p=' + encodeURIComponent(all.slice(k, k + 30).join('|')));
      (res.files || []).forEach(x => { DUPINFO[x.p] = x; });
    }catch(e){ /* 读不到就退回"保留第一个" */ }
  }
  const del = [];
  let freed = 0;
  pick.forEach(i => {
    const g = gs[i];
    if(!g) return;
    const files = g.files.slice();
    const px = f => (DUPINFO[f] ? DUPINFO[f].w * DUPINFO[f].h : 0);
    const mt = f => (DUPINFO[f] ? DUPINFO[f].mtimeText : '');
    let keep = files[0];
    if(DUP_RULE === 'res') keep = files.reduce((a, b) => (px(b) > px(a) ? b : a), files[0]);
    else if(DUP_RULE === 'new') keep = files.reduce((a, b) => (mt(b) > mt(a) ? b : a), files[0]);
    else if(DUP_RULE === 'short') keep = files.reduce((a, b) => (b.length < a.length ? b : a), files[0]);
    files.forEach(f => { if(f !== keep) del.push(f); });
    freed += g.size * (files.length - 1);
  });
  if(!del.length){ toast('没有可删的副本'); return; }
  confirmBox({
    title: '一键清除？',
    html: '已勾选 <b>' + pick.length + '</b> 组，将删除 <b>' + del.length + '</b> 份副本，' +
          '预计释放 <b>' + fmtMB(freed) + '</b>。<br>每组保留：<em>' +
          ({first: '第 1 个', res: '分辨率最高', new: '最新', short: '路径最短'})[DUP_RULE] +
          '</em><br><em>这个操作不能撤销。</em>',
    okText: '确认删除',
    onOk: async () => {
      for(let k = 0; k < del.length; k += 40){
        await act('delmany', del.slice(k, k + 40).join('|'));
      }
      toast('已删除 ' + del.length + ' 份');
      setTimeout(dupAgain, 700);
    },
  });
}

function rowsAll(){ return [...listEl.querySelectorAll('.row')]; }

/* 展开：高度从 0 用弹簧曲线撑开（不能直接 transition height:auto），
   子项再错开飞入 —— 和 iOS 分组列表一个逻辑。 */
function openBox(el, box){
  el.after(box);
  el.__openbox = box;
  el.classList.add('open');
  if(!DUPANIM) return;                  // 关掉动画：直接就位
  const h = box.scrollHeight;
  box.style.height = '0px';
  box.style.overflow = 'hidden';
  box.style.opacity = '0';
  requestAnimationFrame(() => {
    box.style.transition = 'height .34s cubic-bezier(.34,1.56,.64,1),'
                        + ' opacity .16s ease';
    box.style.height = h + 'px';
    box.style.opacity = '1';
  });
  /* ★ 每一行都跑一段 transform 动画，叠加高度动画会让整段掉帧（用户反馈"卡卡的"）。
     改成整块一起淡入：视觉上仍然是"弹开 + 渐显"，但只动一个图层。 */
  box.style.willChange = 'height, opacity';
  setTimeout(() => { box.style.willChange = ''; }, 400);
  box.__settle = setTimeout(() => {
    box.style.transition = '';
    box.style.height = 'auto';
    box.style.overflow = '';
  }, 520);
}

/* 收起：高度弹簧收回，再摘掉节点 */
function closeBox(el){
  const box = el.__openbox;
  if(!box) return;
  el.__openbox = null;
  // ★ 先量高度再改类：移除 .open 会恢复组行封面，行高会变，
  //   先改类再量就会量到"已经变矮"的值，收起时下面的卡片会顶一下。
  if(!DUPANIM){ box.remove(); el.classList.remove('open'); return; }
  const h0 = box.offsetHeight;
  el.classList.remove('open');
  // ★ 打开时那个"收尾定时器"会把 height 改回 auto —— 不取消它，
  //   收起动画会被中途打断（表现就是"展开有动画、收回没有"）。
  if(box.__settle){ clearTimeout(box.__settle); box.__settle = 0; }
  box.style.transition = '';
  box.style.overflow = 'hidden';
  box.style.height = h0 + 'px';
  void box.offsetHeight;                 // 强制一次重排，让下面的 0 成为真正的变化
  requestAnimationFrame(() => {
    /* ★ height 归零还不够：content-box 下 padding / border / margin 不跟着归零，
       节点被移除那一帧它们会突然消失 —— 就是"归位前顿一下"。所以一起动画掉。 */
    box.style.transition = 'height .26s cubic-bezier(.4,0,.6,1), opacity .2s ease,'
                        + ' padding-top .26s cubic-bezier(.4,0,.6,1),'
                        + ' padding-bottom .26s cubic-bezier(.4,0,.6,1),'
                        + ' margin-bottom .26s cubic-bezier(.4,0,.6,1),'
                        + ' border-width .26s cubic-bezier(.4,0,.6,1)';
    box.style.height = '0px';
    box.style.opacity = '0';
    box.style.paddingTop = '0px';
    box.style.paddingBottom = '0px';
    box.style.marginBottom = '0px';
    box.style.borderWidth = '0px';
  });
  setTimeout(() => { if(box.parentNode) box.remove(); }, 300);
}

const DUP_RULE_TXT = {first: '保留第 1 个', res: '保留分辨率最高',
                      new: '保留最新', short: '保留路径最短'};

/* 切保留规则：缺分辨率的组先补拉一次，再按新规则重勾 */
async function setDupRule(v){
  DUP_RULE = v;
  const dd = document.getElementById('dupRuleDD');
  if(dd){
    dd.querySelector('.ddval').textContent = DUP_RULE_TXT[v] || v;
    dd.querySelectorAll('.ddmenu b').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    dd.classList.remove('on');
  }
  const boxes = [...listEl.querySelectorAll('.dupfiles')];
  const need = [];
  boxes.forEach(bx => {
    const gi = Number(bx.previousElementSibling && bx.previousElementSibling.dataset.g);
    const gg = (DUPDATA.groups || [])[gi];
    if(gg) gg.files.forEach(f => { if(!DUPINFO[f]) need.push(f); });
  });
  for(let k = 0; k < need.length; k += 30){
    try{
      const res = await api('/api/dupinfo?p=' + encodeURIComponent(need.slice(k, k + 30).join('|')));
      (res.files || []).forEach(x => { DUPINFO[x.p] = x; });
    }catch(e){ /* 拿不到就退回"第一个" */ }
  }
  boxes.forEach(bx => {
    const gi = Number(bx.previousElementSibling && bx.previousElementSibling.dataset.g);
    const gg = (DUPDATA.groups || [])[gi];
    if(gg) applyKeep(bx, gg, DUPINFO, DUP_RULE);
  });
  toast('已按「' + (DUP_RULE_TXT[v] || v) + '」重新勾选');
}

/* 自绘下拉：绑定 + 显示当前值 */
function bindDupRule(){

  dd.querySelectorAll('.ddmenu b').forEach(b => b.classList.toggle('on', b.dataset.v === DUP_RULE));

document.addEventListener('click', () => {
  document.querySelectorAll('.dd.on').forEach(x => x.classList.remove('on'));
});

function paintDup(d){
  const gs = d.groups || [];
  if(!gs.length){
    emptyBox('没有找到重复的大文件',
             '只统计 ' + '256 KB' + ' 以上的文件。同一份内容只有一处时不会列出来。');
    return;
  }
  listEl.innerHTML = gs.map(dupRow).join('');
  DUPDATA = d; DUPINFO = DUPINFO || {};
  // ★ 每组行首一个勾选框，**默认勾上** = 这组参与"清除选中的组"。
  //   不勾就代表这组先不动 —— 这样页头那个一键清除才有意义。
  listEl.querySelectorAll('.row').forEach(el => {
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'dupgpick';
    cb.checked = true;
    cb.title = '勾上 = 这组参与一键清除';
    cb.onclick = ev => ev.stopPropagation();
    el.insertBefore(cb, el.firstChild);
    // 组行直接摆一张封面图：不用点开也知道是不是同一段视频
    if(!DUPPIC || !isImg(gs[Number(el.dataset.g)].files[0])) return;
    const im = document.createElement('img');
    im.className = 'dupcover';
    im.alt = '';
    im.dataset.g = el.dataset.g;
    // ★ 先不占位：没有 src 的 <img> 会画成一个带边框的空盒子（用户截图那种）。
    //   等缩略图地址回来再显示。
    im.style.display = 'none';
    im.onerror = () => im.remove();
    el.insertBefore(im, cb.nextSibling);
  });
  // 封面图一次批量要（每组只取第一份），不额外生成缩略图
  const firsts = DUPPIC ? gs.map(g => g.files[0]).filter(Boolean) : [];
  for(let k = 0; k < firsts.length; k += 40){
    fetch('/api/thumbs?mode=big&p=' +
          encodeURIComponent(firsts.slice(k, k + 40).join('|')))
      .then(r => r.json())
      .then(res => {
        const m = {};
        (res.ok || []).forEach(o => { m[o.p] = o.u; });
        listEl.querySelectorAll('img.dupcover').forEach(im => {
          const g = gs[Number(im.dataset.g)];
          const u = g && m[g.files[0]];
          if(u){ im.src = u; im.style.display = ''; }
        });
      }).catch(() => {});
  }
  requestAnimationFrame(() => {
    const mx = Math.max.apply(null, gs.map(g => g.size * (g.files.length - 1))) || 1;
    listEl.querySelectorAll('.rbar i').forEach((el, i) => {
      el.style.width = barW(gs[i].size * (gs[i].files.length - 1) / mx).toFixed(1) + '%';
    });
    fitAll();
  });
  listEl.querySelectorAll('.row').forEach(el => {
    const g = gs[Number(el.dataset.g)];
    const extras = g.files.slice(1);            // 第一个留着，其余是可以删的
    // ★ 点一行不再"直接打开第一个"，而是展开这一组的**全部副本**：
    //   每份都能勾选，判断完直接删勾中的 —— 以前只能"保留第一个删其余"，
    //   想换个保留对象就没路可走。
    el.onclick = () => {
      // 同一个再点一次 = 收起；点别的 = 收起旧的那个、展开这个
      if(el.__openbox){ closeBox(el); return; }
      // 现在允许多个组同时展开：点别的组不再把之前的收起来
      const box = document.createElement('div');
      box.className = 'dupfiles';
      box.innerHTML = g.files.map((f, k) => `
        <label class="dupitem">
          <input type="checkbox" data-f="${esc(f)}"${k === 0 ? '' : ' checked'}>
          <img class="dupthumb" alt="">
          <span class="dupname" title="${esc(f)}">${esc(f.split(/[\\/]/).pop())}</span>
          <span class="duppath" title="${esc(f)}">${esc(f.replace(/[\\/][^\\/]+$/, ''))}</span>
          <span class="dupsize" title="每个副本大小相同">${fmtMB(g.size)}</span>
          <button class="mini" data-open="${esc(f)}">打开</button>
          <button class="mini" data-comp="${esc(f)}">对比</button>
          <button class="mini" data-rev="${esc(f)}">定位</button>
          <button class="mini danger" data-del1="${esc(f)}" title="删掉这一份（不可恢复）">删除</button>
        </label>`).join('') + `
        <div class="dupbar">
          <span class="duphint">默认保留第 1 个、其余已勾选。取消勾选你想留下的。</span>
          <button class="mini danger" id="dupDel">删除勾选的</button>
        </div>`;
      // ★ 展开后收起组行那张封面图，否则同一组会出现三张图（封面 + 两张副本）
      openBox(el, box);
      // ---- 缩略图（复用现有缩略图管线，不额外生成）----
      const thumb = {};
      fetch('/api/thumbs?mode=big&p=' + encodeURIComponent(g.files.join('|')))
        .then(r => r.json())
        .then(res => {
          /* ★ 按行贴回去：以前按 img[data-th=...] 找，而那个属性在后来的改动里
             被删掉了 —— 于是展开后每份副本的缩略图永远是空的。 */
          const m = {};
          (res.ok || []).forEach(o => { if(o && o.u) m[o.p] = o.u; });
          box.querySelectorAll('.dupitem').forEach(it => {
            const f = it.querySelector('input').dataset.f;
            const im = it.querySelector('.dupthumb');
            if(!m[f]) return;
            thumb[f] = m[f];
            if(im) im.src = m[f];
          });
        }).catch(() => {});
      // ---- 分辨率/时间 + 「更清晰」角标 ----
      const info = {};
      fetch('/api/dupinfo?p=' + encodeURIComponent(g.files.join('|')))
        .then(r => r.json())
        .then(res => {
          (res.files || []).forEach(x => { info[x.p] = x; DUPINFO[x.p] = x; });
          const px = f => (info[f] ? info[f].w * info[f].h : 0);
          const best = g.files.reduce((a, b) => (px(b) > px(a) ? b : a), g.files[0]);
          box.querySelectorAll('.dupitem').forEach(it => {
            const cb = it.querySelector('input');
            const f = cb.dataset.f, d = info[f];
            if(!d) return;
            const dim = (d.w && d.h) ? (d.w + '×' + d.h) : '—';
            const sp = it.querySelector('.dupsize');
            if(sp) sp.textContent = dim + ' · ' + fmtMB(d.size) + ' · ' + d.mtimeText;
            if(px(f) && f === best && g.files.length > 1){
              const b = document.createElement('span');
              b.className = 'dupbadge';
              b.textContent = '更清晰';
              it.insertBefore(b, it.querySelector('.dupsize'));
            }
          });
          // 规则默认值如果是 res，展开后立刻应用一次
          applyKeep(box, g, info, DUP_RULE);      // 组内也按全局规则预勾
        }).catch(() => {});
      // ---- 自动保留规则 ----
      const applyKeep = (bx, gg, inf, mode) => {
        const files = gg.files.slice();
        const px = f => (inf[f] ? inf[f].w * inf[f].h : 0);
        const mt = f => (inf[f] ? inf[f].mtimeText : '');
        let keep = files[0];
        if(mode === 'res') keep = files.reduce((a, b) => (px(b) > px(a) ? b : a), files[0]);
        else if(mode === 'new') keep = files.reduce((a, b) => (mt(b) > mt(a) ? b : a), files[0]);
        else if(mode === 'short') keep = files.reduce((a, b) => (b.length < a.length ? b : a), files[0]);
        bx.querySelectorAll('input').forEach(cb => { cb.checked = cb.dataset.f !== keep; });
        bx.querySelectorAll('.dupitem').forEach(it => {
          it.classList.toggle('keepme', it.querySelector('input').dataset.f === keep);
        });
      };
      // ---- 双栏对比 ----
      box.querySelectorAll('[data-comp]').forEach(b => {
        b.onclick = ev => {
          ev.preventDefault(); ev.stopPropagation();
          const a = g.files[0], c = b.dataset.comp;
          const cell = f => {
            const d = info[f] || {};
            const dim = (d.w && d.h) ? (d.w + '×' + d.h) : '—';
            return '<div class="cmpcol" data-f="' + esc(f) + '"><div class="cmpimg">' +
              (thumb[f] ? '<img src="' + thumb[f] + '" alt="">' : '') + '</div>' +
              '<div class="cmpname">' + esc(f.split(/[\\/]/).pop()) + '</div>' +
              '<div class="cmpmeta">' + dim + ' · ' + fmtMB(g.size) + ' · ' +
              esc(d.mtimeText || '—') + '</div>' +
              '<div class="cmppath">' + esc(f) + '</div></div>';
          };
          const mask = document.createElement('div');
          mask.className = 'cmpmask';
          mask.innerHTML = '<div class="cmpbox">' + cell(a) + cell(c) +
            '<div class="cmpclose">点任意处关闭</div></div>';
          // 右键某一栏 = 直接用系统默认程序打开那份
          mask.querySelectorAll('.cmpcol').forEach(col => {
            col.oncontextmenu = ev => {
              ev.preventDefault();
              ev.stopPropagation();
              ctxMenu(ev, [{label: '用默认程序打开', fn: () => act('open', col.dataset.f)}]);
            };
          });
          mask.onclick = () => mask.remove();
          document.body.appendChild(mask);
        };
      });
      // 展开时才去读这些副本的分辨率/时间（只读文件头，几十毫秒）
      fetch('/api/dupinfo?p=' + encodeURIComponent(g.files.join('|')))
        .then(r => r.json())
        .then(res => {
          const m = {};
          (res.files || []).forEach(x => { m[x.p] = x; });
          box.querySelectorAll('.dupitem').forEach(it => {
            const cb = it.querySelector('input');
            const f = m[cb.dataset.f];
            if(!f) return;
            const dim = (f.w && f.h) ? (f.w + chr(215) + f.h) : chr(8212);
            const sp = it.querySelector('.dupsize');
            if(sp) sp.textContent = dim + ' · ' + fmtMB(f.size) + ' · ' + f.mtimeText;
          });
        }).catch(() => {});
      box.querySelectorAll('[data-open]').forEach(b => {
        b.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); act('open', b.dataset.open); };
      });
      // 单份删除：卡片上直接点，不用先勾选再走底部的批量按钮
      box.querySelectorAll('[data-del1]').forEach(b => {
        b.onclick = ev => {
          ev.preventDefault(); ev.stopPropagation();
          const f = b.dataset.del1;
          if(!window.confirm('删掉这一份吗？\n\n' + f + '\n\n不能恢复。')) return;
          b.disabled = true;
          b.textContent = '删除中…';
          act('delmany', f).then(m => {
            if(m && m.error) toast('删除失败：' + m.error);
            else toast('已删除 1 份');
            setTimeout(dupAgain, 500);
          });
        };
      });
      box.querySelectorAll('[data-rev]').forEach(b => {
        b.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); act('reveal', b.dataset.rev); };
      });
      box.querySelector('#dupDel').onclick = ev => {
        ev.preventDefault(); ev.stopPropagation();
        const pick = [...box.querySelectorAll('input:checked')].map(x => x.dataset.f);
        if(!pick.length){ toast('没有勾选任何文件'); return; }
        if(pick.length >= g.files.length){ toast('至少要留一份，全都勾上就不删了'); return; }
        confirmBox({
          title: '删除勾选的副本？',
          html: '将删除 <b>' + pick.length + '</b> 份，保留 <b>' + (g.files.length - pick.length) + '</b> 份。<br>' +
                (g.verified ? '这一组已通过全量校验，内容完全相同。'
                            : '<em>注意：这一组没做全量校验，请自己确认过再删。</em>') +
                '<br><em>这个操作不能撤销。</em>',
          okText: '确认删除',
          onOk: async () => {
            const msg = await act('delmany', pick.join('|'));
            toast(msg || '已删除');
            setTimeout(dupAgain, 600);
          },
        });
      };
    };
    el.oncontextmenu = ev => ctxMenu(ev, [
      {label: '在资源管理器中显示第一个', fn: () => act('reveal', g.files[0])},
      {label: '复制全部 ' + g.files.length + ' 个路径', fn: () => copy(g.files.join('\n'))},
      {label: '删掉多余的 ' + extras.length + ' 个（保留第一个）', danger: true, fn: () => {
        confirmBox({
          title: '删除重复文件？',
          html: '将删除 <b>' + extras.length + '</b> 个文件，保留：<br>' +
                '<em>' + esc(g.files[0]) + '</em><br>' +
                '预计释放 <b>' + (g.canText || '') + '</b>。' +
                (g.verified ? '这些文件已通过全量校验，内容完全相同。'
                            : '<em>注意：这一组没做全量校验，请自己确认过再删。</em>') +
                '<br><em>这个操作不能撤销。</em>',
          okText: '确认删除',
          onOk: async () => {
            const msg = await act('delmany', extras.join('|'));
            toast(msg || '已删除');
            setTimeout(dupAgain, 600);   // 删完结果就作废了，按同一个目录重扫一遍
          },
        });
      }},
    ]);
  });
}

/* 重复识别就扫"当前这个文件夹"（含子目录），结果直接铺在主列表区，
   卡头给一个「返回上级」回到文件夹排行 —— 不再单开一个页签。 */
/* 已经拿到的缩略图地址：路径 -> {u, m}。
   回到同一个目录时直接照着显示，不用再问一遍服务器 ——
   不然每次进出都要重新加载一遍，看着就是在"重来"。
   用 Map 的插入顺序做简易 LRU，避免无限涨。 */
/* 图片/视频缩略图开关：独立于「文件夹缩略图」 */
(function(){
  const el = document.getElementById('swFile');
  if(!el) return;
  el.classList.toggle('on', FILEPIC);
  el.onclick = async () => {
    FILEPIC = !FILEPIC;
    el.classList.toggle('on', FILEPIC);
    if(TAB === 0 || TAB === -1) refreshRank();          // 原地重画，不跳回顶部
    await act('setpref', 'filePic=' + (FILEPIC ? '1' : '0'));
  };
})();
const THUMBCACHE = new Map();
/* 每渲染一次 +1。缩略图队列是跟着"这一屏"走的：换目录/换视图之后，
   上一轮还在飞的那个请求就没意义了 —— 用代数让它自己停，别再重复请求。 */
let THUMBGEN = 0;
const THUMBCACHE_MAX = 4000;
function thumbRemember(p, o){
  const k = String(p || '').toLowerCase();
  if(!k) return;
  if(THUMBCACHE.has(k)) THUMBCACHE.delete(k);
  THUMBCACHE.set(k, o);
  while(THUMBCACHE.size > THUMBCACHE_MAX){
    THUMBCACHE.delete(THUMBCACHE.keys().next().value);
  }
}

let DUPSCOPE = null;

async function showDup(scope){
  killChart();
  TAB = 0; setTabs(); GROUP = null; stopPoll(); memStop();
  tableHead('');
  DUPSCOPE = scope || '';
  /* ★ 有结果就直接显示：以前每次进来都无脑 act('redup') 全盘重扫一遍，
     几十秒白等。现在只有后端说"还没结果"(idle) 才扫；
     想重扫点页头的「重新扫描」。 */
  let _d = null;
  try{ _d = await api('/api/dup'); }catch(e){ /* 取不到就当没结果 */ }
  // ★ 必须比对 scope：后端只有"一份"结果，它可能属于别的目录 ——
  //   只看"有没有结果"就会把上一次的旧目录端出来（用户实测踩到）。
  const _same = _d && String(_d.scope || '') === String(DUPSCOPE || '');
  if(!_d || _d.state === 'idle' || !_same) await act('redup', DUPSCOPE);
  dupTick();
}

function dupAgain(){
  act('redup', DUPSCOPE || '');
  setTimeout(dupTick, 400);
}

async function dupTick(){
  const back = () => { DUPSCOPE = null; stopPoll(); loadRank(); };
  const btn = '<button class="mini" onclick="dupAgain()">重新扫描</button>' +
    // ★ 保留规则放到最上面、对全页生效 —— 一组一组切根本没意义
    '<span class="dd" id="dupRuleDD" title="一键清除时，每组保留哪一个">' +
    '<button class="mini ddbtn" type="button"><span class="ddval"></span><i class="caret"></i></button>' +
    '<div class="ddmenu">' +
    '<b data-v="first">保留第 1 个</b>' +
    '<b data-v="res">保留分辨率最高</b>' +
    '<b data-v="new">保留最新</b>' +
    '<b data-v="short">保留路径最短</b>' +
    '</div></span>' +
    '<button class="mini" id="dupAll" title="把下面所有组都勾上">全选</button>' +
    '<button class="mini" id="dupNone" title="全部取消勾选">全不选</button>' +
    '<button class="mini danger" id="dupPurge">清除选中的组</button>';
  let d;
  try{ d = await api('/api/dup'); }catch(e){ poll(dupTick); return; }
  const scopeText = (d.mediaOnly === false) ? '所有类型' : '只看图片和视频';
  const who = d.scope ? d.scope : '整块盘';
  if(d.state === 'running' || d.state === 'idle'){
    head('重复文件 · ' + who, d.ms || '正在扫描…', btn, '', back);
    spinner(d.ms || '正在扫描重复文件…',
            scopeText + ' · 先按大小分组，再比头尾，最后整份做 SHA-1 复核');
    poll(dupTick);
    return;
  }
  if(d.state === 'error'){
    head('重复文件 · ' + who, d.ms || '出错了', btn, '', back);
    emptyBox('扫描出错了', d.ms || '');
    return;
  }
  head('重复文件 · ' + who,
       '共 ' + d.n + ' 组 · 可释放 ' + (d.canText || '') + ' · ' + scopeText +
       ' · 只统计 256 KB 以上 · 右键一组可以对它操作',
       btn, '', back);
  paintDup(d);
  // 页头的规则和"一键清除"要在渲染之后绑（head 是刚重建的）
  bindDupRule();
  const markAll = v => {
    listEl.querySelectorAll('.dupgpick').forEach(cb => { cb.checked = v; });
    toast(v ? '已全选 ' + listEl.querySelectorAll('.dupgpick').length + ' 组'
            : '已全部取消');
  };
  const ba = document.getElementById('dupAll');
  if(ba) ba.onclick = () => markAll(true);
  const bn = document.getElementById('dupNone');
  if(bn) bn.onclick = () => markAll(false);
  const pg = document.getElementById('dupPurge');
  if(pg) pg.onclick = () => dupPurgeChecked();
}

/* ==================== 弹簧动画【要撤掉就删到本段结束】 ====================
   照 framer-motion 的 spring 做的：不写缓动曲线，只给刚度/阻尼/质量，
   每一帧做一次半隐式欧拉积分。

   ★「先缩小再展开」= 起始缩放就很小（x0=0.5，从按钮那一角冒出来），
     再弹到原始大小并轻微过冲。
     （试过用负初速度做"缩一下蓄力"：起点 0.72、v0=-6.5 —— 但在 60fps 下
       最小点落在第一帧，"缩小"那一拍根本看不见，所以放弃那个做法。）

   调手感只看这几个数：
     x0  起始大小（0.5 = 一半大；改 0.35 更夸张）
     k   越大越快
     c   越小越弹（现在过冲约 10.6%，落稳约 500ms）
     fade 淡入时长（秒） */
const PANEL_SPRING = {k: 600, c: 20, m: 1, x0: 0.50, v0: 0, fade: 0.10};

function springPanelIn(p){
  const {k, c, m, x0, v0, fade} = PANEL_SPRING;
  p._sgen = (p._sgen || 0) + 1;
  const gen = p._sgen;
  let x = x0, v = v0, t = 0, last = performance.now();
  // ★ 关掉自带的 transition：否则它会把每帧再平滑一次，弹簧的
  //   收缩和过冲全被抹平，看着就变成"慢慢飘过去"了。
  p.style.transition = 'none';
  p.style.transformOrigin = 'top right';   // 从按钮那一角长出来

  const draw = () => {
    p.style.transform = 'scale(' + x.toFixed(4) + ')';
    p.style.opacity = Math.min(1, t / fade).toFixed(3);
  };
  draw();

  const step = (now) => {
    if (p._sgen !== gen) return;                  // 被打断（比如中途关掉）
    const dt = Math.min((now - last) / 1000, 1 / 30);   // 掉帧时钳一下
    last = now;
    t += dt;
    const a = (-k * (x - 1) - c * v) / m;         // 目标是 1（原始大小）
    v += a * dt;
    x += v * dt;
    draw();
    if (Math.abs(x - 1) < 0.004 && Math.abs(v) < 0.02){
      p.style.transform = '';                     // 交还给 .panel.on
      p.style.opacity = '';
      p.style.transition = '';                    // 还原，关闭时还要靠它
      p.style.transformOrigin = '';
      return;
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ================= 键盘操作 =================
   ↑↓ 选行 · Enter/→ 进入 · ←/Backspace 返回 · 1~4 切页
   / 或 Ctrl+F 聚焦搜索 · Esc 关面板/清搜索 · Ctrl+C 复制路径 */
function selRows(){ return [...listEl.querySelectorAll('.row, .tile')]; }

function setSel(i){
  const rows = selRows();
  if(!rows.length){ SEL = -1; return; }
  SEL = Math.max(0, Math.min(rows.length - 1, i));
  rows.forEach((r, k) => r.classList.toggle('sel', k === SEL));
  const row = rows[SEL], sc = listEl.__sc;
  if(!sc || !row) return;
  // 把选中行滚进视野。滚动是 transform 驱动的，所以要改 goal 再踢一下循环。
  const lr = listEl.getBoundingClientRect(), rr = row.getBoundingClientRect();
  const top = rr.top - lr.top + sc.raw;          // 这一行在内容里的位置
  let want = sc.goal;
  if(top - 10 < sc.raw) want = top - 10;
  else if(top + rr.height + 10 > sc.raw + lr.height) want = top + rr.height + 10 - lr.height;
  want = Math.max(0, Math.min(sc.max, want));
  if(want !== sc.goal){ sc.goal = want; sc.spring = 0; sc.kick && sc.kick(); }
}

function typingIn(){
  const a = document.activeElement;
  return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable);
}

document.addEventListener('keydown', e => {
  // 关于面板开着的时候它最大，只认 Esc
  if(SETCLOSE){
    if(e.key === 'Escape'){ e.preventDefault(); SETCLOSE(); }
    return;
  }
  // 确认弹窗开着的时候只认 Esc / Enter
  if(CONF){
    if(e.key === 'Escape'){ e.preventDefault(); CONF(); }
    else if(e.key === 'Enter'){ e.preventDefault(); const b = $('#conf [data-r="1"]'); if(b) b.click(); }
    return;
  }
  if(e.key === 'Escape'){
    if(ctxOpen){ e.preventDefault(); closeCtx(); return; }
    if(panelOpen){ e.preventDefault(); closeDrives(); return; }
    if($('#q').value){ e.preventDefault(); setQuery(''); $('#q').blur(); return; }
    return;
  }
  if(typingIn()){
    if(e.key === 'Enter') $('#q').blur();
    return;                                        // 在搜索框里打字，别的键都不拦
  }
  const rows = selRows();
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(!rows.length) return;
    e.preventDefault();
    const d = e.key === 'ArrowDown' ? 1 : -1;
    setSel(SEL < 0 ? (d > 0 ? 0 : rows.length - 1) : SEL + d);
    return;
  }
  if(e.key === 'Enter' || e.key === 'ArrowRight'){
    if(SEL >= 0 && rows[SEL]){ e.preventDefault(); rows[SEL].click(); }
    return;
  }
  if(e.key === 'ArrowLeft' || e.key === 'Backspace'){
    const b = $('#backBtn');
    if(b && b.style.display !== 'none'){ e.preventDefault(); b.click(); }
    return;
  }
  if(e.key >= '1' && e.key <= '5' && !e.ctrlKey && !e.altKey && !e.metaKey){
    e.preventDefault(); switchTab(Number(e.key) - 1); return;
  }
  if(e.key === '/'){ e.preventDefault(); $('#q').focus(); return; }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f'){
    e.preventDefault(); $('#q').focus(); $('#q').select(); return;
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && SEL >= 0 && rows[SEL]){
    const p = rows[SEL].dataset.p;
    if(p){ e.preventDefault(); copy(p); }
  }
});

let SETCLOSE = null;

/* 把面板装进弹窗，并接好入场动画、三种关闭方式、上下渐隐。
   「关于」和「设置」共用这一套，免得两份几乎一样的代码。 */
function mountPanel(w, html){
  w.innerHTML = html;
  // ★ 必须先强制算一次样式再加 .on。
  //   同一帧里既写 innerHTML 又加类，浏览器会把两次变更合并 ——
  //   过渡就没有"起始值→结束值"可插值，面板会直接"啪"地出现，
  //   回弹自然也就看不到了（这就是"老是丢动画"的原因）。
  void w.offsetWidth;
  requestAnimationFrame(() => w.classList.add('on'));

  const close = () => { w.classList.remove('on'); SETCLOSE = null;
                        setTimeout(() => { if(!SETCLOSE) w.innerHTML = ''; }, 240); };
  w.querySelectorAll('[data-close]').forEach(b => { b.onclick = close; });
  w.onclick = ev => { if(ev.target === w) close(); };
  SETCLOSE = close;

  // 滚动到顶/底就关掉对应那一侧的淡出，免得第一项/最后一项被弄成半透明
  const cl = w.querySelector('.clist');
  if(cl){
    const updateFade = () => {
      cl.classList.toggle('at-top', cl.scrollTop <= 2);
      cl.classList.toggle('at-bot', cl.scrollTop + cl.clientHeight >= cl.scrollHeight - 2);
    };
    cl.addEventListener('scroll', updateFade);
    updateFade();
  }
  return close;
}

        <div><div class="sl">清理缩略图缓存</div>
          <div class="ss">删掉所有缓存的缩略图，下次打开目录时重新生成（改了缩略图逻辑后点这个）</div></div>

      </div>

      <div class="setfoot"><span class="credit">开发归 WANGHAOXUAN 所有</span></div>
    </div>`);
  const seg = w.querySelector('#segScale');
  const swM = w.querySelector('#swMem');
  const segT = w.querySelector('#segTheme');
  const swF = w.querySelector('#swFold');
  // ★ 图片/视频缩略图开关必须在这里绑：设置面板是这会儿才生成的，
  //   放脚本顶层去找 #swFile 会找不到。

  const swAnim = w.querySelector('#swDupAnim');

      if(TAB === 0 || TAB === -1) refreshRank();
      await act('setpref', 'filePic=' + (FILEPIC ? '1' : '0'));
    };
  }
  const swT = w.querySelector('#swTop');
  const swO = w.querySelector('#swOne');
  const swP = w.querySelector('#swPress');
  const swR = w.querySelector('#swRipple');
  const swS = w.querySelector('#swSweep');
  const swD = w.querySelector('#swDupMedia');
  // ★ v1.0.8：清理缩略图缓存按钮
  const btnClear = w.querySelector('#btnClearThumbs');
  if(btnClear){
    btnClear.onclick = async () => {
      btnClear.disabled = true;
      btnClear.textContent = '清理中…';
      try{
        const r = await act('clearthumbs', '');
        toast(r && r.ok ? '缩略图缓存已清理，下次打开目录会重新生成' : '清理完成');
      }catch(e){
        toast('清理失败：' + (e.message || e));
      }
      btnClear.disabled = false;
      btnClear.textContent = '清理';
    };
  }
  const themeNote = v => THEME_NOTE[v];
  const paint = () => {
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === cur));
    w.querySelector('#scaleNote').innerHTML = SCALE_NOTE[cur];
    swM.classList.toggle('on', mem === 'on');
    w.querySelector('#memNote').innerHTML = MEM_NOTE[mem];
    segT.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === thm));
    w.querySelector('#themeNote').innerHTML = themeNote(thm);
    swF.classList.toggle('on', FOLDERPIC);
    swT.classList.toggle('on', HIDETOP);
    swO.classList.toggle('on', ONECLICK);
    swP.classList.toggle('on', ANIM_PRESS);
    swR.classList.toggle('on', ANIM_RIPPLE);
    swS.classList.toggle('on', LOAD_SWEEP);
    const swI = w.querySelector('#swTile');
    if(swI) swI.classList.toggle('on', TILE_ANIM);
    swD.classList.toggle('on', DUP_MEDIA);
  };
  const bindSw = (el, get, set) => {
    el.onclick = async () => {
      set(!get());
      el.classList.toggle('on', get());
      if(TAB === 0) loadRank();
      await act('setpref', el.dataset.pref + '=' + (get() ? '1' : '0'));
    };
  };
  swT.dataset.pref = 'hideTopPic';
  swO.dataset.pref = 'oneClick';
  swF.dataset.pref = 'folderPic';
  swF.onclick = async () => {
    FOLDERPIC = !FOLDERPIC;
    swF.classList.toggle('on', FOLDERPIC);
    const headerPic = document.querySelector('#picSeg b');
    if(headerPic) headerPic.classList.toggle('on', FOLDERPIC);
    if(TAB === 0 || TAB === -1) refreshRank();             // 原地重画，别跳回顶部
    await act('setpref', 'folderPic=' + (FOLDERPIC ? '1' : '0'));
  };
  swT.onclick = async () => {
    HIDETOP = !HIDETOP;
    swT.classList.toggle('on', HIDETOP);
    if(TAB === 0 || TAB === -1) refreshRank();
    await act('setpref', 'hideTopPic=' + (HIDETOP ? '1' : '0'));
  };
  swO.onclick = async () => {
    ONECLICK = !ONECLICK;
    swO.classList.toggle('on', ONECLICK);
    await act('setpref', 'oneClick=' + (ONECLICK ? '1' : '0'));
  };
  const bindAnim = (el, get, set, pref) => {
    el.onclick = async () => {
      set(!get());
      el.classList.toggle('on', get());
      applyAnim();
      await act('setpref', pref + '=' + (get() ? '1' : '0'));
    };
  };
  bindAnim(swP, () => ANIM_PRESS, v => { ANIM_PRESS = v; }, 'animPress');
  bindAnim(swR, () => ANIM_RIPPLE, v => { ANIM_RIPPLE = v; }, 'animRipple');
  bindAnim(swS, () => LOAD_SWEEP, v => { LOAD_SWEEP = v; }, 'loadSweep');
  const swI2 = document.querySelector('#swTile');
  if(swI2) bindAnim(swI2, () => TILE_ANIM, v => { TILE_ANIM = v; }, 'tileAnim');
  bindAnim(swD, () => DUP_MEDIA, v => { DUP_MEDIA = v; }, 'dupMediaOnly');
  paint();
  seg.querySelectorAll('button').forEach(b => {
    b.onclick = async () => {
      if(b.dataset.v === cur) return;
      cur = b.dataset.v;
      applyBarScale(cur);
      paint();
      await act('setpref', 'barScale=' + cur);
      // 立刻把当前这一页重画一遍，效果当场可见
      redrawTab();
    };
  });
  segT.querySelectorAll('button').forEach(b => {
    b.onclick = async () => {
      if(b.dataset.v === thm) return;
      thm = b.dataset.v;
      applyThemePref(thm);                   // 立刻生效，手感马上有
      paint();
      redrawTab();
      await act('setpref', 'theme=' + thm);
    };
  });
  swM.onclick = async () => {
      {
        mem = (mem === 'on') ? 'off' : 'on';
        const on = (mem === 'on');
        applyMemTab(on);                     // 页签先显/隐，手感立刻有反馈
        paint();
        await act('setpref', 'memPage=' + mem);
        if(on && TAB !== 4) switchTab(4);    // 打开就直接带过去看一眼
        else if(!on && TAB === 4) switchTab(0);
      }
  };
}

/* ---------------- 搜索框 ---------------- */
let qt = null;
function setQuery(v){
  QUERY = v;
  $('#q').value = v;
  $('#qclr').style.display = v ? 'block' : 'none';
  if(!v){ switchTab(TAB < 0 ? 0 : TAB); return; }
  loadSearch();
}
$('#q').addEventListener('input', (e) => {
  const v = e.target.value.trim();
  $('#qclr').style.display = v ? 'block' : 'none';
  clearTimeout(qt);
  qt = setTimeout(() => { QUERY = v; if(v) loadSearch(); else switchTab(TAB < 0 ? 0 : TAB); }, 320);
});

/* ---------------- 顶栏状态 ---------------- */
async function refreshState(){
  const d = await api('/api/state');
  subEl.textContent = d.sub || '';
  $('#rescanBtn').disabled = !!d.busy;
  $('#rescanBtn').textContent = d.busy ? (d.phase === 'cache' ? '读取缓存…' : '扫描中…')
                                       : '重新扫描';
  return d;
}
async function watchScan(){
  const back = TAB;                    // ★ 记住切换前停在哪一页
  spinner('正在切换磁盘…');
  head('文件夹排行', '', '', '');
  const tick = async () => {
    let d;
    try{ d = await refreshState(); }
    catch(e){ poll(tick, 800); return; }   // 一次读不到别把轮询链弄死
    if(d.busy){
      // ★ 每次轮询都要把后端给的进度写出来：以前这里只有 poll，没有更新文字，
      //   所以整页一直是那句正在切换磁盘…，百分比/已扫描数全被压在后端没人看。
      const drv = (d.target || '').replace(/[\\/]+$/, '');
      spinner(d.prog || (d.phase === 'cache' ? '正在读取缓存…' : '正在扫描…'),
              drv ? drv + ' 正在统计，别关窗口' : '正在统计，别关窗口');
      poll(tick, 700);
      return;
    }
    if(d.msg) toast(d.msg);
    // ★ 回到原来那一页。以前这里写死 loadRank()，所以在「变化」「清理」「软件」
    //   这些页面切盘，成功后一律被拽回「排行」。
    if(back && back !== 0){ TAB = -1; switchTab(back); }
    else loadRank();
    refreshState();
  };
  tick();
}
$('#rescanBtn').onclick = async () => {
  await act('rescan');
  watchScan();
};

/* ---------------- 后端心跳 ----------------
   ★ 服务器靠它判断「窗口还在不在」。
   不能靠 Edge 启动进程退出判断：同一个 profile 第二次启动时，msedge 会把命令
   交接给已有浏览器进程然后自己 0.3 秒退出，启动进程一退服务器就被关掉了，
   新窗口就停在 ERR_CONNECTION_REFUSED。 */
let beatFail = 0;
function beat(){
  fetch('/api/ping', {cache:'no-store'})
    .then(() => { beatFail = 0; })
    .catch(() => { if(++beatFail >= 3) lostBackend(); });
}
beat();
setInterval(beat, 2000);
function sayBye(){ try{ navigator.sendBeacon('/api/bye'); }catch(e){} }
window.addEventListener('pagehide', sayBye);
window.addEventListener('beforeunload', sayBye);

function lostBackend(){
  if(document.getElementById('lost')) return;
  const d = document.createElement('div');
  d.id = 'lost';
  d.innerHTML = '<div class="lostbox"><b>后端服务已断开</b>' +
    '<span>空间透镜的主程序已经退出了（可能被任务管理器结束，或者被别的清理工具关掉）。' +
    '<br>关掉这个窗口，重新打开「空间透镜_Web版」就能恢复。</span></div>';
  document.body.appendChild(d);
}

/* ================= 主题切换 =================
   THEME_PREF 是"用户选的那一档"（auto/dark/light），
   data-theme 是"最终生效的"（dark/light）。 */
/* 点击波纹：全局代理，不给每个渲染分支都加一遍。
   卡片本身 overflow:hidden，所以波纹会自动被圆角裁掉。 */
document.addEventListener('pointerdown', ev => {
  if(!ANIM_RIPPLE) return;
  const el = ev.target && ev.target.closest && ev.target.closest('.tile, .row, .lg');
  if(!el) return;
  const r = el.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 2.1;
  const sp = document.createElement('span');
  sp.className = 'rip';
  sp.style.width = sp.style.height = d + 'px';
  sp.style.left = (ev.clientX - r.left - d / 2) + 'px';
  sp.style.top = (ev.clientY - r.top - d / 2) + 'px';
  el.appendChild(sp);
  setTimeout(() => { try{ sp.remove(); }catch(e){} }, 580);
}, true);

let THEME_PREF = 'auto';
const THEME_NOTE = {
  auto: '跟着 Windows 的浅色 / 深色设置走。',
  dark: '始终深色，不管系统怎么设。',
  light: '始终浅色（页面顶部从白起，配白色标题栏）。',
};
const systemLight = () => matchMedia('(prefers-color-scheme: light)').matches;
/* 把三态偏好落到 DOM 上；返回主题有没有真的变（变了才需要重画图表） */
function paintTheme(){
  const use = THEME_PREF === 'auto' ? (systemLight() ? 'light' : 'dark') : THEME_PREF;
  const root = document.documentElement;
  const changed = root.getAttribute('data-theme') !== use;
  root.setAttribute('data-theme', use);
  return changed;
}
function applyThemePref(p){
  THEME_PREF = (p === 'dark' || p === 'light') ? p : 'auto';
  paintTheme();
}
/* 主题一变，canvas / 内联 SVG 里那些画好的颜色不会自己更新，得重画一遍当前页 */
function redrawTab(){
  if(TAB === 0) loadRank();
  else if(TAB === 1) loadType();
  else if(TAB === 2) loadClean(false);
  else if(TAB === 3) loadSoft(false);
  else if(TAB === 4) loadMem();
  else if(TAB === 5) loadDiff();
}
/* 系统明暗变了：只有在「跟随系统」时才需要跟着走 */
try{
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if(THEME_PREF !== 'auto') return;
    paintTheme();
    redrawTab();
  });
}catch(e){}

/* ================= 主题调色板 =================
   CSS 变量管不到 canvas（ECharts）和内联 SVG 的属性，所以这里单独一套。
   以后加图表不要写死颜色，从 pal() 里取。 */
const PAL = {
  dark: {
    axis:'#7F8FA3', grid:'rgba(255,255,255,.06)', grid2:'rgba(255,255,255,.05)',
    text:'#E9EEF6', muted:'#7F8FA3', note:'#C6D2E2',
    halo:'rgba(0,0,0,.8)',
    tipBg:'rgba(20,26,36,.94)', tipBd:'rgba(255,255,255,.16)', tipTx:'#e6edf7',
    rest:'rgba(255,255,255,.09)', ring:'rgba(255,255,255,.06)',
    accent:'#68bcd9', area:'rgba(104,188,217,.20)',
    barUp:'rgba(104,188,217,.85)', barDn:'rgba(224,160,74,.75)',
    warm:'#e0a04a', dir:'#8FA8D8', catOther:'#8093F1',
    cat:{'浏览器':'#68bcd9','开发工具':'#9a68d9','游戏':'#d98d68','通讯':'#d968b3',
         '媒体':'#68d9bc','系统':'#6891d9','其他':'#8093F1'},
  },
  light: {
    axis:'#5D6B80', grid:'rgba(16,28,48,.10)', grid2:'rgba(16,28,48,.07)',
    text:'#16202F', muted:'#5D6B80', note:'#3E4859',
    halo:'rgba(255,255,255,.85)',
    tipBg:'rgba(255,255,255,.97)', tipBd:'rgba(16,28,48,.16)', tipTx:'#16202F',
    rest:'rgba(16,28,48,.08)', ring:'rgba(16,28,48,.07)',
    accent:'#2E9BC4', area:'rgba(46,155,196,.20)',
    barUp:'rgba(46,155,196,.90)', barDn:'rgba(190,120,20,.80)',
    warm:'#A5651A', dir:'#5A79B8', catOther:'#5566C8',
    /* 白底上要用更深一档的同类色，否则浅色块和浅色字都糊在一起 */
    cat:{'浏览器':'#2E9BC4','开发工具':'#7048B8','游戏':'#C06A38','通讯':'#C04A96',
         '媒体':'#1FA88C','系统':'#3A63C0','其他':'#5566C8'},
  },
};
/* 把颜色按比例压深 —— 给"按扇形本色写字"用（浅色底上要更深的字才看得清） */
function shade(c, f){
  const m = /^#?([0-9a-f]{6})$/i.exec(c || '');
  if(!m) return c;
  const v = parseInt(m[1], 16);
  return 'rgb(' + Math.min(255, Math.round(((v >> 16) & 255) * f)) + ',' +
                  Math.min(255, Math.round(((v >> 8) & 255) * f)) + ',' +
                  Math.min(255, Math.round((v & 255) * f)) + ')';
}
const isLight = () => document.documentElement.getAttribute('data-theme') === 'light';
const pal = () => isLight() ? PAL.light : PAL.dark;

/* ---------------- 启动 ---------------- */
const HASH = (location.hash.match(/tab=(\d)/) || [])[1];
const HASHQ = (location.hash.match(/q=([^&]*)/) || [])[1];
const HASHP = (location.hash.match(/path=([^&]*)/) || [])[1];
const HASHG = (location.hash.match(/group=(\d+)/) || [])[1];
const HASHE = (location.hash.match(/ext=([^&]*)/) || [])[1];
async function enter(){
  if(HASHQ !== undefined && HASHQ !== null && HASHQ !== ''){
    setQuery(decodeURIComponent(HASHQ));
    return;
  }
  if(HASHP !== undefined && HASHP !== null && HASHP !== ''){
    path = decodeURIComponent(HASHP);
    loadRank();
    setTimeout(moveBar, 60);
    return;
  }
  if(HASHG !== undefined && HASHG !== null && HASHG !== ''){
    GROUP = Number(HASHG);
    EXT = (HASHE !== undefined && HASHE !== null && HASHE !== '')
          ? decodeURIComponent(HASHE) : null;
    loadType();
    setTimeout(moveBar, 60);
    return;
  }
  if(HASH !== undefined && HASH !== null && HASH !== ''){
    switchTab(Number(HASH));
    setTimeout(moveBar, 60);
    return;
  }
  loadRank();
  setTimeout(moveBar, 60);
}
(async function boot(){
  // 设置要先读回来再渲染，否则第一屏的条形会按默认值画，读完之后不刷新就对不上
  try{
    const p = await api('/api/prefs');
    applyBarScale(p.barScale);
    applyView(p.viewMode);             // 显示方式也要在第一屏就定好
    if(p.folderPic !== undefined) FOLDERPIC = !!p.folderPic;
    if(p.filePic !== undefined) FILEPIC = !!p.filePic;
    if(p.dupPic !== undefined) DUPPIC = !!p.dupPic;
    if(p.dupAnim !== undefined) DUPANIM = !!p.dupAnim;
    if(p.bgAnim !== undefined) BGANIM = !!p.bgAnim;
    if(p.hideTopPic !== undefined) HIDETOP = !!p.hideTopPic;
    if(p.oneClick !== undefined) ONECLICK = !!p.oneClick;
    if(p.animPress !== undefined) ANIM_PRESS = !!p.animPress;
    if(p.animRipple !== undefined) ANIM_RIPPLE = !!p.animRipple;
    if(p.loadSweep !== undefined) LOAD_SWEEP = !!p.loadSweep;
    if(p.tileAnim !== undefined) TILE_ANIM = !!p.tileAnim;
    if(p.dupMediaOnly !== undefined) DUP_MEDIA = !!p.dupMediaOnly;
    if(p.searchFold !== undefined) SEARCHFOLD = !!p.searchFold;
    applyAnim();
    applyMemTab(!!p.memPage);          // 内存页签开没开，启动时就要定好
    // 主题在 <head> 那个脚本里已经定过了（避免闪一下），这里只是和设置对齐
    applyThemePref(p.theme);
  }catch(e){}
  const d = await refreshState();
  if(!d.ready){ spinner(d.prog || '正在准备…', '首次启动会真实扫描一遍，之后 7 天内秒开'); 
                poll(async () => { const s = await refreshState();
                                   if(s.ready) enter(); else boot(); }, 600);
                return; }
  enter();
})();
