<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#18212E">
<!-- color-scheme 跟着 data-theme 走：它决定表单控件/滚动条/默认画布底色 -->
<meta name="color-scheme" content="dark light">
<title>空间透镜 SpaceLens</title>
<script>
/* 主题三态：dark / light / auto（跟随系统）。下面引号里那串由本地服务在返回页面时
   替换成真实设置，所以第一帧就是对的、不会闪。
   ★ 占位符不能是变量名的子串 —— 用 __THEME_PREF__ 的时候，替换会把变量名本身
     也改成 window.auto，反而读不到值。
   直接双击打开这个文件也能用：替换没发生，值不是 dark/light 就退成 auto。 */
window.__THEME_PREF__ = "@@THEME@@";
(function(){
  var p = window.__THEME_PREF__;
  if(p !== 'dark' && p !== 'light') p = 'auto';
  var sysLight = matchMedia('(prefers-color-scheme: light)').matches;
  var root = document.documentElement;
  root.setAttribute('data-theme', p === 'auto' ? (sysLight ? 'light' : 'dark') : p);
})();
</script>
<style>
/* ---------------------------------------------------------------
   配色照 FufuLauncher 的暗色体系 —— 所有表面都是「白色 + 低透明度」
   叠在深色底上，而不是实色。这样叠在模糊背景上才有玻璃感。

   ★ 浅色主题见本段末尾的 [data-theme="light"] 块。做法不是另写一套 CSS：
     --ink 就是上面那句「白色 + 低透明度」里的白色，浅色下换成 0,0,0，
     所有用 rgba(var(--ink),…) 的表面就自动变成「黑色 + 低透明度」。
   --------------------------------------------------------------- */
:root{
  --bg:#18212E; --bg2:#222C3D;
  --ink:255,255,255;             /* 叠加层基色：浅色主题下翻成 0,0,0 */
  --hi:rgba(var(--ink),.07);    /* 卡片上沿那道光；浅色下要反过来是白的实线 */
  --halo:rgba(0,0,0,.6);         /* 圆环百分比标注的字描边 */
  --sh0:rgba(0,0,0,.30);         /* 行 / 小块投影 */
  --sh1:rgba(0,0,0,.42);
  --sh2:rgba(0,0,0,.5);
  --sh3:rgba(0,0,0,.61);
  --card:rgba(42,53,70,.51);     /* 内容大卡的底（比 --glass 更实一点） */
  --panel:rgba(44,55,73,.60);    /* 贴在按钮上的弹出层 */
  --box:rgba(46,57,75,.76);      /* 居中的大面板（设置） */
  --box2:rgba(21,26,36,.86);      /* 居中的大面板（更实的那种） */
  --scrim:rgba(5,8,12,.34);      /* 弹层后面那层压暗 */
  --scrim2:rgba(5,8,12,.55);
  --solid:rgba(48,59,77,.92);    /* 浮动面板的实底（toast / 确认框 / 提示） */
  --solid2:rgba(46,57,75,.97);
  --name:#ECF2F9;                /* 行名 */
  --note:#DFE8F3;                /* 日志正文 / 图表数值 */
  --danger-t:#ffb4ae;            /* 危险色的文字版（比 --danger 浅） */
  --warm:#e0a04a;                /* 「在涨 / 在写盘」的暖色 */
  --bar1:#5aa0b8; --bar2:#68bcd9;/* 排行条渐变 */
  /* 顶部渐变：起点色必须等于标题栏实际颜色（= 系统的明暗），否则会有一条硬缝 */
  --topfade:#000;
  --fadeH:132px;        /* 渐变总高 */
  --fadeSolid:16%;      /* 前这一段是实心的（其余渐隐） */
  --press:0.96;         /* 按下时的缩放（弹簧按压）。★ 必须放在基础 :root 里：
                           放浅色块里的话，深色模式下 var(--press) 取不到值，
                           整条 transform 声明作废，按下去就没反应 */
  --glass:rgba(var(--ink),.09);
  --glass-hi:rgba(var(--ink),.124);
  --stroke:rgba(var(--ink),.19);
  --text:#EFF4FA; --muted:#9AABBF;
  --accent:#4CC9F0;
  --safe:#3FBF74; --caut:#E0B04A; --danger:#E06C64;

  /* ---------- 圆角：只留三档（圆用 50%）----------
     嵌套规则：内层圆角 = 外层圆角 − 内边距。
     所以按钮/小方块不各写各的，直接 calc() 从外层推。 */
  --r:16px;      /* 面板 / 弹窗 / 大卡 */
  --r-md:11px;   /* 行卡片 / 图例 / 日志条目 / 面板内小块 */
  --r-sm:7px;    /* 按钮 / 分段控件内块 / 标签 */
  --r-xs:5px;    /* 极小徽标、色块 */

  /* ---------- 间距：只用 4 的倍数 ---------- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
button{cursor:pointer}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:14px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}

/* ---------------- 自绘标题栏 ----------------
   Edge 原生标题栏是 Chromium 自己画的，改不了颜色也去不掉（见 .bg::after 的注释），
   所以这里不留自绘标题栏，只做顶部压黑让两者融合。 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(76,201,240,.42);border-radius:5px;
     border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(76,201,240,.7);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* 背景：深色渐变 + 几团缓慢漂移的色斑。
   色斑存在的唯一目的就是「有东西可以糊」—— 毛玻璃必须有背景才看得出来。 */
.bg{position:fixed;inset:0;background:linear-gradient(170deg,var(--bg),var(--bg2));
     z-index:0;overflow:hidden;
     /* ★ 背景球快慢只改这一个数：0.55 = 比原始时长快约 1.8 倍。
        所有球的时长都是 calc(原始秒数 * var(--spd))，改这里一起变。 */
     --spd:.55}
/* ★ 顶部渐变（原来叫「顶部压黑」）：
   Edge 的 --app 窗口那条原生标题栏是纯黑的，而且 Chromium 自己画标题栏
   （DWMWA_CAPTION_COLOR / manifest theme_color / 去掉 WS_CAPTION / WCO
   都试过，全都不起作用 —— 换成浅色页面标题栏也还是黑的）。
   既然改不了它，就让页面顶部从**它本来的颜色**起步（--topfade = --frame），
   这条缝隙就消失了 —— 之前丑是因为标题栏正下方就是一团蓝色光斑。
   ★ 手动选了和系统相反的主题时（比如系统暗色 + 你选浅色），标题栏和页面本来
     就不同色，这时把渐变缩短一点，读起来像一条柔和的分界，而不是一大团脏色。 */
.bg::after{content:"";position:absolute;left:0;right:0;top:0;height:var(--fadeH);
  background:linear-gradient(180deg,var(--topfade) 0%,
                             var(--topfade) var(--fadeSolid,16%),
                             rgba(0,0,0,0) 100%);
  pointer-events:none}
/* ==================== 动态背景【要撤掉就删到本段结束】 ====================
   屏保式巡游：每个球沿一条闭合路径绕屏幕走一圈，走完接下一圈
   （infinite，**不带 alternate** —— 带 alternate 就只会在原位来回摆）。
   位移用 vw/vh，所以窗口大小变了路径自动跟着变。

   每条路径的时长都不一样（37~57s），所以它们永远不会同步，
   看不出循环。仍然只动 transform / opacity：合成器属性，不触发重绘，
   上面那些 backdrop-filter 毛玻璃卡片不会因此每帧重新模糊。 */
.blob{position:absolute;border-radius:50%;filter:none;
      /* ★ 加回 will-change：这 8 层各成一张贴图，光栅化一次之后
         每帧只改 transform/opacity。不加的话浏览器可能每帧重绘。 */
      will-change:transform,opacity;
      pointer-events:none;
      animation:var(--anim) var(--dur) ease-in-out infinite}
/* b1：从左上出发，绕到右下再回来 */
@keyframes roam1{
  0%  {transform:translate3d(0,0,0) scale(1);           opacity:.34}
  22% {transform:translate3d(28vw,20vh,0) scale(1.22);  opacity:.50}
  48% {transform:translate3d(50vw,44vh,0) scale(.94);   opacity:.30}
  74% {transform:translate3d(18vw,54vh,0) scale(1.14);  opacity:.46}
  100%{transform:translate3d(0,0,0) scale(1);           opacity:.34}}
/* b2：从右上往左下走 */
@keyframes roam2{
  0%  {transform:translate3d(0,0,0) scale(1.12);        opacity:.30}
  26% {transform:translate3d(-26vw,16vh,0) scale(.92);  opacity:.48}
  54% {transform:translate3d(-46vw,40vh,0) scale(1.18); opacity:.32}
  80% {transform:translate3d(-16vw,26vh,0) scale(1.00); opacity:.46}
  100%{transform:translate3d(0,0,0) scale(1.12);        opacity:.30}}
/* b3：从下方向上走，横穿 */
@keyframes roam3{
  0%  {transform:translate3d(0,0,0) scale(.94);         opacity:.30}
  30% {transform:translate3d(-22vw,-30vh,0) scale(1.20);opacity:.48}
  58% {transform:translate3d(12vw,-50vh,0) scale(.96);  opacity:.30}
  82% {transform:translate3d(30vw,-18vh,0) scale(1.14); opacity:.44}
  100%{transform:translate3d(0,0,0) scale(.94);         opacity:.30}}
/* b4：斜着来回穿，路径最长 */
@keyframes roam4{
  0%  {transform:translate3d(0,0,0) scale(1.08);        opacity:.20}
  28% {transform:translate3d(40vw,26vh,0) scale(.88);   opacity:.40}
  56% {transform:translate3d(8vw,52vh,0) scale(1.16);   opacity:.24}
  78% {transform:translate3d(-12vw,20vh,0) scale(.96);  opacity:.38}
  100%{transform:translate3d(0,0,0) scale(1.08);        opacity:.20}}
/* b5：从右下往左上走 */
@keyframes roam5{
  0%  {transform:translate3d(0,0,0) scale(1);           opacity:.28}
  24% {transform:translate3d(-26vw,-34vh,0) scale(1.22);opacity:.46}
  52% {transform:translate3d(-50vw,-12vh,0) scale(.92); opacity:.28}
  76% {transform:translate3d(-18vw,-26vh,0) scale(1.12);opacity:.42}
  100%{transform:translate3d(0,0,0) scale(1);           opacity:.28}}
.b1{width:896px;height:896px;left:-318px;top:-188px;background:#476497;
    --anim:roam1;--dur:calc(37s * var(--spd))}
.b2{width:768px;height:768px;right:-274px;top:-54px;background:#6b4797;
    --anim:roam2;--dur:calc(43s * var(--spd));animation-delay:-11s}
.b3{width:864px;height:704px;left:calc(36% - 162px);bottom:-322px;background:#479783;
    --anim:roam3;--dur:calc(49s * var(--spd));animation-delay:-23s}
.b4{width:672px;height:672px;left:calc(20% - 126px);top:calc(4% - 126px);
     background:#97477c;
    --anim:roam4;--dur:calc(41s * var(--spd));animation-delay:-31s}
.b5{width:800px;height:800px;right:calc(4% - 150px);bottom:-320px;background:#4a4797;
    --anim:roam5;--dur:calc(57s * var(--spd));animation-delay:-7s}
.b6{width:736px;height:736px;left:calc(44% - 138px);top:-278px;background:#478397;
    --anim:roam6;--dur:calc(33s * var(--spd));animation-delay:-5s}
.b7{width:832px;height:832px;left:-316px;bottom:-316px;background:#8b4797;
    --anim:roam7;--dur:calc(45s * var(--spd));animation-delay:-19s}
.b8{width:640px;height:640px;right:-220px;top:calc(40% - 120px);background:#976147;
    --anim:roam8;--dur:calc(53s * var(--spd));animation-delay:-27s}
/* b6：从上中往右下斜穿 */
@keyframes roam6{
  0%  {transform:translate3d(0,0,0) scale(1.05);        opacity:.16}
  30% {transform:translate3d(24vw,30vh,0) scale(.90);   opacity:.52}
  60% {transform:translate3d(-14vw,52vh,0) scale(1.18); opacity:.22}
  82% {transform:translate3d(-20vw,16vh,0) scale(1.00); opacity:.48}
  100%{transform:translate3d(0,0,0) scale(1.05);        opacity:.16}}
/* b7：从左下往右上走 */
@keyframes roam7{
  0%  {transform:translate3d(0,0,0) scale(.95);         opacity:.14}
  26% {transform:translate3d(30vw,-24vh,0) scale(1.20); opacity:.50}
  56% {transform:translate3d(52vw,-42vh,0) scale(.92);  opacity:.20}
  80% {transform:translate3d(20vw,-12vh,0) scale(1.10); opacity:.46}
  100%{transform:translate3d(0,0,0) scale(.95);         opacity:.14}}
/* b8：偏暖的琥珀色，绕着右侧转 */
@keyframes roam8{
  0%  {transform:translate3d(0,0,0) scale(1);           opacity:.12}
  28% {transform:translate3d(-22vw,-26vh,0) scale(1.16);opacity:.44}
  58% {transform:translate3d(-40vw,18vh,0) scale(.94);  opacity:.18}
  82% {transform:translate3d(-10vw,34vh,0) scale(1.12); opacity:.42}
  100%{transform:translate3d(0,0,0) scale(1);           opacity:.12}}
/* 系统开了「减少动态效果」就停掉 */
@media (prefers-reduced-motion: reduce){ .blob{animation:none} }
/* ==================== 动态背景 结束 ==================== */

.wrap{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;
      padding:var(--s3) var(--s5) var(--s4)}

/* 顶栏 */
.top{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.logo{font-size:22px;font-weight:700;letter-spacing:.5px;line-height:1.15}
.logo small{font-size:13px;font-weight:400;color:var(--muted);margin-left:var(--s2)}
/* 版本号：桌面上会留旧版，得能一眼看出正在跑的是哪个 */
.logo .ver{font-size:11px;font-style:normal;font-weight:600;color:var(--muted);
  margin-left:var(--s2);padding:2px 7px;border-radius:var(--r-xs);vertical-align:3px;
  background:rgba(var(--ink),.07);border:1px solid rgba(var(--ink),.10)}
.sub{color:var(--muted);font-size:12px;margin-top:3px;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.spacer{flex:1}
button,.btn{
  font:inherit;color:var(--text);cursor:pointer;
  padding:var(--s2) var(--s5);border-radius:var(--r-md);white-space:nowrap;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  transition:background .18s,transform .08s,border-color .18s,opacity .18s;
}
button:hover,.btn:hover{background:var(--glass-hi);border-color:rgba(var(--ink),.24)}
button:active,.btn:active{transform:translateY(1px) scale(.985)}
button.primary{background:linear-gradient(180deg,#68bcd9,#6891d9);border-color:transparent;
               color:#fff;box-shadow:0 6px 18px rgba(67,97,238,.35)}
button.primary:hover{background:linear-gradient(180deg,#7fd0e8,#7aa2e8)}
button[disabled]{opacity:.45;pointer-events:none}
button.mini{padding:var(--s1) var(--s3);border-radius:var(--r-sm);font-size:12px}

/* 搜索框 */
.search{position:relative;display:flex;align-items:center;width:270px;
        background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-md);
        padding:0 var(--s3);height:40px;transition:border-color .18s,background .18s}
.search:focus-within{border-color:rgba(91,156,255,.65);background:rgba(91,156,255,.10)}
.search svg{flex:none;opacity:.55}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);
              font:inherit;padding:0 8px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search .clr{flex:none;cursor:pointer;opacity:.5;padding:0 2px;font-size:16px;line-height:1}
.search .clr:hover{opacity:1}

/* ---------------- 标签栏（胶囊 + 小蓝条） ---------------- */
.tabs{position:relative;display:flex;gap:var(--s1);padding:0 var(--s1);margin-bottom:var(--s3)}
.tab{position:relative;padding:var(--s2) var(--s4);border-radius:var(--r-sm);color:var(--muted);
     cursor:pointer;font-size:14px;transition:background .22s,color .22s;user-select:none}
.tab:hover{background:rgba(var(--ink),.05)}
.tab.on{background:rgba(var(--ink),.10);color:var(--text);font-weight:700}
/* ★ 小蓝条：宽度跟着文字走，切换时平移 + 改宽（不是每页各画一条）*/
#tabBar{position:absolute;bottom:-6px;height:3px;border-radius:2px;
        background:linear-gradient(90deg,#6891d9,#68bcd9);
        box-shadow:0 0 10px rgba(91,156,255,.55);
        transition:left .32s cubic-bezier(.22,1,.36,1),width .32s cubic-bezier(.22,1,.36,1)}

/* ---------------- 主卡片 ---------------- */
.card{
  flex:1;min-height:0;border-radius:var(--r);padding:var(--s4) var(--s5);
  background:var(--card);
  border:1px solid var(--stroke);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  box-shadow:0 18px 50px var(--sh1), inset 0 1px 0 var(--hi);
  display:flex;flex-direction:column;
}
.cardhead{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);min-height:34px}
.cardhead h2{font-size:16px;white-space:nowrap}
.cardhead .hint{color:var(--muted);font-size:11px}
.back{flex:none;padding:var(--s2) var(--s4);border-radius:var(--r-sm);
  font-size:13.5px;font-weight:600;min-height:34px}
/* 软件表的表头（和下面的数据行共用同一套列宽，所以能对齐） */
/* 变化页顶部：一层大字（现在 ← 原来 + 净增），一层小灰字（时间跨度 + 榜单覆盖） */
.row.noclick{cursor:default}
.row.noclick:hover{transform:none}
.whyb{flex:none;height:26px;padding:0 10px;border-radius:var(--r-sm);
  font-size:11.5px;color:var(--muted);background:rgba(var(--ink),.06);
  border:1px solid var(--stroke);cursor:pointer;transition:color .16s,background .16s}
.whyb:hover{color:var(--accent);background:rgba(var(--ink),.10);
  border-color:rgba(76,201,240,.35)}
.whybox{margin:-4px 0 var(--s2) 44px;padding:var(--s3) var(--s4);
  border-radius:var(--r-md);background:rgba(var(--ink),.04);
  border:1px solid var(--stroke);font-size:12px}
.whybox .wsum{color:var(--muted);margin-bottom:6px}
.whybox .wsum b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.whybox .wfile{display:flex;gap:10px;padding:3px 4px;border-radius:6px;cursor:pointer}
.whybox .wfile:hover{background:rgba(var(--ink),.06)}
.whybox .wsz{flex:none;width:86px;text-align:right;font-weight:700;
  font-variant-numeric:tabular-nums}
.whybox .wsz.up{color:var(--warm)}
.whybox .wsz.down{color:var(--accent)}
.whybox .wnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--name)}
.whyempty{color:var(--muted);padding:2px 0;line-height:1.7}
.diffstat{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;
  padding:2px 0 var(--s2);width:100%}
.diffstat .now{font-size:20px;font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums;letter-spacing:.2px}
.diffstat .was{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.diffstat .dl{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.diffstat .dl.up{color:var(--warm)}
.diffstat .dl.down{color:var(--accent)}
.diffstat .when{font-size:12px;color:var(--muted)}
.diffstat .cov{margin-left:auto;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.listhead{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4) var(--s2);
          color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.3px;
          border-bottom:1px solid rgba(var(--ink),.07);margin-bottom:8px}
.listhead:empty{display:none}
.crumbs{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--muted);
        overflow:hidden;white-space:nowrap;flex-wrap:nowrap}
.crumbs b{color:var(--muted);font-weight:400;opacity:.5}
.crumbs span{cursor:pointer;padding:2px var(--r-xs);border-radius:var(--r-xs);transition:background .18s,color .18s}
.crumbs span:hover{background:rgba(var(--ink),.09);color:var(--text)}
.crumbs span:last-child{color:var(--text);font-weight:600;cursor:default}
.crumbs span:last-child:hover{background:none}
.acts{display:flex;gap:8px}

.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:13px;
      scroll-behavior:smooth}

/* ---------------- 动量滚动容器 ----------------
   原生 overflow 被关掉，内容包一层 .sc-in 用 translate3d 驱动（见 inertia()）。
   滚动条自己画，不然用户就完全看不出还能滚。 */
/* ---------------- 上下边缘渐隐（所有列表公用） ----------------
   列表超出可视区时，原来是滚动容器把内容硬切出一条直线。这里用 mask 渐变
   让上下两端**逐渐溶解**。
   两个变量就是"淡出高度"，滚到顶/底时由 JS 把对应那个设成 0，
   否则第一项/最后一项会莫名其妙变成半透明。 */
.fadebox{--ft:48px;--fb:48px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 var(--ft),
      #000 calc(100% - var(--fb)),transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 var(--ft),
      #000 calc(100% - var(--fb)),transparent 100%)}
.fadebox.at-top{--ft:0px}
.fadebox.at-bot{--fb:0px}

/* ---------------- 内存页：不滚、不渐隐 ----------------
   ★ 这页的内容应该正好铺满视口，没有任何"还能再滚"的余地，所以：
      1) 关掉上下渐隐（mask 直接去掉，不是把 --ft/--fb 设 0 —— 那还留着那条渐变）；
      2) 把内容层钉死在视口高度。
   原来的病：.sc-in 只有 min-height:100%，而 .memgrid 是 flex:1 + repeat(3,1fr)，
   行高在"高度不确定"时由内容决定 —— 实测进程数一变，整块网格 705 → 755px，
   于是每来一条数据整页就上下位移一次，看着像卡片自己跳。
   钉成 height:100% 之后行高恒定，卡片不再动。 */
.list.mem-mode{--ft:0px;--fb:0px;
  -webkit-mask-image:none;mask-image:none}
.list.mem-mode>.sc-in{height:100%;min-height:0;overflow:hidden}
.list.mem-mode>.sc-bar{display:none}
/* 卡里真放不下的（进程列表）自己滚，别把整页撑开 */
.list.mem-mode .memcard{overflow:hidden}

.sc{overflow:hidden!important;scroll-behavior:auto!important;position:relative}
/* ★ 纵向 flex + min-height:100%：
   内容层要撑满滚动容器，里面的 .typelay 才拿得到 flex:1 说的那份高度。
   原来是 flow-root（普通块），.typelay 的 flex:1 等于没写，
   高度全被图例行数决定 —— 类型少的时候环形图就被压扁了。 */
.sc>.sc-in{display:flex;flex-direction:column;min-height:100%;
  animation:scfade .3s ease-out}
@keyframes scfade{from{opacity:0}to{opacity:1}}
/* 注意：这里**不要**加 will-change:transform。列表内容能有 2000px 高，
   will-change 会让浏览器把整块当成一个常驻合成层，实测那层只栅格化了
   可见的前几行，下面的行整片不画（截图里只剩 5 行）。 */
/* right:3 + 宽 5 = 占右边 8px，容器 padding-right 13px，留 5px 空隙不压到行 */
.sc>.sc-bar{position:absolute;right:1px;width:8px;border-radius:4px;
  background:rgba(var(--ink),.20);opacity:0;
  transition:opacity .28s,background .18s;cursor:default;z-index:3}
.sc:hover>.sc-bar,.sc.sc-live>.sc-bar{opacity:1}
.sc>.sc-bar:hover,.sc.sc-drag>.sc-bar{background:rgba(var(--ink),.42)}
.sc.sc-none>.sc-bar{display:none}

/* ---------------- 方块平铺视图 ----------------
   和列表用同一套 token，所以浅色/深色自动都对；小蓝条和列表里的条形
   共用 barW() 的压缩刻度，两边的长度是一回事。 */
.grid{display:grid;gap:var(--s3);padding:var(--s1) 0 var(--s5);
  grid-template-columns:repeat(auto-fill,minmax(146px,1fr))}
.tile{position:relative;display:flex;flex-direction:column;min-width:0;
  /* 长列表的标准做法：看不见的格子跳过布局与绘制。
     contain-intrinsic-size 给个占位高度，否则滚动条会乱跳。 */
  content-visibility:auto;contain-intrinsic-size:auto var(--tile-h,178px);
  border-radius:var(--r-md);overflow:hidden;cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);
  /* ★ 入场用独立的 translate / scale 属性，不用 transform ——
     这样 :hover / :active 那些 transform 才能正常叠加，不会被动画的
     forwards 填充值压住（以前那套就是用 translate 才躲开的）。
     动画本身由 .in-anim 触发：每张卡的起始位移/延迟要按几何算，
     算好之前不能开跑（否则前几张已经从原位置开始了）。 */
  opacity:0;
  transition:background .2s,border-color .2s,transform .12s,box-shadow .2s}
.tile:hover{background:var(--glass-hi);border-color:rgba(var(--ink),.26);
  box-shadow:0 6px 22px var(--sh0);transform:translateY(-1px)}
.tile.sel{background:var(--glass-hi);border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent), 0 8px 26px var(--sh1)}
.tile.sel .tname{color:var(--accent);font-weight:700}
.tile .tcell{aspect-ratio:4 / 3;display:flex;align-items:center;
  justify-content:center;overflow:hidden;position:relative;
  background:rgba(var(--ink),.035)}
.tile .tcell img{width:100%;height:100%;object-fit:cover;display:block}
/* 先糊后清：小图当背景铺满并高斯模糊，真图加载完淡入盖上去 */
/* 先糊后清：小图铺满、糊得更重也更饱和（看得出"没对上焦"），
   清晰图过来时从略大收到原大小 —— 像镜头对焦，比单纯淡入明显得多 */
.tile .tcell::before{content:"";position:absolute;inset:0;opacity:0;
  background-image:var(--mini);background-size:cover;background-position:center;
  filter:blur(22px) saturate(1.35) brightness(1.06);
  transform:scale(1.32);
  transition:opacity .34s ease}
.tile .tcell.blurup::before{opacity:1}
.tile .tcell.blurup .tph{display:none}
.tile .tcell img.tfull{position:relative;z-index:1;opacity:0;
  width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.08);transform-origin:center;
  transition:opacity .5s ease,
             transform .62s cubic-bezier(.34,1.56,.64,1)}
.tile .tcell img.tfull.in{opacity:1;transform:scale(1)}
/* 图标在方块里放大一点，不然 146px 的格子里一个小图标太空 */
.tile .tcell .fico-i{width:40px;height:48px;opacity:.92}
/* 缩略图还没出来时的占位：**呼吸脉冲**（苹果原生那种）——
   整块占位缓慢明暗起伏，柔和、不刺眼，是"呼吸"不是"一闪一闪"，
   也没有扫光那种一道亮条横着掠过。颜色全走 --ink，深浅色都不抢背景。 */
.tile .tph{position:absolute;inset:0;border-radius:0;
  background:rgba(var(--ink),.14);overflow:hidden;
  animation:tph-breathe 2.4s ease-in-out infinite}
/* 只动 opacity：合成器一层就能做，不触发重排重绘，上千个格子也不掉帧。
   0.42 → 1 → 0.42，一个来回 2.4 秒 —— 慢到"察觉不到在动"，只感觉到在呼吸。 */
@keyframes tph-breathe{
  0%,100%{opacity:.55}
  50%    {opacity:1}}
/* 系统里关掉动效的人就别呼吸了 */
@media (prefers-reduced-motion: reduce){
  .tile .tph{animation:none}
}
.tile .tname{font-size:13.5px;padding:var(--s2) var(--s2) 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--name)}
/* 文件夹和图片要一眼分得开：文件夹用偏主色的底 + 左上角一个文件夹角标 */
.tile.dir .tcell{background:rgba(90,140,200,.10)}
.tile.dir .tname{font-weight:700;color:var(--text)}
.tile.dir .tcell::after{content:"";z-index:3;position:absolute;left:7px;top:7px;
  width:16px;height:13px;border-radius:2.5px;
  background:var(--accent);opacity:.92;
  /* 用一个小三角把"文件夹"那个形状做出来 */
  clip-path:polygon(0 22%,38% 22%,48% 0,100% 0,100% 100%,0 100%)}
.tile .tmeta{font-size:11px;color:var(--muted);padding:1px var(--s2) 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tsize{font-size:15px;font-weight:700;padding:3px var(--s2) var(--s2);
  color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.tile .tbar{height:3px;margin:0 var(--s2) var(--s3);border-radius:2px;
  background:rgba(var(--ink),.08);overflow:hidden}
.tile .tbar i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--bar1),var(--bar2));
  transition:width .5s cubic-bezier(.2,.9,.3,1)}
.tile .tag{position:absolute;left:var(--s2);top:var(--s2);font-size:10px;
  padding:1px 5px;border-radius:var(--r-xs);color:#fff;
  background:rgba(20,26,40,.55);backdrop-filter:blur(6px)}

/* ---------------- 列表行 ---------------- */
/* 鼠标跟随聚光灯：只有鼠标所在的那一行会亮。
   径向渐变跟着 --mx/--my 跑，中心提亮、两端略暗，形成一行之内的局部光影。
   想调效果只改这里：
     半径   220px
     提亮   rgba(var(--ink),.11)
     压暗   rgba(0,0,0,.05)
   想整个关掉：把下面 :hover 那条 opacity:1 删掉即可。 */
.row::after,.lg::after,.clog::after{content:"";position:absolute;inset:0;
  border-radius:inherit;
  pointer-events:none;opacity:0;transition:opacity .3s ease;
  background:radial-gradient(circle 220px at var(--mx,50%) var(--my,50%),
      rgba(255,255,255,.11) 0%,
      rgba(255,255,255,.045) 42%,
      rgba(0,0,0,.05) 100%)}
.row:hover::after,.lg:hover::after,.clog:hover::after{opacity:1}

.row{
  content-visibility:auto;contain-intrinsic-size:auto 62px;
  position:relative;display:flex;align-items:center;gap:12px;flex:none;
  padding:var(--s3) var(--s4);margin-bottom:var(--s2);border-radius:var(--r-md);
  background:var(--glass);border:1px solid var(--stroke);cursor:pointer;
  opacity:0;translate:0 -70px;
  animation:drop .5s cubic-bezier(.18,1.25,.4,1) forwards;
  transition:background .22s,border-color .22s,transform .12s;
}
/* ★ 这里必须用 translate 而不是 transform：
   入场动画带 forwards，会永久占住 transform，导致 :hover / .sel 的
   translateX 全部失效（悬停只有背景变色、没有位移，看着很淡）。
   translate 是独立属性，正好把 transform 让出来。 */
/* 卡片入场：从观者这一侧飞向屏幕 —— 起始位置朝**屏幕中心**收（--fx/--fy 是
   每张卡相对网格中心的位移方向，由 JS 按几何算），同时大一圈（更靠近观者），
   落到自己的位置时轻微收过头再弹回。延迟按"离中心的距离"排：中心先到，
   一圈一圈往外扩散，就是 iOS 解锁那种逐层飞入。 */
@keyframes tile-in{
  0%  {opacity:0;translate:var(--fx,0) var(--fy,0);scale:1.10}
  58% {opacity:1;translate:0 0;scale:.994}
  100%{opacity:1;translate:0 0;scale:1}}
.tile.in-anim{animation:tile-in .62s cubic-bezier(.2,1.05,.3,1) forwards}
/* 第 64 个之后不再入场动画：两千个格子同时做动画纯属浪费（而且看不到） */
.tile.noin{animation:none;opacity:1;translate:0 0;scale:1}
/* 设置里关掉「卡片飞入」= 回到最初那种：所有卡片从上方 40px 处一起滑进来，
   不按顺序错开、也没有落地过冲。 */
:root.no-stagger .tile.in-anim{animation:drop .45s cubic-bezier(.18,1.25,.4,1) forwards;
  translate:0 -40px;scale:1}
:root.no-stagger .tile.noin{animation:drop .45s cubic-bezier(.18,1.25,.4,1) forwards;
  translate:0 -40px;scale:1}
@keyframes drop{to{opacity:1;translate:0 0}}
/* 下钻的方向感：进下一层从右滑入、返回上层从左滑入。
   原来是两个方向共用 drop（都从上方落下），连点几层会分不清自己在往上还是往下。
   这里只覆盖 animation-name，时长/缓动/forwards 沿用 .row 的。 */
@keyframes dropR{from{opacity:0;translate:70px 0}to{opacity:1;translate:0 0}}
@keyframes dropL{from{opacity:0;translate:-70px 0}to{opacity:1;translate:0 0}}
.row.noanim{animation:none;opacity:1;translate:0 0}
.row.in-r{animation-name:dropR}
.row.in-l{animation-name:dropL}
/* 键盘选中的那一行（鼠标 hover 之外的另一套状态） */
.row.sel{background:var(--glass-hi);border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent),
  box-shadow:0 6px 22px var(--sh0)}
.row.sel::before{content:"";position:absolute;left:0;top:16%;bottom:16%;width:3px;
  border-radius:0 3px 3px 0;background:var(--accent)}
.row:hover{background:var(--glass-hi);border-color:rgba(var(--ink),.28);
           transform:translateX(3px)}
.row:hover .rk{color:var(--accent)}
.rk{width:24px;text-align:right;color:var(--muted);font-weight:700;font-size:13px;
    flex:none;transition:color .2s}
/* 文件夹行：左边是排名数字，紧跟一个文件夹图标。
   宽度写死 40px，文件行用同样宽度的空数字位占着，这样两种行的名字仍然对齐。 */
.rk2{flex:none;display:flex;align-items:center;gap:var(--s2);width:40px}
.rk2 .rno{width:15px;flex:none;text-align:right;color:var(--muted);font-weight:700;
          font-size:12.5px;font-style:normal;transition:color .2s}
.row:hover .rk2 .rno{color:var(--accent)}
/* 文件行：用类型图标代替序号，和文件夹一眼分开 */
.rk.fico{width:26px;display:flex;align-items:center;justify-content:center;
         text-align:center}
.fico-i{display:block;fill:none;stroke:currentColor;stroke-width:1.6;
        stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.row.file{background:rgba(var(--ink),.035)}
.row.file:hover{background:var(--glass-hi)}
.row.file .rname{font-size:13.5px;color:var(--name)}
.rmain{min-width:0;flex:0 0 auto;width:34%}
.rname{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
.rbar{flex:1;height:8px;border-radius:var(--s1);background:rgba(var(--ink),.07);
      overflow:hidden;min-width:60px}
.rbar i{display:block;height:100%;width:0;border-radius:var(--s1);
        background:linear-gradient(90deg,var(--bar1),var(--bar2));
        transition:width .65s cubic-bezier(.2,.9,.3,1)}
.rsize{font-weight:700;font-size:14px;min-width:78px;text-align:right;flex:none}
/* 修改时间：放在占用条和大小之间，右对齐 + 等宽数字（跟大小列同一套排版） */
.rtime{flex:none;width:118px;text-align:right;font-size:12.5px;color:var(--muted);
       font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{width:20px;height:20px;flex:none;object-fit:contain;
     filter:drop-shadow(0 2px 4px var(--sh2))}
/* 首字母色块：图标取不到时的兜底，不能留空白 */
.ico.av{display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-style:normal;font-weight:700;font-size:11px;line-height:1;
  border-radius:var(--r-xs)}
.ico-ph{width:20px;height:20px;flex:none;border-radius:var(--r-xs);
        background:rgba(var(--ink),.10)}
.tag{font-size:11px;padding:2px var(--s2);border-radius:var(--r-sm);flex:none;
     background:rgba(var(--ink),.07);border:1px solid var(--stroke);color:var(--muted)}
.tag.safe{color:var(--safe);border-color:rgba(63,191,116,.35);background:rgba(63,191,116,.10)}
.tag.caution{color:var(--caut);border-color:rgba(224,176,74,.35);background:rgba(224,176,74,.10)}
.tag.danger{color:var(--danger);border-color:rgba(224,108,100,.35);background:rgba(224,108,100,.10)}
.rpath{font-size:12.5px;color:var(--muted);opacity:.85;margin-top:3px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{flex:none;padding:var(--s1) var(--s3);border-radius:var(--r-sm);font-size:12px;color:var(--danger-t);
     background:rgba(224,108,100,.14);border:1px solid rgba(224,108,100,.35);
     transition:background .18s,transform .1s}
.del:hover{background:rgba(224,108,100,.28)}
.del:active{transform:scale(.94)}

/* 软件表的列（表头和数据行共用，保证严格对齐） */
.ico, .ico-ph{flex:none}
.c-app{flex:1;min-width:0}
.c-kind{flex:none;width:54px;font-size:12px;color:var(--muted)}
.c-size{flex:none;width:86px;text-align:right;font-weight:700;font-size:13px}
.c-disks{flex:none;width:22%;min-width:0;font-size:12px;color:var(--muted);
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-dirs{flex:none;width:54px;text-align:right;font-size:12px;color:var(--muted)}
.c-pub{flex:none;width:20%;min-width:0;font-size:12px;color:var(--muted);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp26{flex:none;width:26px}
/* 每行的删除按钮：平时完全看不见，悬停这一行才淡淡浮出来，
   再悬停按钮本身才变红 —— 这样不突兀 */
/* 软件页的清理按钮：图标 + 文字。原来 26px 光一个图标、默认还只有 50% 不透明度，
   在右边一整列里基本看不见。 */
.rowdel.wide{width:auto;min-width:62px;padding:0 var(--s3);gap:6px;height:28px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;opacity:.85;border:1px solid var(--stroke)}
.row:hover .rowdel.wide,.rowdel.wide:hover{opacity:1}
.sp62{flex:none;width:62px}

/* 页签上的小块筛选框（软件页用） */
.sinput{width:132px;height:28px;padding:0 var(--s3);border-radius:var(--r-sm);
  background:rgba(var(--ink),.07);border:1px solid var(--stroke);
  color:var(--text);font:inherit;font-size:12px;outline:0;flex:none}
.sinput::placeholder{color:var(--muted)}
.sinput:focus{border-color:var(--accent);background:rgba(var(--ink),.10)}

/* 卡头右上角的分段切换（列表 / 平铺） */
.viewseg{float:right;display:inline-flex;gap:3px;padding:3px;
  border-radius:var(--r-sm);background:rgba(var(--ink),.06);
  border:1px solid var(--stroke);margin-left:var(--s3)}
.viewseg b{display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:28px;border-radius:var(--r-xs);cursor:pointer;
  color:var(--muted);transition:background .18s,color .18s}
.viewseg b:hover{color:var(--text)}
/* 小控件也要有按压手感：和卡片同一套弹簧曲线 */
.viewseg b,.mini,.seg button{
  transition:background .18s,color .18s,border-color .18s,
             transform .34s cubic-bezier(.2,1.55,.4,1)}
.viewseg b:active,.mini:active,.seg button:active{
  transform:scale(.9);transition-duration:.07s;transition-timing-function:ease-out}
.viewseg b.pop{animation:btnPop .36s cubic-bezier(.2,1.6,.4,1)}
@keyframes btnPop{0%{transform:scale(1)}38%{transform:scale(1.2)}100%{transform:scale(1)}}
.viewseg b.on{background:rgba(var(--ink),.14);color:var(--text);
  box-shadow:0 1px 4px var(--sh0)}
.viewseg svg{display:block;width:16px;height:16px}

.rowdel{flex:none;width:26px;height:26px;padding:0;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;background:none;
  border:1px solid transparent;color:var(--muted);opacity:0;cursor:pointer;
  transition:opacity .18s,background .18s,color .18s,border-color .18s}
.row:hover .rowdel{opacity:.5}
.rowdel:hover{opacity:1!important;color:var(--danger-t);background:rgba(224,108,100,.14);
  border-color:rgba(224,108,100,.30)}
/* 第二下才是真删：先上膛，红底 + 勾，鼠标移开或 3 秒后自动撤销 */
.rowdel.arm{opacity:1!important;color:#fff;background:#e06c64;border-color:#e06c64;
  box-shadow:0 0 0 3px rgba(224,108,100,.18)}
.sp20{flex:none;width:20px}

.empty{color:var(--muted);text-align:center;padding:54px 0;font-size:13px}
.empty .sub2{font-size:11px;opacity:.7;margin-top:8px}
/* 加载/空状态整块居中：以前贴着列表顶端，看起来"偏上" */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62vh}
.spin{width:44px;height:44px;margin:0 auto 16px;border-radius:50%;
  border:4px solid rgba(var(--ink),.10);border-top-color:var(--accent);
  animation:sp .8s linear infinite;will-change:transform}
@keyframes sp{to{transform:rotate(360deg)}}
/* 点「删除」时整行不要做按压：那个动画看着像"整行被点了" */
.row:has(.del:active){transform:none}
/* 查重：展开的副本列表 */
.dupfiles{margin:-2px 0 8px 40px;padding:6px 16px 8px 14px;border-radius:10px;
  background:rgba(var(--ink),.10);border:1px solid var(--stroke);
  border-left:3px solid var(--accent);
  /* 收窄但不至于把内容挤出去；行内允许换行，右边就不会被裁 */
  width:calc(100% - 40px);max-width:calc(100% - 40px);contain:layout paint}
/* 删除按钮已经放到每份副本上了，底部那条批量栏不需要了 */
.dupbar{display:none !important}
@keyframes dupin{
  from{opacity:0;transform:translateY(-10px)}
  to  {opacity:1;transform:none}}
.dupitem{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;
  cursor:pointer;border-bottom:1px solid rgba(var(--ink),.06);flex-wrap:wrap;row-gap:4px}
.dupitem:last-of-type{border-bottom:none}
.dupitem input{flex:none;margin:0}
.dupname{flex:0 1 auto;max-width:230px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--text);font-weight:600}
/* 路径：放不下就换行，最多两行（原来压成一截看不出是哪个文件） */
.duppath{flex:1 1 260px;min-width:180px;color:var(--muted);font-size:11.5px;
  line-height:1.4;white-space:normal;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
/* 查重卡片：缩略图 + 角标 + 对比面板 */
/* 自绘下拉：原生 select 的弹层永远是系统灰白方块，改不了，所以自己画 */
.dd{position:relative;display:inline-block}
.ddbtn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;
  border-radius:8px;cursor:pointer;font-size:12px}
.ddbtn:active{transform:scale(.96)}
.ddbtn .caret{width:0;height:0;border-left:4px solid transparent;
  border-right:4px solid transparent;border-top:4px solid currentColor;opacity:.7;
  transition:transform .18s ease}
.dd.on .ddbtn .caret{transform:rotate(180deg)}
.ddmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:132px;
  padding:5px;border-radius:10px;border:1px solid var(--stroke);
  background:var(--card, #1b1e26);box-shadow:0 14px 34px var(--sh0, rgba(0,0,0,.45));
  opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;
  pointer-events:none;transition:opacity .18s ease,
    transform .26s cubic-bezier(.22,1.2,.36,1)}
.dd.on .ddmenu{opacity:1;transform:none;pointer-events:auto}
.ddmenu b{display:block;padding:6px 9px;border-radius:7px;font-size:12px;
  font-weight:500;color:var(--text);cursor:pointer;white-space:nowrap;
  transition:background .12s ease,transform .12s ease}
.ddmenu b:hover{background:rgba(var(--ink),.10)}
.ddmenu b:active{transform:scale(.98)}
.ddmenu b.on{color:var(--accent);font-weight:700}
/* 图表容器必须有个兜底高度：一旦算成 0，ECharts 会静默什么都不画 */
.typelay .chart{min-height:340px}
.donutwrap{min-height:340px}
.row.open .dupcover{display:none}
.morebox{grid-column:1 / -1;display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:18px 0 26px}
.morebox .moresub{font-size:11.5px;color:var(--muted)}
/* 关掉动态背景：8 团光斑各自 84px 高斯模糊 + 无限滚动，是页面掉帧的大头 */
:root.no-bg .blob{display:none !important}
.dupcover{flex:none;width:84px;height:47px;border-radius:6px;object-fit:cover;
  margin-right:10px;background:rgba(var(--ink),.08)}
.dupsel{height:26px;padding:0 22px 0 8px;border-radius:8px;cursor:pointer;
  background:rgba(var(--ink),.08);color:var(--text);border:1px solid var(--stroke);
  font-size:12px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 13px) 11px, calc(100% - 9px) 11px;
  background-size:4px 4px, 4px 4px;background-repeat:no-repeat}
.dupsel:hover{background-color:rgba(var(--ink),.14)}
.dupgpick{flex:none;margin:0 8px 0 2px}
.dupthumb{flex:none;width:128px;height:72px;object-fit:cover;border-radius:6px;
  background:rgba(var(--ink),.08);display:block}
.dupitem.keepme{background:rgba(120,200,140,.10);border-radius:6px}
.dupbadge{flex:none;font-size:10.5px;padding:1px 6px;border-radius:999px;
  background:rgba(120,200,140,.18);color:#8fd9a6}
.cmpmask{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.62);
  display:flex;align-items:center;justify-content:center}
.cmpbox{display:flex;gap:14px;max-width:92vw;max-height:88vh;padding:18px;
  border-radius:14px;background:var(--card, #171a21);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cmpcol{width:min(42vw,520px);min-width:0}
.cmpimg{height:min(46vh,420px);border-radius:10px;overflow:hidden;
  background:rgba(var(--ink),.08);display:flex;align-items:center;justify-content:center}
.cmpimg img{max-width:100%;max-height:100%;object-fit:contain}
.cmpname{font-size:13px;font-weight:700;margin-top:8px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cmpmeta{font-size:12px;color:var(--muted);margin-top:2px}
.cmppath{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-all}
.cmpclose{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);
  font-size:12px;color:#bbb}
.dupsize{flex:none;min-width:0;margin-left:auto;text-align:right;font-size:12px;
  color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dupbar{display:flex;align-items:center;gap:10px;margin-top:6px}
.duphint{flex:1;min-width:0;font-size:11.5px;color:var(--muted)}
.spin-t{font-size:13px}
/* 「变化」页那行汇总：信息密度高，单独放大。
   用 !important 是因为副标题原有的字号是 ID 选择器给的，类选择器压不住。 */
.hint-big{font-size:13px !important;font-weight:600 !important;
  line-height:1.55 !important;color:var(--text) !important;opacity:.92}
/* 扫描进度条：很细一条，只在进度文字里带百分比时才出现 */
.pbar{display:none;width:220px;height:3px;margin:12px auto 0;border-radius:2px;
  background:rgba(var(--ink),.10);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:2px;
  background:var(--accent);transition:width .4s ease}

/* ---------------- 关于 / 更新日志 ----------------
   跟二次确认弹窗同一套毛玻璃，只是盒子更大、里面可以滚。 */
.setwrap{position:fixed;inset:0;z-index:110;display:flex;align-items:center;
  justify-content:center;background:var(--scrim);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.setwrap.on{opacity:1;visibility:visible}
/* 设置面板：加宽 + 内容区自己滚，标题/页脚固定 */
.setbox .setbody{flex:1;min-height:0;overflow-y:auto;padding-right:var(--s3);
  margin-right:calc(-1 * var(--s3))}
.sect{display:flex;align-items:baseline;gap:var(--s2);
  margin:var(--s5) 0 var(--s3);padding-top:var(--s4);
  border-top:1px solid var(--stroke);
  font-size:13px;font-weight:700;color:var(--text)}
.sect span{font-weight:400;font-size:11px;color:var(--muted)}
.sect:first-child{border-top:0;padding-top:0;margin-top:var(--s1)}
.setbox{width:min(680px,92vw);max-height:min(80vh,780px);display:flex;flex-direction:column;
  padding:var(--s5) var(--s5) var(--s4);border-radius:var(--r);
  /* 半透明玻璃卡片：跟主卡片一样 blur + saturate，背景的渐变能透上来 */
  background:var(--box);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  border:1px solid rgba(var(--ink),.16);
  box-shadow:0 24px 70px var(--sh3), inset 0 1px 0 var(--hi);
  scale:.92;translate:0 16px;
  transition:scale .3s cubic-bezier(.34,1.56,.64,1),
             translate .32s cubic-bezier(.34,1.56,.64,1)}
.setwrap.on .setbox{scale:1;translate:0 0}
.sethead{position:relative;z-index:4;display:flex;align-items:center;
  gap:var(--s2);margin-bottom:var(--s1)}
.sethead h3{font-size:16px}
.sethead .spacer{flex:1}
.setmeta{position:relative;z-index:4;font-size:12px;color:var(--muted);
  margin-bottom:14px}
.setmeta b{color:var(--text);font-size:13px}
/* 关于面板的滚动区也用同一套渐隐（.fadebox 见上面） */
.clist{position:relative;z-index:4;flex:1;min-height:0;overflow-y:auto;
  padding-right:8px;margin-right:-6px;
  --ft:30px;--fb:30px}   /* 关于面板是小字密排，淡出区不用那么高 */
/* 每条错峰滑入（animation-delay 在 openSettings 里按序号给），
   跟列表行用的是同一套 drop 动画，手感一致。
   position:relative 是为了让聚光灯的 ::after 以这一条为基准
   （见上面 .row::after,.lg::after,.clog::after）。 */
.aboutintro{margin:2px 0 10px;font-size:12px;line-height:1.75;
  color:var(--muted);max-width:640px}
.aboutintro b{color:var(--note);font-weight:600}
/* 搜索结果里"这个文件夹内含多少个匹配项"的小标 */
.innerb{display:inline-block;margin-left:6px;padding:0 5px;border-radius:var(--r-xs);
  font-size:11px;font-weight:600;vertical-align:1px;
  color:var(--accent);background:rgba(76,201,240,.14);
  border:1px solid rgba(76,201,240,.28)}
:root[data-theme="light"] .innerb{background:rgba(14,134,174,.10);
  border-color:rgba(14,134,174,.28)}
mark.hl{background:rgba(76,201,240,.26);color:inherit;border-radius:3px;
  padding:0 1px;box-shadow:0 0 0 1px rgba(76,201,240,.18) inset}
:root[data-theme="light"] mark.hl{background:rgba(14,134,174,.16);
  box-shadow:0 0 0 1px rgba(14,134,174,.12) inset}
.clog{position:relative;padding:var(--s3) var(--s4);margin-bottom:var(--s2);border-radius:var(--r-md);
  background:var(--glass);border:1px solid var(--stroke);
  opacity:0;translate:0 -16px;
  animation:drop .42s cubic-bezier(.18,1.25,.4,1) forwards}
/* 注意：这里**不要**加悬停高亮。更新日志是纯展示的，点不了；
   亮起来会让人以为可以选中/点击。 */
.clogtop b{transition:color .2s}
.clogtop{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.clogtop b{font-size:13.5px;color:var(--accent)}
.clogtop span{font-size:11.5px;color:var(--muted)}
.clogtop i{font-size:10.5px;font-style:normal;color:var(--muted);
  padding:1px 7px;border-radius:var(--r-xs);background:rgba(var(--ink),.07);
  border:1px solid rgba(var(--ink),.10)}
.clog ul{list-style:none;margin:0;padding:0}
.clog li{font-size:12.5px;color:var(--note);line-height:1.75;padding-left:13px;position:relative}
.clog li::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;
  border-radius:50%;background:var(--muted);opacity:.65}
/* 分段控件：二选一 */
.seg{display:flex;gap:var(--r-xs);padding:var(--r-xs);border-radius:var(--r-md);
  background:rgba(var(--ink),.05);border:1px solid var(--stroke)}
/* 内层圆角 = 外层 − 内边距（嵌套圆角规则）*/
.seg button{flex:1;padding:var(--s3);border-radius:calc(var(--r-md) - var(--r-xs));border:none;background:none;
  color:var(--muted);font-size:13px;cursor:pointer;
  transition:background .18s,color .18s}
.seg button:hover{color:var(--text)}
.seg button.on{background:rgba(var(--ink),.11);color:var(--text);font-weight:600;
  box-shadow:0 2px 10px var(--sh0)}
.setnote{margin-top:13px;font-size:12.5px;color:var(--muted);line-height:1.85}
.setnote b{color:var(--text);font-weight:700}
/* 设置里第二组开始的间距（第一组紧跟着标题，不加） */
.setmeta.setgap{margin-top:var(--s5)}

.setfoot{position:relative;z-index:4;display:flex;align-items:center;
  justify-content:space-between;
  gap:var(--s2);margin-top:var(--s4);padding-top:var(--s3);
  border-top:1px solid rgba(var(--ink),.07)}
.setfoot .credit{font-size:11.5px;color:var(--muted);letter-spacing:.3px}

/* ---------------- 类型分布 ---------------- */
.typelay{flex:1;min-height:0;display:flex;gap:var(--s6)}
/* 宽度给到 50%：环形图外侧还要放百分比标注，太窄环就顶满宽度、
   标注被截掉（窗口越小越明显） */
.donutwrap{flex:none;width:50%;display:flex;align-items:center;justify-content:center;
           position:relative;min-height:0}
.donutwrap svg{max-width:100%;max-height:100%}
/* ECharts 的 canvas：绝对定位铺满整个 .donutwrap，中心那行字压在它上面 */
.donutwrap .chart{position:absolute;inset:0}
.donutwrap .ctr{position:absolute;text-align:center;pointer-events:none}
.donutwrap .ctr b{display:block;font-size:24px;font-weight:700;line-height:1.25}
.donutwrap .ctr span{font-size:11px;color:var(--muted)}
/* 选中的扇形「弹出来」：外沿 +10、内沿不动（r +5、stroke-width +10），
   这是 Tk 版的手感 —— 之前 Web 版只把别的调暗，所以显得很淡。 */
.slice{transition:opacity .2s;cursor:pointer}
.slice:hover{opacity:1!important}
.slice.dim{opacity:.25}
/* 圆环外侧的百分比标注（直接贴着扇形，不画折线） */
.slice-lb{font-size:9.5px;font-weight:700;dominant-baseline:middle;
          pointer-events:none;
          paint-order:stroke;stroke:var(--halo);stroke-width:2.4px}
.legend{flex:1;min-width:0;overflow-y:auto;padding-right:13px;
  /* 图例整体垂直居中：上下留白相等，和左边的环形图视觉上齐平 */
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  /* 稍微往左下挪一点，视觉重心更靠中间（纯视觉偏移，不影响点击和滚动） */
  transform:translate(8px, 12px)}
.legend>*{flex:none}
# 图例行只占自己的宽度：点击只在卡片范围内生效，
# 不再一点空白处就真接钻进去
.legend .lg{width:max-content !important;max-width:100% !important;
  margin-right:auto}
/* ★ 名字标签原来是 flex:1，会把卡片撑满整卷（实测 596px）——
   改成不拉伸，卡片就收缩到内容宽度，点击区域正好等于卡片本身 */
.legend .lg .nm{flex:0 0 auto;max-width:300px}
.legend .lg:active{transform:scale(.985)}
.lg{position:relative;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);margin-bottom:var(--s2);
    border-radius:var(--r-md);background:var(--glass);border:1px solid var(--stroke);
    cursor:pointer;opacity:0;translate:0 -40px;
    animation:drop .45s cubic-bezier(.18,1.25,.4,1) forwards;
    transition:background .2s,border-color .2s,transform .14s,box-shadow .2s}
.lg:hover{background:var(--glass-hi);border-color:rgba(var(--ink),.28);
          transform:translateX(3px)}
.lg.dim{opacity:.45}
.sw{width:13px;height:13px;border-radius:var(--s1);flex:none;
    box-shadow:0 0 10px var(--sh0)}
.lg .nm{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .ct{font-size:12px;color:var(--muted);width:74px;text-align:right;flex:none}
.lg .pc{font-size:13px;color:var(--muted);width:58px;text-align:right;flex:none;
        font-variant-numeric:tabular-nums}
.lg .sz{font-size:15px;font-weight:700;width:92px;text-align:right;flex:none}
.filecard{margin-top:8px}
.frow{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);margin-bottom:6px;
      border-radius:var(--r-md);background:var(--glass);border:1px solid var(--stroke);
      cursor:pointer;transition:background .18s,transform .12s}
.frow:hover{background:var(--glass-hi);transform:translateX(3px)}
.frow .fn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fd{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis;margin-top:2px}
.frow .fs{font-size:13px;font-weight:700;flex:none;width:80px;text-align:right}

/* ---------------- 内存页（卡片分格） ----------------
   四张卡用 grid-area 定死分区，右边"进程占用"纵向占满三行。 */
.memgrid{flex:1;min-height:0;display:grid;gap:var(--s3);
  grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);
  grid-template-areas:
    "over over proc proc"
    "cat  io   proc proc"
    "tre  tre  proc proc"}
.a-over{grid-area:over} .a-cat{grid-area:cat}
.a-tre{grid-area:tre}   .a-proc{grid-area:proc} .a-io{grid-area:io}
.memcard{display:flex;flex-direction:column;min-height:0;min-width:0;
  padding:var(--s3) var(--s4);border-radius:var(--r-md);
  background:var(--glass);border:1px solid var(--stroke)}
.memcard>h4{flex:none;font-size:12px;font-weight:700;color:var(--muted);
  letter-spacing:.4px;margin-bottom:var(--s2)}
.memchart{flex:1;min-height:0;min-width:0}

/* 总览：左边环形 + 右边几行数字 */
.memover{flex:1;min-height:0;display:flex;align-items:center;gap:var(--s3)}
.memover .ring{flex:none;width:46%;height:100%;min-width:0}
.memfacts{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;
  gap:var(--s2)}
.memfacts div{display:flex;align-items:baseline;gap:var(--s2);font-size:12px}
.memfacts span{color:var(--muted);flex:none;width:56px}
.memfacts b{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.memfacts i{font-style:normal;color:var(--muted);font-size:11px;
  font-variant-numeric:tabular-nums}

/* 进程行：就地更新，不做入场动画（每秒重建会闪） */
.memprocs{flex:1;min-height:0;overflow-y:auto;padding-right:var(--s2)}
.memproc{display:flex;align-items:center;gap:var(--s2);padding:4px 0;font-size:12.5px}
.memproc .nm{flex:none;width:23%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--name)}
.memproc .cnt{flex:none;width:26px;font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.memproc .bar{flex:1;height:6px;border-radius:var(--s1);
  background:rgba(var(--ink),.07);overflow:hidden;min-width:24px}
.memproc .bar i{display:block;height:100%;width:0;border-radius:var(--s1);
  background:linear-gradient(90deg,var(--bar1),var(--bar2));
  transition:width .5s cubic-bezier(.2,.9,.3,1)}
/* 迷你走势线：内联 SVG，比每行一个 ECharts 实例轻太多 */
.memproc .spk{flex:none;width:64px;height:18px}
.memproc .spk svg{display:block;width:100%;height:100%;overflow:visible}
.memproc .val{flex:none;width:54px;text-align:right;font-weight:700;
  font-variant-numeric:tabular-nums}
/* 写盘速率：这正是任务管理器给不了的信息 —— 到底是谁在写盘 */
.memproc .wio{flex:none;width:64px;text-align:right;font-size:11.5px;
  font-variant-numeric:tabular-nums;color:rgba(127,143,163,.45)}
.memproc .wio.act{color:var(--warm)}
.memproc .gro{flex:none;width:48px;text-align:right;font-size:11.5px;
  font-variant-numeric:tabular-nums;color:var(--muted)}
.memproc .gro.up{color:var(--warm)}
/* 变化页：变大用暖色、变小用冷色，一眼分得清方向 */
.rrow-size{}
.rsize.up{color:var(--warm)} .rsize.down{color:var(--accent)}
.memproc .gro.hot{color:#e0796f}
/* 卡头右边的排序切换 */
.memsort{float:right;font-weight:400}
.memsort b{font-weight:600;font-size:11px;color:var(--muted);cursor:pointer;
  padding:1px var(--r-xs);border-radius:var(--r-xs);transition:background .18s,color .18s}

/* ================= 内存页 · 科幻 HUD 主题 ================= */
.memgrid{position:relative;flex:1;min-height:0;display:grid;gap:var(--s3);
  grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);
  grid-template-areas:
    "over over proc proc"
    "cat  io   proc proc"
    "tre  tre  proc proc";
  background:
    linear-gradient(rgba(0,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,.025) 1px, transparent 1px),
    radial-gradient(ellipse at 30% 20%, rgba(0,180,255,.06), transparent 60%);
  background-size: 28px 28px, 28px 28px, 100% 100%;
  border:1px solid rgba(0,200,255,.12);border-radius:10px;overflow:hidden}
/* 扫描线：一条细光带从上往下缓慢扫过 */
.memgrid::before{content:"";position:absolute;left:0;right:0;top:-40%;height:40%;
  background:linear-gradient(180deg, transparent, rgba(0,220,255,.05), transparent);
  animation:hud-scan 6s linear infinite;pointer-events:none;z-index:1}
@keyframes hud-scan{0%{top:-40%}100%{top:110%}}
.memcard{position:relative;background:rgba(8,16,28,.55);
  border:1px solid rgba(0,200,255,.18);border-radius:8px;backdrop-filter:blur(2px)}

/* ---------------- 入场：所有卡片和卡里的内容同时到位 ----------------
   以前五张卡各延 50ms（.a-over 0.05s … .a-proc 0.25s），像排队落下来；
   而卡里的标题/数字/图表根本没有动画。现在统一成一条时间线：
     起点 0ms，时长 --mem-in（0.46s），缓动同一条 —— 卡和内容一起出现、一起停。
   卡片只做「淡入 + 极轻微放大回正」，位移交给内容块做（避免两层位移叠加，
   看起来像内容在卡片里二次抖动）。 */
.memgrid{--mem-in:.46s;--mem-ease:cubic-bezier(.22,.9,.24,1)}
@keyframes mem-card-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes mem-row-in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
/* 进程行：只在入场那一刻放一次（.anim 只在 memEnter 里挂 0.8 秒就摘掉），
   之后每秒的刷新不会重放，否则每次采样整列都会闪一下。 */
.memprocs.anim .memproc{animation:mem-row-in var(--mem-in) var(--mem-ease) both}
@media (prefers-reduced-motion: reduce){ .memprocs.anim .memproc{animation:none} }
@keyframes mem-body-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.memgrid.mem-in>.memcard{animation:mem-card-in var(--mem-in) var(--mem-ease) both}
.memgrid.mem-in .memcard>h4,
.memgrid.mem-in .memover,
.memgrid.mem-in .memchart,
.memgrid.mem-in .iochart,
.memgrid.mem-in .iofacts,
.memgrid.mem-in .io-status,
.memgrid.mem-in .procsearch,
.memgrid.mem-in .memprocs{animation:mem-body-in var(--mem-in) var(--mem-ease) both}
@media (prefers-reduced-motion: reduce){
  .memgrid.mem-in>.memcard,
  .memgrid.mem-in .memcard>h4,
  .memgrid.mem-in .memover,
  .memgrid.mem-in .memchart,
  .memgrid.mem-in .iochart,
  .memgrid.mem-in .iofacts,
  .memgrid.mem-in .io-status,
  .memgrid.mem-in .procsearch,
  .memgrid.mem-in .memprocs{animation:none}
}
/* HUD 四角：每个卡片四个角的 L 形亮边 */
.memcard::before,.memcard::after,
.memcard>h4::before,.memcard>h4::after{content:"";position:absolute;width:10px;height:10px;
  border-color:rgba(0,220,255,.55);border-style:solid;pointer-events:none}
.memcard::before{top:4px;left:4px;border-width:1.5px 0 0 1.5px}
.memcard::after{top:4px;right:4px;border-width:1.5px 1.5px 0 0}
.memcard>h4::before{bottom:4px;left:4px;border-width:0 0 1.5px 1.5px}
.memcard>h4::after{bottom:4px;right:4px;border-width:0 1.5px 1.5px 0}
.memcard>h4{color:#00e5ff;text-transform:uppercase;letter-spacing:2.5px;font-size:11px;
  text-shadow:0 0 8px rgba(0,229,255,.5);padding-left:4px}
.memcard>h4 .memsort b{color:rgba(0,229,255,.5);letter-spacing:1px}
.memcard>h4 .memsort b.on{color:#00e5ff;text-shadow:0 0 6px rgba(0,229,255,.6)}
.memcard>h4 #memStat{color:rgba(0,229,255,.5)!important;
  font-family:'Consolas','Monaco',monospace;letter-spacing:.5px}
/* 数字：等宽 + 青色发光 */
.memfacts b{color:#e0f7ff;font-family:'Consolas','Monaco',monospace;
  text-shadow:0 0 6px rgba(0,229,255,.4);font-size:14px}
.memfacts span{color:rgba(0,200,255,.55);letter-spacing:1px}
.memfacts i{color:rgba(0,229,255,.45)}
/* 进程频谱条：渐变 + 发光 + 尾部亮斑 */
.memproc .bar{height:8px;background:rgba(0,60,100,.25);border:1px solid rgba(0,150,200,.2)}
.memproc .bar i{background:linear-gradient(90deg,#003d5c,#00b4d8,#00e5ff);
  box-shadow:0 0 8px rgba(0,229,255,.5),0 0 16px rgba(0,229,255,.25);
  position:relative}
.memproc .bar i::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;
  background:#fff;box-shadow:0 0 8px #00e5ff,0 0 14px #00e5ff}
.memproc .nm{color:#b8e8f5;font-family:'Consolas','Monaco',monospace;font-size:12px}
.memproc .val{color:#00e5ff;font-family:'Consolas','Monaco',monospace;
  text-shadow:0 0 6px rgba(0,229,255,.4)}
.memproc .wio.act{color:#ffb347;text-shadow:0 0 6px rgba(255,179,71,.5)}
.memproc .gro.up{color:#ff6b6b;text-shadow:0 0 6px rgba(255,107,107,.4)}
.memproc .gro.hot{color:#ff4444;text-shadow:0 0 8px rgba(255,68,68,.6)}
/* 迷你走势线：青色发光 */
.memproc .spk svg polyline{filter:drop-shadow(0 0 3px rgba(0,229,255,.6))}
.memio{color:rgba(0,229,255,.5);font-family:'Consolas','Monaco',monospace}
.memio.hot{color:#ff6b6b;text-shadow:0 0 8px rgba(255,107,107,.5)}
/* 环形图容器加呼吸光晕 */
.memover .ring{filter:drop-shadow(0 0 12px rgba(0,229,255,.2))}
/* 磁盘 I/O 卡片 */
.iochart{flex:1;min-height:0;min-width:0;position:relative}
.iochart canvas{display:block;width:100%;height:100%}
.iochart canvas{display:block;width:100%;height:100%}
.iofacts{flex:none;display:flex;gap:12px;padding-top:6px;font-size:11px;
  font-family:'Consolas','Monaco',monospace}
.iofacts div{display:flex;flex-direction:column;gap:2px}
.iofacts .lbl{color:rgba(0,229,255,.5);letter-spacing:1px;font-size:10px}
.iofacts .val{color:#00e5ff;text-shadow:0 0 6px rgba(0,229,255,.5);font-size:13px;font-weight:700}
.iofacts .val.write{color:#ffb347;text-shadow:0 0 6px rgba(255,179,71,.5)}
/* 进程搜索框 */
.procsearch{flex:none;padding:4px 0 6px}
.procsearch input{width:100%;box-sizing:border-box;background:rgba(0,40,60,.4);
  border:1px solid rgba(0,200,255,.25);border-radius:4px;color:#b8e8f5;
  padding:5px 8px;font-size:12px;font-family:'Consolas','Monaco',monospace;
  outline:none;transition:border-color .2s,box-shadow .2s}
.procsearch input:focus{border-color:rgba(0,229,255,.6);
  box-shadow:0 0 8px rgba(0,229,255,.2)}
.procsearch input::placeholder{color:rgba(0,200,255,.35)}
/* 结束进程按钮 */
.memproc .kill{flex:none;width:20px;height:20px;border:none;background:transparent;
  color:rgba(255,107,107,.4);cursor:pointer;font-size:14px;line-height:1;
  border-radius:3px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.memproc .kill:hover{color:#ff4444;background:rgba(255,68,68,.15);
  text-shadow:0 0 6px rgba(255,68,68,.6)}
/* ================= 科幻启动序列 + 终端文字 ================= */
.boot-overlay{position:absolute;inset:0;z-index:10;
  background:#040a12;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  font-family:'Consolas','Monaco',monospace;font-size:15px;
  transition:opacity .6s ease;pointer-events:none;overflow:hidden}
.boot-overlay.hide{opacity:0}
.boot-lines{position:relative;width:100%;height:200px;display:flex;
  flex-direction:column;justify-content:center;align-items:center;gap:10px}
.boot-line{color:#00e5ff;text-shadow:0 0 8px rgba(0,229,255,.6);
  letter-spacing:1.5px;opacity:0;transform:scale(1.15);
  transition:opacity .4s ease,transform .4s cubic-bezier(.2,1.4,.4,1)}
.boot-line.show{opacity:1;transform:scale(1)}
.boot-line .ok{color:#00ff88;text-shadow:0 0 8px rgba(0,255,136,.7);margin-left:10px}
.boot-line .done{color:#ffb347;text-shadow:0 0 8px rgba(255,179,71,.7);margin-left:10px}
/* 进程频谱条加长动画 */
.memproc .bar i{display:block;height:100%;width:0;border-radius:var(--s1);
  background:linear-gradient(90deg,#003d5c,#00b4d8,#00e5ff);
  box-shadow:0 0 8px rgba(0,229,255,.5),0 0 16px rgba(0,229,255,.25);
  position:relative;
  transition:width .8s cubic-bezier(.2,.9,.3,1.1)}
/* 磁盘 I/O 卡片底部的持续状态行 */
.io-status{flex:none;padding-top:6px;font-family:'Consolas','Monaco',monospace;
  font-size:11px;color:rgba(0,229,255,.6);letter-spacing:1px;
  border-top:1px solid rgba(0,229,255,.1);margin-top:4px;
  display:flex;align-items:center;gap:6px;min-height:16px;min-width:0}
/* ★ 状态行必须**永远一行**：它每秒换一句话，字数不一样 ——
   以前会折成两行，整张卡的高度跟着抖，下面的波形和数字一起上下跳。
   现在强制不换行、超出用省略号，高度恒定。 */
.io-status>#ioStatusText{flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.io-status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#00e5ff;box-shadow:0 0 6px rgba(0,229,255,.8);
  animation:blink 1.2s ease-in-out infinite}
.io-status .blink{animation:blink 1s steps(2) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.2}}
.memsort b.on{background:rgba(var(--ink),.10);color:var(--text)}
.memsort b:hover{color:var(--text)}
/* 卡头左侧的"整机写盘速率"（float:right 的第二个会排在第一个左边） */
.memio{float:right;margin-right:var(--s3);font-weight:400;font-size:11px;
  color:var(--muted);font-variant-numeric:tabular-nums}
.memio.hot{color:var(--warm)}

/* ---------------- 切盘面板（贴着按钮弹出） ---------------- */
.panel{position:fixed;z-index:60;min-width:280px;padding:var(--s2);border-radius:var(--r);
  /* 半透明毛玻璃：和主内容卡片同一套配方（原来 0.86 太实了） */
  background:var(--panel);
  border:1px solid rgba(var(--ink),.15);
  backdrop-filter:blur(34px) saturate(1.8);
  -webkit-backdrop-filter:blur(34px) saturate(1.8);
  box-shadow:0 22px 60px var(--sh2), inset 0 1px 0 var(--hi);
  opacity:0;transform:translateY(-12px) scale(.97);
  transition:opacity .16s,transform .16s cubic-bezier(.2,1.2,.4,1);
  pointer-events:none}
.panel.on{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.drv{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-radius:var(--r-md);
     cursor:pointer;transition:background .18s}
.drv:hover{background:rgba(var(--ink),.11)}
.drv.cur{background:rgba(91,156,255,.22)}
.drv .ic{width:26px;height:20px;border-radius:var(--r-xs);flex:none;position:relative;
         background:rgba(var(--ink),.13)}
.drv .ic::after{content:"";position:absolute;left:5px;top:6px;right:8px;height:2px;
                border-radius:1px;background:rgba(var(--ink),.45)}
.drv .lt{font-size:14px;font-weight:600;flex:1}
.drv.cur .lt{color:#9a68d9}
.drv .fr{font-size:11px;color:var(--muted);text-align:right;line-height:1.35}
.drv .fr b{display:block;color:var(--text);font-weight:600;font-size:12px}

/* ---------------- 右键菜单（弹在鼠标旁边） ---------------- */
.ctx{position:fixed;z-index:80;min-width:212px;padding:var(--s1);border-radius:var(--r-md);
  background:var(--solid);
  border:1px solid rgba(var(--ink),.17);
  backdrop-filter:blur(30px) saturate(1.7);
  -webkit-backdrop-filter:blur(30px) saturate(1.7);
  box-shadow:0 22px 60px var(--sh3);
  opacity:0;transform:translateY(-8px) scale(.94);transform-origin:top left;
  transition:opacity .13s,transform .13s cubic-bezier(.2,1.3,.4,1);
  pointer-events:none}
.ctx.on{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.ctx div{padding:var(--s2) var(--s3);border-radius:var(--r-sm);font-size:13px;cursor:pointer;
         transition:background .14s;white-space:nowrap}
.ctx div:hover{background:rgba(var(--ink),.11)}
.ctx div.danger{color:var(--danger-t)}
.ctx div.danger:hover{background:rgba(224,108,100,.20)}

/* ---------------- 提示条 ---------------- */
/* 顶栏的图标按钮：跟文字按钮同一套底，只是内容是个 16px 的图标 */
.iconbtn{padding:var(--s2) var(--s3);line-height:0}

#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,24px);
  z-index:90;padding:var(--s3) var(--s5);border-radius:var(--r-md);font-size:13px;
  background:var(--solid);border:1px solid rgba(var(--ink),.18);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 16px 40px var(--sh2);
  opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;
  max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------------- 二次确认弹窗 ----------------
   批量删东西之前必须先问一句。用 scale 属性做入场（不用 transform：
   transform 一旦被 forwards 钉住，后面的过渡就走不动了）。 */
.conf{position:fixed;inset:0;z-index:120;display:flex;align-items:center;
  justify-content:center;background:var(--scrim2);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.conf.on{opacity:1;visibility:visible}
.conf .box{width:min(430px,86vw);padding:var(--s5) var(--s6) var(--s5);border-radius:var(--r);
  background:var(--solid2);border:1px solid rgba(var(--ink),.16);
  box-shadow:0 24px 70px var(--sh3), inset 0 1px 0 var(--hi);
  scale:.92;transition:scale .22s cubic-bezier(.34,1.42,.64,1)}
.conf.on .box{scale:1}
.conf h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.conf .body{font-size:12.5px;color:var(--muted);line-height:1.85}
.conf .body b{color:var(--text);font-size:14px;font-weight:700}
.conf .body em{color:var(--danger-t);font-style:normal;font-weight:700}
.conf .btns{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s5)}
.conf .btns button{padding:var(--s2) var(--s5);border-radius:var(--r-sm);font-size:12.5px}
.conf .btns button.go{background:linear-gradient(180deg,#e0796f,#c8574e);
  border-color:transparent;color:#fff}
.conf .btns button.go:hover{background:linear-gradient(180deg,#ea8b82,#d4635a)}

/* 后端断开时的兜底提示（比浏览器自带的 ERR_CONNECTION_REFUSED 说人话） */
#lost{position:fixed;inset:0;z-index:200;display:flex;align-items:center;
  justify-content:center;background:var(--box2);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.lostbox{text-align:center;padding:34px 44px;border-radius:var(--r);
  background:var(--solid);border:1px solid rgba(var(--ink),.18);
  box-shadow:0 24px 70px var(--sh3);max-width:520px}
.lostbox b{display:block;font-size:17px;margin-bottom:12px;color:var(--danger-t)}
.lostbox span{font-size:13px;color:var(--muted);line-height:1.8}


/* ==================================================================
   ★★ 浅色主题【要撤掉就删到本段结束】★★
   只要 --ink 翻成黑，玻璃卡片/边框/悬浮态就全对了；下面这些是必须单独调的。
   ================================================================== */
:root[data-theme="light"]{
  color-scheme:light;
  --ink:0,0,0;
  --topfade:#E3E3E3;                 /* = Windows 浅色标题栏实测值，不是纯白 */
  --hi:rgba(255,255,255,.95);        /* 上沿高光：白底上要纯白才看得出来 */
  --halo:rgba(255,255,255,.9);
  /* 通透的关键之一：阴影压到几乎看不见，靠"极淡的边"而不是靠投影分层 */
  --sh0:rgba(15,23,42,.05);
  --sh1:rgba(15,23,42,.07);
  --sh2:rgba(15,23,42,.09);
  --sh3:rgba(15,23,42,.11);
  /* 底色：顶部就是纯白，和白色标题栏接上 —— 顶部那层渐变因此完全看不见 */
  --bg:#FFFFFF; --bg2:#E9F2FB;      /* 下半部给一点真实颜色，卡片透过去才看得见层次 */
  /* 分层靠"透明度差"：大卡更透（透出彩球），行卡更白（读起来清楚） */
  /* 遮蔽率的算法：两层叠加后对底色的遮挡 = 1-(1-a)(1-b)。
     行卡 .60 + 大卡 .30 => 72%，仍然透得出背景，但文字已经足够清楚。 */
  --card:rgba(255,255,255,.30);
  --panel:rgba(255,255,255,.68);
  --box:rgba(255,255,255,.86);
  --box2:rgba(255,255,255,.94);
  --scrim:rgba(20,26,40,.20);
  --scrim2:rgba(20,26,40,.32);
  /* 卡片不用纯白：带一点冷蓝的白在纯白背景上也能读出"这是玻璃"；
     纯白叠纯白的话，把 alpha 调到多少都还是白。 */
  --glass:rgba(248,251,255,.50);     /* 行卡 / 方块卡 */
  --glass-hi:rgba(255,255,255,.72);  /* 悬停时再实一点 */
  --stroke:rgba(15,23,42,.07);       /* 边缘极淡，不再是深蓝线 */
  --solid:rgba(255,255,255,.95);
  --solid2:rgba(255,255,255,.98);
  --text:#111827; --muted:#6B7280;
  --name:#1F2937; --note:#4B5563;
  --accent:#0E86AE;
  --safe:#12854B; --caut:#96620A; --danger:#C0392B;
  --danger-t:#B0342A;
  --warm:#9A5F17;
  --bar1:#5BA3B8; --bar2:#3AA5CC;
}
/* ★ 浅色下文件行原来的底色是 rgba(var(--ink),.035)（= 3.5% 的黑），
   白底上等于看不见；改成白色底，只比目录行（--glass .60）淡一点点。 */
:root[data-theme="light"] .row.file,
:root[data-theme="light"] .tile.file{background:rgba(246,250,255,.44)}
:root[data-theme="light"] .row.file:hover{background:rgba(255,255,255,.72)}

/* ★ 浅色下"选中"不要变成纯白：底色铺一层淡主色（配合主色描边和左侧色条），
   在白底上一样清楚，但不会出现"未选中半透明、选中一块白"的跳变。 */
:root[data-theme="light"] .row.sel{
  background:linear-gradient(rgba(14,134,174,.10), rgba(14,134,174,.10)),
             rgba(255,255,255,.72)}

/* 背景彩球：用「饱和色 + 自带 alpha」。有效透明度 = 关键帧 opacity × 这里的 alpha，
   所以颜色看得见，整页又不会被压灰。之前用极淡的实色（#DCE7F7 这种）——
   它们比白底还暗，八团叠起来就是一层均匀的灰，既没颜色也不通透。 */
/* 不透明彩球，浓淡全交给关键帧的 opacity（和暗色一套机制）。
   之前是"颜色带 alpha × 关键帧 opacity"，等于压了两遍，淡到看不见。 */
:root[data-theme="light"] .b1{background:#7EA9F0}
:root[data-theme="light"] .b2{background:#B08CF0}
:root[data-theme="light"] .b3{background:#5CD0AA}
:root[data-theme="light"] .b4{background:#F08CC8}
:root[data-theme="light"] .b5{background:#848EF0}
:root[data-theme="light"] .b6{background:#66C2EB}
:root[data-theme="light"] .b7{background:#D68CF0}
:root[data-theme="light"] .b8{background:#F0B078}

/* ★ 浅色顶部的接缝
   标题栏那条颜色改不了（Chromium 自己画的，DWM 两个接口实测都无效），
   所以渐变必须从「它的实际颜色」起步，否则就是一条硬台阶：
       系统浅色 -> 标题栏 #E3E3E3（实测值）
       系统深色 -> 标题栏 #000
   用媒体查询分两套。注意：这里只改背景渐变的起点色，顶栏本身还是浅色的。
   色带问题一并处理：28 级色差摊在 ~130px 上，每级约 4.7px，8bit 下必然看出
   横向条纹 —— 叠一层 32×32 抖动噪点打散，平均色不变。 */
:root[data-theme="light"]{
  --topfade:#E3E3E3;
  --f1:rgba(227,227,227,1);   --f2:rgba(227,227,227,.90);
  --f3:rgba(227,227,227,.70); --f4:rgba(227,227,227,.44);
  --f5:rgba(227,227,227,.19); --f0:rgba(227,227,227,0);
}
@media (prefers-color-scheme: dark){
  /* 系统是深色、但手动选了浅色主题：标题栏还是黑的，那渐变就从黑起 */
  :root[data-theme="light"]{
    --topfade:#000;
    --f1:rgba(0,0,0,1);   --f2:rgba(0,0,0,.90);
    --f3:rgba(0,0,0,.70); --f4:rgba(0,0,0,.44);
    --f5:rgba(0,0,0,.19); --f0:rgba(0,0,0,0);
  }
}
:root[data-theme="light"] .bg::after{
  background-image:
    url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABt0lEQVR42pVX0Q4CMQgbZPH//3g+mCnXtAVNLp7nZKO0BWOt9TrnLHxFxDrnrIh4PJ+uZevYK2sQFfgGrEHveny/ayLiERPv75UuI7xnGd+D3QsTUZ9vzD2BG7+v9+yAWAK3JllwhKkGqSWph1H1xxIhGtGR0JGNbaR+o5BOfIBZs5OrjbE0rnTfEjAYEWa2McsUN8E4SNqI+HBgol3HZlYuTKqiUdFJxdYamOm5ZqUOrPhQyZwqM0QG66s2rZt0Un34gKo5ksyVhRHNoXnO+ciwMxCVcSdJxfwaOxlTXQOqSHT+jwRl9r6nnc6ZiyOn405EPLuh616slgpapxIk6HY+gBBKIpmDdJ6SqEtnMP+0W2ff9T6VB2C2SqpuWHEyvL/ZLDCDcTqeudGMETqZNCY1nsq2I2YqwilTUWio9qys+jsTTtqvakiTFo2TFMbfXYZIIEc2PKSbJ1oVdEgw5leTYQpiye5OPv/CPumClISsaTgnm2Q3cchk45LSr4JdSVihUhPNrueziXky/zGe0An8nPOazHTOTCbr5PBS/5io2a37b9AZkpL0WuuHQJdRl5UaubqyvgEMJaagoI9mAAAAAABJRU5ErkJggg=="),

/* ==================================================================
   ★★ 交互反馈：弹簧按压 + 点击波纹【要撤掉就删到本段结束】★★
   按下瞬间快速缩到 --press、阴影同时收小；松开走一条带过冲的曲线弹回来
   （cubic-bezier 的第二个控制点 >1 就是过冲），所以有一点点 Q 弹，
   不是线性缩放。波纹从鼠标落点扩散，被卡片的圆角裁掉。
   ================================================================== */
.row,.tile,.lg,.clog,.memproc,.tab,.crumbs span,.memsort b{

.row,.tile,.lg{

/* ==================== 交互反馈到此结束 ==================== */
/* 光斑的柔边用 mask 做：一次光栅化，之后只动 transform，
   不像 filter:blur() 那样每帧重算（60fps 就是这么回来的） */
.blob{
 /* ★ 这串停靠点是按高斯算的，不是随手拉的三个点：
    原来是 filter:blur(84px)，球半径 280、盒子 560；换算到"盒子放大 1.6 倍后"
    的新盒子里就是 σ=0.1875R、球缘在 0.625R。下面每个点 =
    0.5*(1-erf((u-0.625)/0.1875))，肉眼看和 blur(84px) 一样；
    但它是静态图，不会像 filter 那样每帧重算模糊（那才是 7.6fps 的原因）。 */
 -webkit-mask-image:radial-gradient(closest-side,
   #000 0%, #000 25%, rgba(0,0,0,.955) 40%, rgba(0,0,0,.826) 50%,
   rgba(0,0,0,.714) 55%, rgba(0,0,0,.5) 62.5%, rgba(0,0,0,.286) 70%,
   rgba(0,0,0,.174) 75%, rgba(0,0,0,.071) 82%, rgba(0,0,0,.018) 90%,
   rgba(0,0,0,.005) 96%, transparent 100%);
 mask-image:radial-gradient(closest-side,
   #000 0%, #000 25%, rgba(0,0,0,.955) 40%, rgba(0,0,0,.826) 50%,
   rgba(0,0,0,.714) 55%, rgba(0,0,0,.5) 62.5%, rgba(0,0,0,.286) 70%,
   rgba(0,0,0,.174) 75%, rgba(0,0,0,.071) 82%, rgba(0,0,0,.018) 90%,
   rgba(0,0,0,.005) 96%, transparent 100%)}
</style>
</head>

<script>
"use strict";
const $  = s => document.querySelector(s);
const listEl = $('#list'), subEl = $('#sub'), ttlEl = $('#ttl'),
      hintEl = $('#hint'), crumbEl = $('#crumbs'), actsEl = $('#acts'),
      tabsEl = $('#tabs'), barEl = $('#tabBar'),
      backEl = $('#backBtn'), listHeadEl = $('#listhead');

let TAB = -9;             // ★ 初值不能是 0：switchTab(0) 撞上「已经是这页就返回」会空转
                          //   （原来用 #tab=0 深链进来时列表一直停在加载中）
let path = null;          // 排行页当前目录
let GROUP = null;         // 类型分布：下钻到的分类
let EXT = null;           // 类型分布：再下钻到的扩展名
let QUERY = '';           // 搜索词
let poller = null;        // 轮询定时器
let lastToast = '';
let DIR = 0;              // 列表入场方向：1=从右（进下一层）-1=从左（返回上层）0=从上方
let PREV_RANK;            // 上一次排行页的路径，用来判断是进还是退
let SEL = -1;             // 键盘选中的行下标
let CONF = null;          // 确认弹窗的关闭函数（开着的时候键盘要让它优先）

/* ---------------- 工具 ---------------- */
function fmt(n){
  if(n === null || n === undefined) return '—';
  n = Number(n);
  const u = ['B','KB','MB','GB','TB','PB']; let i = 0;
  while(n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : (n >= 100 ? n.toFixed(0) : n.toFixed(1))) + ' ' + u[i];
}
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* 路径只显示结尾那一段才有信息量，但 CSS 的 rtl 截断不会补省略号、
   看起来像路径坏了 —— 自己按字符数截，前面补一个 … */
function tailPath(p, n){
  p = String(p == null ? '' : p);
  return p.length > n ? '…' + p.slice(-(n - 1)) : p;
}

/* ---------------- 路径按真实宽度做「中间省略」 ----------------
   原来的 tailPath() 是按**字符数**硬砍，两个毛病：
     · 不管元素实际有多宽（宽屏也照样砍、窄屏照样溢出）
     · 只留尾巴，把盘符和开头丢掉了（C:\ 是最该看见的信息之一）
   这里用 canvas 量真实像素宽度，二分出能塞下的长度，
   前面留 38%、后面留 62%（越深的目录越有用），两头都保住。
   元素上存 data-full，窗口一变重新算。 */
const _mctx = document.createElement('canvas').getContext('2d');

function fitText(el, full, pre){
  pre = pre || '';
  full = String(full == null ? '' : full);
  el.textContent = pre + full;
  const w = el.clientWidth;
  if(w <= 8 || !full) return;
  const cs = getComputedStyle(el);
  _mctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
  if(_mctx.measureText(pre + full).width <= w - 2) return;    // 塞得下就不动
  const cut = k => {
    const h = Math.max(1, Math.round(k * 0.38)), t = k - h;
    return pre + full.slice(0, h) + '…' + (t > 0 ? full.slice(-t) : '');
  };
  let lo = 1, hi = full.length - 1;
  while(lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if(_mctx.measureText(cut(mid)).width <= w - 2) lo = mid; else hi = mid - 1;
  }
  el.textContent = cut(lo);
}

function fitAll(){
  listEl.querySelectorAll('[data-fit]').forEach(el => {
    // 有前缀的（搜索页的「文件夹 · 」）要连着前缀一起量，不然会算宽
    const pre = el.dataset.prefix || '';
    const full = el.dataset.full || (el.textContent.slice(pre.length));
    el.dataset.full = full;
    fitText(el, full, pre);
  });
}
window.addEventListener('resize', () => { if(listEl) fitAll(); });

/* ---------------- 文件类型图标 ----------------

  '<path d="M3.2 17.4l4.4-4.4 3.4 3.4 2.8-2.8 4 4"/>',
  // 3 文档：折角纸 + 三行字
  '<path d="M4.2 2.6h7.6l4 4v14.8H4.2z"/><path d="M11.8 2.6v4h4"/>' +
  '<path d="M7 11.4h6M7 14.6h6M7 17.8h3.6"/>',
  // 4 压缩包：竖拉链

];
const FOLDER_SVG = '<path d="M2.4 5.6a2 2 0 012-2h3.4l2 2.6h5.8a2 2 0 012 2v10.2' +
  'a2 2 0 01-2 2H4.4a2 2 0 01-2-2z"/>';

// 文件夹图标统一用这个柔和的蓝紫（浅色主题下取 pal().dir，会深一档）

/* 排行页左边那一格：排名数字（可选）+ 图标。
   文件行不显示排名，但留一个同宽的空位，保证两种行的名字左边缘对齐。 */
/* 图标取不到时不留空白 —— 退回首字母色块。
   ★ 原来 onerror 只是 this.style.display='none'，那一格就空了，
     看起来像"图标识别坏了"。有东西总比空白强，还能一眼认出是哪个软件。 */
const AVA_COLORS = ['#5B8FF9', '#5AD8A6', '#F6BD16', '#7262FD',
                    '#78D3F8', '#9661BC', '#F6903D', '#F08BB4'];
function icoFail(el, name){
  if(el && el.parentNode) el.outerHTML = avatar(name);
}
function avatar(name){
  const n = String(name || '?').trim() || '?';
  const m = n.match(/[A-Za-z0-9]/);
  const ch = (m ? m[0] : (n[0] || '?')).toUpperCase();
  let h = 0;
  for(let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
  return '<i class="ico av" style="background:' + AVA_COLORS[h % AVA_COLORS.length] +

async function api(p){
  let r;

  catch(e){
    // 切目录/刷新时被打断的请求会以 TypeError(Failed to fetch) 抛出，
    // 以前没人接就是一个 unhandled rejection（实测切一次目录能刷一百多条）。
    return {error: '连接中断：' + (e && e.message || e)};
  }
  if(!r.ok) return {error: 'HTTP ' + r.status};
